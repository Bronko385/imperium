<style>
/* Comic-Nachtstadt über echtem Stadtplan: Karte füllt den Bildschirm, Viertel-Leiste darunter, Aktionen im Pop-up. */
:root{
  --ink:#11132a; --night:#1e2250; --night2:#282d66; --panel:#30367a; --panel2:#3a4190; --locked:#232756;
  --paper:#fff4d6; --muted:#c3bfe6; --faint:#7d79a8;
  --yellow:#ffd23f; --pink:#ff5d8f; --brown:#f0a060; --teal:#3cc6e8;
  --dirty:#cfe24f; --clean:#5be6b4; --crypto:#bfa2ff; --heat:#ff5a3d; --river:#3b6fd6;
  --f-display:'Bangers','Impact','Arial Black',sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--night);background-image:radial-gradient(rgba(255,244,214,.06) 1px,transparent 1.5px);background-size:11px 11px;color:var(--paper);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* HUD */
.hud{flex:none;padding:8px 16px;display:grid;gap:7px;background:var(--night);border-bottom:3px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:8px}
.logo{font-family:var(--f-display);font-size:26px;letter-spacing:.05em;color:var(--yellow);text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);transform:rotate(-2deg);display:inline-block}
.city{font-family:var(--f-display);font-size:17px;letter-spacing:.06em;color:var(--pink)}
.clock{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.m{background:var(--night2);border:2px solid var(--ink);border-radius:10px;padding:3px 8px;min-width:0}
.m small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.m b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m.dirty b{color:var(--dirty)} .m.clean b{color:var(--clean)} .m.crypto b{color:var(--crypto)}
.heat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.heat small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meter{height:11px;background:var(--night2);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--heat));transition:width .4s}
.heat b{font-variant-numeric:tabular-nums;font-size:13px;min-width:3ch;text-align:right}
.heat.hot b{color:var(--heat)}

/* Hauptbereich */
main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
main>*{flex-shrink:0}
main.split{overflow:hidden;padding-block:10px;gap:10px}
h2,h3{font-family:var(--f-display);letter-spacing:.05em;font-weight:400;margin:0;text-wrap:balance}
h2{font-size:25px;color:var(--yellow)} h3{font-size:20px}
p{margin:0;line-height:1.45}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:14px;display:grid;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}
.num{font-variant-numeric:tabular-nums}
.c-dirty{color:var(--dirty)} .c-clean{color:var(--clean)} .c-crypto{color:var(--crypto)} .c-heat{color:var(--heat)} .c-yellow{color:var(--yellow)}

.btn{font-family:var(--f-display);letter-spacing:.06em;font-size:17px;line-height:1;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:9px 12px;cursor:pointer;touch-action:manipulation}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.pink{background:var(--pink)} .btn.teal{background:var(--teal)} .btn.mint{background:var(--clean)} .btn.violet{background:var(--crypto)}
.btn.ghost{background:var(--night2);color:var(--paper)}
.btn.sm{font-size:15px;padding:7px 10px}
.btn.wide{width:100%}
.btn.big{font-size:26px;padding:14px 18px}
.btn .sub{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:0;margin-top:3px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{background:var(--night2);border:0;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--crypto);color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}

/* Karte */
.mapbox{position:relative;flex:1 1 auto;flex-shrink:1;min-height:220px;background:#191c45;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#mapsvg.drag{cursor:grabbing}
#mapsvg .t-base{fill:var(--panel);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
#mapsvg .t-lock{fill:url(#hatch);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
#mapsvg .t-own{stroke:none;pointer-events:none}
#mapsvg .t-sel{fill:none;stroke:var(--yellow);stroke-width:4;stroke-linejoin:round;pointer-events:none}
#mapsvg .t-alarm{fill:none;stroke:var(--heat);stroke-width:4;pointer-events:none;animation:blink .8s steps(2) infinite}
#mapsvg .water{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#mapsvg .lake{fill:var(--river);pointer-events:none}
#mapsvg .runway{stroke:#4a4f8f;stroke-width:3;stroke-linecap:round;pointer-events:none}
#mapsvg .border{fill:none;stroke:var(--ink);stroke-width:4;pointer-events:none}
#mapsvg .mk{pointer-events:none}
#mapsvg .lbl{font-family:var(--f-display);font-size:13px;letter-spacing:.04em;fill:var(--paper);paint-order:stroke;stroke:var(--ink);stroke-width:3px;stroke-linejoin:round}
#mapsvg .lbl.lock{font-family:var(--f-body);font-style:italic;font-size:10px;letter-spacing:0;fill:var(--faint);stroke-width:2.5px}
#mapsvg .wlbl{font-family:var(--f-body);font-style:italic;font-size:9px;fill:var(--river);paint-order:stroke;stroke:#191c45;stroke-width:2px}
#mapsvg .dot{stroke:var(--ink);stroke-width:1.8}
#mapsvg .dot.empty{fill:var(--night)}
#mapsvg.far .lbl,#mapsvg.far .wlbl{display:none}
@keyframes blink{50%{opacity:0}}
.mapui{position:absolute;top:8px;right:8px;display:grid;gap:6px}
.mapui button{width:38px;height:38px;border-radius:10px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.mapui button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.chips{position:absolute;top:8px;left:8px;right:54px;display:grid;justify-items:start;gap:5px;pointer-events:none}
.chipb{max-width:100%;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;font-size:11.5px;font-weight:500;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.chipb b{font-family:var(--f-display);font-weight:400;letter-spacing:.05em;font-size:13px;margin-right:3px}
.chipb.event{background:var(--teal)} .chipb.rev{background:var(--pink)}
.collectbtn{position:absolute;left:8px;bottom:8px;right:8px}
.collectbtn .btn{box-shadow:3px 3px 0 var(--ink)}
.collectbtn.full .btn{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.hint{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(17,19,42,.75);padding:3px 8px;border-radius:8px;pointer-events:none;white-space:nowrap}

/* Viertel-Leiste */
.dbar{flex:none;background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px 12px;display:grid;gap:8px}
.dbar .top{display:flex;align-items:baseline;gap:8px;min-width:0}
.dbar h2{font-size:22px;white-space:nowrap}
.dbar .bon{font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip{display:inline-block;font-size:11px;font-weight:700;color:var(--ink);padding:2px 7px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.slotrow{display:grid;gap:7px}
.sc{position:relative;min-width:0;background:var(--night2);border:2px solid var(--ink);border-radius:11px;padding:8px 4px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer;text-align:center;overflow:hidden}
.sc:active{transform:translate(1px,1px)}
.sc .stripe{position:absolute;left:0;right:0;top:0;height:5px}
.sc .ic{font-size:24px;line-height:1.1}
.sc .nm{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc .st{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc.free{border-style:dashed;background:transparent}
.sc.free .ic{color:var(--yellow);font-family:var(--f-display);font-size:26px}
.sc .mini{width:80%;height:5px;background:var(--night);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-top:2px}
.sc .mini i{display:block;height:100%;background:var(--dirty)}
.sc.ready{outline:2px solid var(--dirty)}

/* Pop-up Inhalte */
.bar{height:9px;background:var(--night);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dirty)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.buildlist{display:grid;gap:6px}
.bopt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--night2);border:2px solid var(--ink);border-radius:10px;padding:8px}
.bopt .ico{font-size:22px}
.bopt b{font-size:14px} .bopt span{display:block;font-size:11.5px;color:var(--muted)}
.shead{display:flex;align-items:center;gap:12px}
.shead .ico{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:var(--night2);border:2px solid var(--ink);border-radius:12px;flex:none}
.shead h3{font-size:24px;color:var(--yellow)}
.shead p{font-size:12px;color:var(--muted)}
.kv{display:grid;gap:4px}
.kv div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}

/* Listen */
.crewgrid{display:grid;gap:10px}
.crew{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.crew .ico{font-size:30px;width:50px;height:50px;display:grid;place-items:center;background:var(--night2);border:2px solid var(--ink);border-radius:12px}
.crew .cnt{font-family:var(--f-display);font-size:28px;color:var(--yellow);min-width:2ch;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--night2);border:2px solid var(--ink);border-radius:10px;padding:8px;text-align:center;min-width:0}
.stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:400;letter-spacing:.04em;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.pnl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pnl div{background:var(--night2);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.pnl small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pnl b{font-size:17px;font-variant-numeric:tabular-nums}
.pnl .big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pnl .big b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.04em}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fe{background:var(--panel);border:2px solid var(--ink);border-left-width:8px;border-radius:10px;padding:9px 10px;display:grid;gap:6px}
.fe.atk{border-left-color:var(--heat)} .fe.win{border-left-color:var(--yellow)} .fe.ev{border-left-color:var(--teal)} .fe.info{border-left-color:var(--muted)} .fe.cop{border-left-color:var(--pink)}
.fe time{font-size:11px;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rk{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;background:var(--night2);border:2px solid var(--ink);border-radius:12px;padding:10px}
.rk .pos{font-family:var(--f-display);font-size:26px;width:1.4em;text-align:center}
.rk .sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.rk b{display:block} .rk span{font-size:12px;color:var(--muted)}
.rk .w{font-variant-numeric:tabular-nums;font-weight:700}
.rk.me{background:var(--panel2);outline:3px solid var(--yellow)}

/* Tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px 8px;background:var(--night);border-top:3px solid var(--ink)}
.tab{position:relative;background:none;border:2px solid transparent;border-radius:10px;padding:5px 2px;display:grid;justify-items:center;gap:1px;cursor:pointer;color:var(--muted)}
.tab .i{font-size:20px}
.tab .l{font-family:var(--f-display);letter-spacing:.06em;font-size:14px}
.tab.on{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.badge{position:absolute;top:0;right:12%;background:var(--heat);color:var(--paper);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--ink);padding:0 3px}

/* Toasts */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;justify-items:center;gap:6px;pointer-events:none;z-index:30;padding:0 16px}
.toast{max-width:420px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:9px 13px;font-weight:500;transform:rotate(-1deg);animation:pop .25s ease-out}
.toast.bad{background:var(--pink)} .toast.good{background:var(--yellow)} .toast.ev{background:var(--teal)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}}

/* Modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,11,30,.72);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.mbox{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--panel);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:16px;display:grid;gap:12px;animation:pop .2s ease-out;-webkit-overflow-scrolling:touch}
.mbox .gt{font-size:34px;color:var(--yellow);text-shadow:2px 2px 0 var(--ink);text-align:center;transform:rotate(-2deg)}
.mbox .subt{text-align:center;color:var(--muted)}
.track{position:relative;height:58px;background:var(--night);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--clean) 0 8px,#3fcf9c 8px 16px);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.needle{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--yellow);border:2px solid var(--ink);border-radius:3px}
.gdots{display:flex;justify-content:center;gap:10px}
.gdots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--night2)}
.gdots i.hit{background:var(--clean)} .gdots i.miss{background:var(--heat)}
.fb{text-align:center;font-family:var(--f-display);font-size:26px;letter-spacing:.06em;min-height:32px}
.res{text-align:center}
.res .boom{font-family:var(--f-display);font-size:40px;letter-spacing:.05em;transform:rotate(-3deg);text-shadow:3px 3px 0 var(--ink)}
.res .boom.ok{color:var(--yellow)} .res .boom.no{color:var(--heat)}
.res .loot{font-size:22px;font-weight:700}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:8px;background:var(--night2);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}

@media (prefers-reduced-motion:reduce){
  .collectbtn.full .btn,#mapsvg .t-alarm,.toast,.mbox{animation:none}
}

/* Eigenständige Seite: Grundgerüst, das sonst der Artefakt-Rahmen liefert */
:root{padding:0!important;height:100%}
html,body{height:100%;overflow:hidden}
#app{position:fixed;top:0;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:auto;padding-top:env(safe-area-inset-top,0px)}
.tabs{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
/* Kopfzeile: einzeilig */
.brand{flex-wrap:nowrap;min-width:0}
.logo{font-size:24px;flex:none}
.city{font-size:15px;flex:none}
.clock{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;text-align:right}
.clock .gname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--paper);font-weight:500;font-size:inherit;background:none;border:0;padding:6px 0 4px 10px;margin:-6px 0 -4px;cursor:pointer;touch-action:manipulation;text-align:right}
.clock .onl{font-size:10.5px;color:var(--muted)}
@media (max-width:370px){.city{display:none}}
/* Karte: Kontrast spielbar/gesperrt */
#mapsvg .t-base{fill:#3a4296}
#mapsvg .t-lock{opacity:.75}
#mapsvg .t-mine{fill:none;stroke-width:3;stroke-dasharray:6 4;pointer-events:none;opacity:.95}
/* Ab 4.6.2: nur noch ⌖ oben rechts, gezoomt wird mit zwei Fingern */
.mapui{top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.mapui button{width:32px;height:32px;font-size:17px;border-width:2px;border-radius:8px}
/* Kassieren-Knopf als Pille */
.collectbtn{left:auto;right:8px;bottom:8px}
.collectbtn .btn{font-size:15px;padding:8px 12px}
/* Plätze */
.sc .loot{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc .loot.hot{color:var(--dirty);font-weight:700}
/* Feste Höhen: Karte und Viertel-Leiste springen nicht mehr */
.dbar{height:168px;grid-template-rows:28px 1fr;align-content:stretch}
.dbar .top{height:28px;overflow:hidden;align-items:center}
.dbar h2{line-height:28px}
.slotrow{height:100%}
.sc{height:104px;align-content:start;grid-template-rows:30px 17px 15px 15px;padding-top:9px}
.sc .ic{line-height:30px;height:30px}
.sc .nm,.sc .st,.sc .loot{line-height:15px;height:15px}
.sc .mini{align-self:center}
/* Ab Beta 4.6.2: Bandenname in der Viertel-Leiste darf zweizeilig umbrechen */

function hash(n){let x=Math.imul(n^0x9e3779b9,0x85ebca6b);x^=x>>>13;x=Math.imul(x,0xc2b2ae35);x^=x>>>16;return (x>>>0)/4294967296}
function vnoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i)*(1-u)+hash(i+1)*u}
/* BratCoin bis 4.3.1: nur feste Wellen. Ab 4.4 sind die Wellen auf 20 % gedämpft,
   dazu kommt der Handelsdruck aus der Datenbank (Käufe, Verkäufe, Nachrichten, Razzien). */
function waveLog(ms){
  const h=ms/HOUR, T=Math.PI*2;
  return .22*Math.sin(T*h/19+1.3)+.14*Math.sin(T*h/7.3+4.1)+.08*Math.sin(T*h/2.2+.7)+.035*Math.sin(T*h/.6+2.2)+.06*(vnoise(h*4)-.5);
}
const COIN_WAVE=.2, COIN_HALF=6*HOUR, COIN_CAP=Math.log(1.2), COIN_STEP=.01, COIN_MAXT=.05;
let coinMoves=[]; // Kursbewegungen der letzten Stunden: {ts,s0,s1,kind}, sortiert nach Zeit
function decayS(s,dt){return s*Math.pow(.5,dt/COIN_HALF)}
function pressureAt(ms){
  if(!coinMoves.length)return 0;
  let m=null; for(const x of coinMoves){if(+x.ts<=ms)m=x;else break}
  if(m)return decayS(+m.s1,ms-(+m.ts));
  const f=coinMoves[0]; return clamp(decayS(+f.s0,ms-(+f.ts)),-.6,.6);
}
function priceAt(ms){return 100*Math.exp(COIN_WAVE*waveLog(ms)+pressureAt(ms))}
/* Kurseffekt eines Handels: 1 % je 10.000, höchstens 5 % */
function tradeLog(v){return Math.log(1+Math.min(COIN_MAXT,COIN_STEP*Math.max(0,v)/1e4))}
function eventAt(ms){
  const w=Math.floor(ms/(3*HOUR)), r=hash(w*7+3);
  if(r<.4&&(ms%(3*HOUR))<2*HOUR){const e=TIMED[Math.floor(hash(w*13+1)*TIMED.length)];return {...e,until:(w*3+2)*HOUR}}
  return null;
}

  if(saving){saveAgain=true;return}
  saving=true;
  try{
    me.last_seen=now(); normGuards(); ensureWeek();
    const patch=patchOf(me,true);
    // Hitze-Vorwarnung wieder scharf schalten, sobald keine Razzia mehr in Sicht ist
    if(!document.hidden)patch.fg_at=me.last_seen; // ab 4.6.7: ein verstecktes Spiel lässt fg_at in Ruhe
    if(heatSafe())patch.heat_notified=false;
    if(energyNow()<EMAX)patch.energy_notified=false;
    if(me.wash_pool!=null){clampPool();patch.wash_pool=me.wash_pool}
    if(srvMoney())MONEY_F.forEach(k=>delete patch[k]); // ab 5.0.4: Geld schreibt nur der Server
    if(srvFight())FIGHT_NO.forEach(k=>delete patch[k]); // ab 5.1.1: Kampfwerte auch
    if(srvShop())SHOP_NO.forEach(k=>delete patch[k]); // ab 5.1.2: Ware, Boss, Heimat usw. auch
    const send=patchDiff(patch);
    await q(sb.from('players').update(send).eq('id',me.id));
    markSaved(send);
    setNet(true);
  }catch(e){setNet(false);console.warn(e)}
  saving=false;
  if(saveAgain){saveAgain=false;savePlayer()}
}
let netOk=true;
function setNet(ok){if(ok!==netOk){netOk=ok;renderHUD()}}

/* ---------- Spielmechanik ---------- */
function evMult(s,d){
  const e=eventAt(now()); if(!e)return 1;
  if(e.id==='messe'&&s.type==='hehler')return 1.6;
  if(e.id==='rip'&&s.type==='club')return 2;
  return 1;
}
function prod0(s,d){const T=TYPES[s.type];return (T.bar||0)*lvlM(s.lvl)*(d.bon[s.type]||1)*evMult(s,d)*lmBon(s.owner,s.type)}
function prod(s,d){return prod0(s,d)*festMul(d,now())*lifeMul(s.type,d,now())}
function washOf(s,d,t){const T=TYPES[s.type];return (T.wash||0)*lvlM(s.lvl)*(d.bon[s.type]||1)*(me&&s.owner===me.id?bossWashMul():1)*lifeWash(s.type,d,t||now())}
function rentOf(s,d){const T=TYPES[s.type];return (T.rent||0)*lvlM(s.lvl)*(d.bon[s.type]||1)*evMult(s,d)}
function heatOf(s,d){return TYPES[s.type].heat*s.lvl*(d.heat||1)}
function cap(s,d){return prod(s,d)*CAP_H}
function wareRate(s){const T=TYPES[s.type];return (T.rate||0)*lvlM(s.lvl)}
function wareCap(s){return wareRate(s)*CAP_H}
function wareStock(s,d){if(!s||!s.owner||TYPES[s.type].kind!=='ware')return 0;return Math.min(wareCap(s),(+s.stock||0)+wareRate(s)*Math.max(0,now()-Math.max(+s.stock_at||now(),+s.lahm||0))/HOUR)}
function hasW(p,k){return Math.floor(+((p&&p.ware)||{})[k]||0)}
function hasG(p,k){return Math.floor(+((p&&p.gear)||{})[k]||0)}
function addWare(k,n){me.ware={...(me.ware||{}),[k]:Math.max(0,hasW(me,k)+Math.round(n))}}
function addGear(k,n){me.gear={...(me.gear||{}),[k]:clamp(hasG(me,k)+n,0,GEAR_MAX)}}
function wareTxt(w){return Object.keys(WARE).filter(k=>(w[k]||0)>0).map(k=>`${WARE[k].ico} ${w[k]} ${WARE[k].name}`).join(', ')}
function curStock(s,d){if(!s||!s.owner||TYPES[s.type].kind!=='racket')return 0;const a=Math.max(+s.stock_at||now(),+s.lahm||0);return Math.min(cap(s,d),(+s.stock||0)+prod0(s,d)*Math.max(0,lifeInt(s,d,a,now()))/HOUR)}
function controller(d){
  const c={}; slotsOfD(d).forEach(s=>{if(s&&s.owner)c[s.owner]=(c[s.owner]||0)+1});
  // Ab 4.4: mindestens die Hälfte der Plätze und mehr als jede andere Bande
  for(const o in c){if(c[o]>=d.n/2&&Object.keys(c).every(x=>x===o||c[x]<c[o]))return o}
  return null;
}
function eachS(fn){D.forEach(d=>{for(let i=0;i<d.n;i++){const s=slotOf(d.id,i);if(s&&s.owner)fn(s,d,i)}})}
function mySlots(){const a=[];if(me)eachS((s,d,i)=>{if(s.owner===me.id)a.push([s,d,i])});return a}
function totalStock(){let t=0;mySlots().forEach(([s,d])=>t+=curStock(s,d));return t}
function washCap(){let w=0;mySlots().forEach(([s,d])=>{if(TYPES[s.type].kind==='front')w+=washOf(s,d)});return w}
function upkeepOf(c){let u=0;for(const k in CREW)u+=(c[k]||0)*CREW[k].up;return u}
/* ---------- Polizei (ab Beta 3.4): Abbau 5 pro Std., jeder Anwalt 4 ---------- */
const HEAT_BASE=5, HEAT_LAW=4;
/* Ab Beta 5.1 (wie eco.js): Läden heizen nur bis 80, darüber nur Taten. Über 80 sinkt die Hitze um mindestens 10 pro Std.,
   machen die Läden Plus, aber nicht unter 80. Bei 100 kommt die große Razzia sofort und mit ihr 2 Std. Knast. */
const HEAT_CAP=80, TAT_DECAY=10;
function heatStep(h,net,dt){if(h<HEAT_CAP)return net>0?Math.min(HEAT_CAP,h+net*dt):clamp(h+net*dt,0,100);return clamp(h-Math.max(TAT_DECAY,-net)*dt,net>0?HEAT_CAP:0,100)}
function heatDecay(c,o){c=c||me.crew;o=o||(me&&me.id);return (HEAT_BASE+(c.a||0)*HEAT_LAW+bossHeatBonus(o))*(holds(o,'tiergarten')?1.2:1)}
function heatGainOf(o){let g=0;eachS((s,d)=>{if(s.owner===o)g+=heatOf(s,d)});return g}
function heatNet(){return heatGainOf(me.id)-heatDecay()}
/* Hitze einer anderen Bande hochrechnen (gespeichert wird sie nur, wenn sie online ist) */
function heatGuess(o){
  if(me&&o===me.id)return me.heat;
  const p=players[o]; if(!p||p._pub)return 0;
  const net=heatGainOf(o)-heatDecay(p.crew||{},o), since=Math.max(0,now()-(+p.eco_at||now()))/HOUR;
  return heatStep(clamp(+p.heat||0,0,100),net,since);
}
function flames(h){return h>=80?'🔥🔥🔥':h>=60?'🔥🔥':h>=30?'🔥':''}
function heatWord(h){return h>=80?'sehr heiß':h>=60?'heiß':h>=30?'unter Beobachtung':'unauffällig'}
/* Stunden bis zur Razzia-Schwelle 80 (Infinity, wenn die Hitze nicht steigt; 0, wenn schon drüber) */
function hrsTo80(){const n=heatNet();if(me.heat>=80)return 0;return n>0?(80-me.heat)/n:Infinity}
function heatSafe(){return me&&me.heat<80&&hrsTo80()>3}
/* Banden ab 3.3.1: Gewaschen wird nur verdientes Bargeld (Kassen, Schutzgeld, Beute), nicht das Startgeld.
   wash_pool = noch waschbares Bargeld; null bei älteren Banden (keine Begrenzung). */
function earn(v){if(v<=0)return;me.bar+=v;if(me.wash_pool!=null)me.wash_pool+=v}
function clampPool(){if(me.wash_pool!=null)me.wash_pool=clamp(me.wash_pool,0,Math.max(0,me.bar))}
function washable(){const a=me.bar-me.reserve;return me.wash_pool==null?a:Math.min(a,me.wash_pool)}

/* ---------- Ab Beta 5.0.4 „Server rechnet Geld“ ----------
   In Welten, die in money_cfg scharf sind, gehören Bargeld, sauberes Geld, BratCoin, Einstand, Hitze, Wäsche-Topf und eco_at
   dem Server. Jede Geldänderung läuft über bk(Art, Beträge, Bezug): Sie wirkt sofort im Spiel und geht als Buchung an die
   Edge Function kasse. kasse() schickt die offenen Buchungen, lässt dort die Wirtschaft nachrechnen und übernimmt die Werte
   des Servers. Nicht scharf (oder der Server meldet {off:true}): alles wie bis 5.0.3. */
let moneyCfg=null;
function srvMoney(){return !!(moneyCfg&&moneyCfg.armed)}
async function loadMoneyCfg(){try{const r=await q(sb.from('money_cfg').select('*').eq('world',WORLD));moneyCfg=(r&&r[0])||{armed:false}}catch(e){console.warn(e);if(!moneyCfg)moneyCfg={armed:false}}}
const POOL_K=new Set(['rob','duel','coup','truck','heist','smug','order','sell','goal','step','ring','radio','drivers','shop']);
let bkQ=[], bkSeq=0; const bkLog=new Map();
function bkLocal(k,d,sign){
  const v=x=>sign*(+d[x]||0);
  if(v('bar')){if(v('bar')>0&&POOL_K.has(k))earn(v('bar'));else me.bar=Math.max(0,me.bar+v('bar'));clampPool()}
  if(v('clean'))me.clean=Math.max(0,me.clean+v('clean'));
  if(v('coins'))me.coins=Math.max(0,me.coins+v('coins'));
  if(v('basis'))me.basis+=v('basis');
  if(v('coins')&&me.coins<1e-6){me.coins=0;me.basis=0}
  if(v('heat'))me.heat=clamp(me.heat+v('heat'),0,100);
}
function bk(k,d,r){
  d=d||{}; const id=(me?String(me.id).slice(0,4):'x')+now().toString(36)+(bkSeq++).toString(36);
  bkLocal(k,d,1);
  const e={id,k,d,r:r==null?null:r};
  bkLog.set(id,e); if(bkLog.size>300)bkLog.delete(bkLog.keys().next().value);
  if(srvMoney()){bkQ.push(e);kasseSoon()}
  return id;
}
/* Ausgabe zurücknehmen (z. B. Laden doch nicht bekommen): noch nicht gesendet = streichen, sonst Rückbuchung mit Bezug */
function unbk(id){
  const e=bkLog.get(id); if(!e)return;
  bkLocal(e.k,e.d,-1); bkLog.delete(id);
  const i=bkQ.indexOf(e); if(i>=0){bkQ.splice(i,1);return}
  if(srvMoney()){const d={};if(e.d.bar)d.bar=-e.d.bar;if(e.d.clean)d.clean=-e.d.clean;bkQ.push({id:id+'b',k:'back',d,r:id});kasseSoon()}
}
let kBusy=false, kAgain=false, kTimer=null;
function kasseSoon(){if(kTimer)return;kTimer=setTimeout(()=>{kTimer=null;kasse()},300)}
async function kasse(extra){
  if(!me||!srvMoney())return null;
  if(kBusy){if(!extra){kAgain=true;return null}while(kBusy)await new Promise(r=>setTimeout(r,60))}
  kBusy=true; const sent=bkQ.splice(0);
  let r=null;
  try{
    const res=await sb.functions.invoke('kasse',{body:{player:me.id,entries:sent.map(({id,k,d,r})=>({id,k,d,r})),...(extra||{})}});
    if(res.error)throw res.error;
    r=res.data; if(typeof r==='string')r=JSON.parse(r);
    if(r&&r.error==='gang')deviceOut();
    if(!r||r.error)throw new Error((r&&r.error)||'kasse');
    if(r.off){moneyCfg={armed:false};r=null} // Server rechnet in dieser Welt nicht: weiter wie bis 5.0.3
    else kasseApply(r);
    setNet(true);
  }catch(e){console.warn(e);if(bkQ.length+sent.length<400)bkQ=sent.concat(bkQ);setNet(false);r=null}
  kBusy=false;
  if(kAgain){kAgain=false;kasseSoon()}
  return r;
}
function kasseApply(r){
  const P=r.p; if(!P)return;
  ['bar','clean','coins','basis','heat','eco_at','mver'].forEach(k=>{me[k]=+P[k]||0});
  me.wash_pool=P.wash_pool==null?null:+P.wash_pool;
  if('jail' in P)me.jail=jailOf(P);
  bkQ.forEach(e=>bkLocal(e.k,e.d,1)); // Buchungen, die nach dem Absenden dazukamen
  pendLocal();
  if(srvFight())fightTake(P); // ab 5.1.1: Crew, Ruf, Energie und Woche vom Server
  const fx=r.fx||{};
  (r.hints||[]).forEach(h=>safeHintGot(h));
  if(fx.washed>0&&me.ruf!=null)daily('wash',fx.washed);
  if(fx.lmf>0)toast(`🍺 Aus den Felsengängen: +${fx.lmf} 🥃 Fusel`,'good'); // ab 5.1.2 zählt der Server
  (fx.quit||[]).forEach(k=>{if((me.crew[k]||0)>0){me.crew={...me.crew,[k]:me.crew[k]-1};normGuards();addEvent({kind:'info',actor:me.id,target:me.id,txt:`${me.name}: Ein ${CREW[k].name} hat gekündigt. Kein Lohn.`})}});
  (fx.raids||[]).forEach(x=>raidNews(x.kind,x.did,x.lost,x.lc,x.jail));
  if(pendingKnast&&document.getElementById('modal').hidden){pendingKnast=false;showModal(knastModal())}
  if((fx.quit||[]).length||(fx.raids||[]).length)savePlayer();
  if((r.res||[]).some(x=>!x.ok&&(x.why==='geld'||x.why==='preis')))toast('Die Bank hat eine Buchung nicht angenommen. Dein Geld ist wieder auf dem Stand vom Server.','bad');
  renderHUD();
}

/* ---------- Ab Beta 5.1.1 „Server rechnet Angriffe“ ----------
   In Welten mit money_cfg.fights würfelt die Edge Function kampf: Überfall, Übernahme, Hack, Duell, Coups, Geldtransporter,
   Großcoups, Schmuggel, Wahrzeichen, Basteln, Kopfgeld und die KI-Banden. Das Spiel schickt nur, was der Spieler tut (Ziel,
   Trupp, Treffer im Minispiel samt Marke vom Spielstart), und übernimmt die Werte des Servers. Ruf, Energie, Coups,
   Ausrüstung, Fahrten und Verletzte schreibt nur noch der Server; Ruf aus Bauen, Tageszielen usw. bucht bk('ruf'). */
const FIGHT_NO=['gear','ruf','energy','energy_at','coups','truck_try','hack_until','helping','week_key','week_ruf0','week_loot','week_last'];
function srvFight(){return srvMoney()&&!!moneyCfg.fights}
let mgTokP=null, mgQuick=false;
async function kampfCall(body){
  const res=await sb.functions.invoke('kampf',{body:{player:me.id,...body}});
  if(res.error)throw res.error;
  let r=res.data; if(typeof r==='string')r=JSON.parse(r); return r||{};
}
/* Marke beim Start des Minispiels holen: Der Server prüft damit, dass wirklich gespielt wurde */
function kampfStart(kind,ref){mgTokP=kampfCall({act:'start',kind,ref:String(ref||'')}).then(r=>(r&&r.tok)||null).catch(e=>{console.warn(e);return null})}
async function kampf(body,hits,mult,pend){
  if(!me)return {error:'netz'};
  if(hits!=null){
    const perfect=Math.max(0,Math.round((mult-.55-hits*.25)/.1)), quick=mgQuick, tok=quick?null:await (mgTokP||Promise.resolve(null));
    body={...body,hits,perfect,quick,tok}; mgTokP=null; mgQuick=false;
  }
  let r;
  try{r=await kampfCall(body);setNet(true)}catch(e){console.warn(e);setNet(false);pendDone(pend,null);return {error:'netz'}}
  pendDone(pend,r);
  if(r.error==='gang'){deviceOut();return r}
  if(r.off){if(r.fu===false)moneyCfg={...moneyCfg,fu:false};else if(r.dn===false)moneyCfg={...moneyCfg,dn:false};else if(r.shops===false)moneyCfg={...moneyCfg,shops:false};else moneyCfg={...moneyCfg,fights:false};return r}
  lastRes=r.res||null;
  if(r.p)fightApply(r.p);
  (r.hints||[]).forEach(safeHintGot); // ab 5.1: Safe-Hinweis aus Coups und Überfällen
  return r;
}
const FIGHT_WHY={pause:'⏳ Kurz verschnaufen, gleich darfst du wieder ran.',ziel:'Das Ziel gibt es so nicht mehr.',spezl:'🤝 Ihr seid Spezln. Erst auflösen oder verraten.',stufe:'Dafür ist deine Stufe noch zu niedrig.',hacker:'Braucht 1 Hacker.',warten:'Deine Hacker machen noch Pause.',besetzt:'Dort läuft schon ein Überfall.',unterwegs:'Dein Trupp ist schon dort.',crew:'Zu wenig Schläger daheim.',spiel:'Das Minispiel ist abgelaufen. Versuch es nochmal.',vorbei:'Zu spät, das ist schon vorbei.',energie:'Zu wenig Energie.',versucht:'Du hattest deinen Versuch schon.',spaet:'Zu spät: Jemand anderes war schneller.',voll:'Zu spät: Da ist kein Platz mehr frei.',heute:'Heute warst du schon dabei.',offen:'Gerade läuft schon ein Großcoup.',zeit:'Das geht gerade nicht (Uhrzeit).',fest:'Das geht nur während des Fests.',zu:'Der Markt schließt gleich.',ware:'Dafür fehlt Ware.',art:'Das geht so nicht.',ally:'🤝 Nicht auf deine Spezln.',geld:'Dafür reicht dein sauberes Geld nicht.',leer:'Nichts zurückzuholen.',netz:'Verbindung hakt. Versuch es gleich nochmal.',busy:'Gerade viel los. Versuch es gleich nochmal.',server:'Geht gerade nicht. Versuch es gleich nochmal.',knast:'🚔 Im Knast geht das nicht. Wirtschaften geht, zuschlagen nicht.',knastmax:'🚔 Sitzt im Knast und hat schon einen Laden verloren. Mehr gibt es erst, wenn sie draußen ist'};
/* true = abgelehnt (und gemeldet) */
function fightWhy(r,modal){
  if(r&&r.res&&!r.why&&!r.error&&!r.off)return false;
  const w=r&&(r.why||r.error||(r.off?'server':null))||'server';
  const t=LM_WHY[w]&&!FIGHT_WHY[w]?LM_WHY[w]:FIGHT_WHY[w]||FIGHT_WHY.server;
  if(modal)showResult(false,'GEHT NICHT',t,'',null,true);else toast(t,'bad');
  dirty=true; return true;
}
/* Werte des Servers übernehmen (Antwort von kampf/kasse oder neuerer Stand aus der Datenbank) */
function wareMerge(srv){
  const o={...(srv||{})}, base=lastSaved&&lastSaved.ware?JSON.parse(lastSaved.ware):null, loc=me.ware||{};
  if(base)for(const k in loc){const dl=(+loc[k]||0)-(+base[k]||0);if(dl)o[k]=Math.max(0,(+o[k]||0)+dl)}
  return o;
}
function fightTake(P){
  const lv=myLevel();
  if(srvShop()){ // ab 5.1.2: Ware, Boss, Heimat, Erschließen, Funkgerät, Fest und Bestechung kommen nur vom Server
    SHOP_NO.forEach(k=>{if(k in P)me[k]=k==='ware'?jparse(P.ware,{}):k==='boss'||k==='fest'?jparse(P[k],null):P[k]});
    if(lastSaved){const pt=patchOf(me,true);SHOP_NO.forEach(k=>{if(k in P)lastSaved[k]=JSON.stringify(pt[k])})}
  }
  if(P.crew&&typeof P.crew==='object'){const lmf=me.crew&&me.crew.lmf;me.crew={...P.crew};if(lmf&&!(+P.crew.lmf>=+lmf))me.crew.lmf=lmf}
  if(P.ware&&typeof P.ware==='object'&&!srvShop()){me.ware=wareMerge(P.ware);if(lastSaved)lastSaved.ware=JSON.stringify(P.ware)}
  FIGHT_NO.forEach(k=>{if(k in P)me[k]=P[k]});
  if('kstate' in P)me.kstate=P.kstate;
  if('rat_fx' in P)me.rat_fx=P.rat_fx; // ab 5.2: Sabotage der Ratte
  if(lastSaved){const pt=patchOf(me,true);FIGHT_NO.forEach(k=>{if(k in P)lastSaved[k]=JSON.stringify(pt[k])});if(P.crew)lastSaved.crew=JSON.stringify(P.crew)}
  pendItems(); // ab 5.2.1.2: noch unbestätigtes Basteln/Verkaufen bleibt sichtbar
  normGuards(); levelUp(lv);
}
function fightApply(P){
  ['bar','clean','coins','basis','heat','eco_at','mver'].forEach(k=>{if(P[k]!=null)me[k]=+P[k]||0});
  if(P.bar!=null||P.clean!=null)pendLocal();
  if('wash_pool' in P)me.wash_pool=P.wash_pool==null?null:+P.wash_pool;
  bkQ.forEach(e=>bkLocal(e.k,e.d,1));
  fightTake(P); renderHUD();
}
/* ---------- Ab Beta 5.1.2 „Sicherheit komplett“ ----------
   In Welten mit money_cfg.shops rechnet die Edge Function kampf auch Läden (bauen, ausbauen, umbauen, Sicherung, abreißen),
   Ware, Bestellungen, Crew anheuern, Boss, Heimatviertel, Erschließen, Angebote, Geschenke, Bündnisse und Preise.
   Fremde Banden und Läden sieht das Spiel nur noch öffentlich; das Angriffsfenster fragt den Server (vorschau). */
const SHOP_NO=['ware','boss','home','home_at','home_set','home_far','open_week','radio','fest','bribe_day','bribe_n'];
const TRADE_AGE=7*864e5, OPEN_RUN=30*60000;
function srvShop(){return srvFight()&&!!moneyCfg.shops}
let lastRes=null;
const SHOP_WHY={tueren:'🚪 Alle Türen voll. Mehr Türsteher gibt es mit Läden in weiteren Vierteln.',runde:'Eröffnungsrunde: In einem frisch erschlossenen Stadtteil darf jede Bande in der ersten halben Stunde nur einen Laden haben.',woche:'Das geht erst wieder ab Sonntag 20 Uhr.',jung:'Handel und Geld schicken gehen erst, wenn beide Banden mindestens 7 Tage dabei sind.',letzter:'Dein letzter Laden kann nur umgebaut werden.',viele:'Höchstens 3 offene Angebote gleichzeitig.',bar:'Zu viel Bargeld für diese Ware.',leer:'Auf beiden Seiten muss etwas stehen.',stufe2:'Diese Bande ist dafür noch zu klein.',schon:'Einer von euch hat schon ein Bündnis.',laeuft:'Anfrage läuft schon.',wenig:'Zu wenig.',limit:'Heute schon 20k geschickt.',warten:'Das geht gerade noch nicht.',voll:'Mehr als 6 Fahrer bringen nichts.',ware:'Dafür fehlt dir Ware.',spaet:'Zu spät: Jemand anderes war schneller.',geld:'Dafür reicht dein Geld nicht.',vorbei:'Das gilt nicht mehr.',nichts:''};
/* Eine Laden-Aktion beim Server; null = abgelehnt (und gemeldet) */
async function shopAct(act,body,modal,pend){
  const r=await kampf({act,...(body||{})},null,null,pend);
  if(r&&r.res&&!r.why&&!r.error&&!r.off)return r.res;
  const w=r&&(r.why||r.error);
  if(w==='nichts')return null;
  if(SHOP_WHY[w]&&!(r&&r.off)){if(modal)showResult(false,'GEHT NICHT',SHOP_WHY[w],'',null,true);else toast(SHOP_WHY[w],'bad');dirty=true;return null}
  fightWhy(r,modal); return null;
}
/* Die Bande wurde mit dem Bandencode auf ein anderes Gerät geholt: neu starten, dort steht der Hinweis */
let devGone=false;
function deviceOut(){if(devGone)return;devGone=true;try{sessionStorage.setItem('imperium-out','1')}catch(e){}setTimeout(()=>location.reload(),300)}
/* Bau-Regeln: Bauzuschlag ab dem 15. eigenen Laden (+4 % je Laden, höchstens doppelt), Eröffnungsrunde 30 Min. */
function ownN(){let n=0;eachS(x=>{if(me&&x.owner===me.id)n++});return n}
function surch(){if(!srvShop())return 1;const k=ownN()+1-14;return k>0?Math.min(2,1+.04*k):1}
function buildPrice(t){return Math.round(costOf(t)*surch())}
function openRunLeft(did){if(!srvShop()||!me)return 0;const o=openedMap()[did];if(!o||!(now()-(+o.at||0)<OPEN_RUN))return 0;return slotsOfD(DM[did]).some(x=>x&&x.owner===me.id)?(+o.at+OPEN_RUN-now()):0}
function tooYoung(o){if(!srvShop())return false;const a=+me.born||0,b=+((players[o]||{}).born)||0;return !a||!b||now()-a<TRADE_AGE||now()-b<TRADE_AGE}
/* Angriffsfenster: Chancen und Verteidigung vom Server (20 Sek. gemerkt, je Ziel, Trupp und Rache) */
let pvC={};
function pvGet(did,i){
  if(!srvShop())return null;
  const s=slotOf(did,i); if(!s||!s.owner)return null;
  const n=crewPick().n, rev=!!revBonus(s.owner), k=did+':'+i+':'+n+':'+(rev?1:0), c=pvC[k];
  if(c&&c.res&&now()-c.at<20000)return c.res;
  if(!c||!c.busy){pvC[k]={res:c&&c.res||null,at:c?c.at:0,busy:true};
    kampfCall({act:'vorschau',d:did,i,n,rev}).then(r=>{pvC[k]={res:r&&r.res||null,at:now(),busy:false};
      if(openSlot&&openSlot.d===did&&openSlot.i===i&&!document.getElementById('modal').hidden)showModal(slotModal(did,i),true)}).catch(e=>{console.warn(e);pvC[k].busy=false})}
  return c&&c.res||null;
}

function srvRache(){return srvFight()&&!!(moneyCfg&&moneyCfg.rache)}
let racheTickAt=0;
function racheDue(t){if(!srvRache()||t-racheTickAt<5*60000)return false;const h=berlinHour();return h>=16&&h<23}
function tickDue(){
  const t=now(); if(duels.some(x=>x.status==='open'&&+x.ends_at<=t))return true;
  if(racheDue(t))return true;
  if(world&&t-(+world.npc_at||0)>=HOUR)return true;
  const tr=truckNow(); return !!(tr&&!tr.fa&&t>=tr.at+TRUCK_NPC&&!(truckRow[tr.id]&&truckRow[tr.id].winner));
}
async function kampfTick(){

  if(srvRache())racheTickAt=now();
  const r=await kampf({act:'tick'}); if(!r||!r.res)return;
  if(world&&now()-(+world.npc_at||0)>=HOUR)world.npc_at=now();
  if(!r.res.idle){await loadDuels();await loadTruck();await loadNewEvents();await refreshSlots().catch(()=>{});dirty=true}
}

/* ---------- Ab Beta 4.8: Türsteher pro Viertel (höchstens 3), Schläger fahren im Auto zum Angriff ---------- */
const MAX_T=3, SEAT=3, MAX_CARS=3, HURT_MS=HOUR, FAHRER_TEILE=3;
function guardsOf(p){return (p&&p.guards&&typeof p.guards==='object')?p.guards:{}}
function guardN(p,did){return Math.min(MAX_T,+guardsOf(p)[did]||0)}
function guardSum(p){let n=0;const g=guardsOf(p);for(const k in g)n+=Math.min(MAX_T,+g[k]||0);return n}
/* Fahrten und Verletzte stehen in crew.trips und crew.hurt: [{n,c,own,o,d,until}] und [{n,until}] */
function tripsOf(p){const c=p&&p.crew;return (c&&Array.isArray(c.trips)?c.trips:[]).filter(x=>+x.until>now())}
function hurtOf(p){const c=p&&p.crew;let n=0;(c&&Array.isArray(c.hurt)?c.hurt:[]).forEach(x=>{if(+x.until>now())n+=+x.n||0});return n}
function awayS(p){let n=0;tripsOf(p).forEach(x=>n+=+x.n||0);return n}
function freeS(p){p=p||me;return Math.max(0,((p.crew&&p.crew.s)||0)-awayS(p)-hurtOf(p)-lentS(p))}
function freeT(p){p=p||me;return Math.max(0,((p.crew&&p.crew.t)||0)-guardSum(p))}
function ownCarFree(){return !tripsOf(me).some(x=>x.own)}
function freeF(){let n=0;tripsOf(me).forEach(x=>n+=+x.c||0);return Math.max(0,(me.crew.f||0)-n)}
function carsFree(){return (ownCarFree()?1:0)+freeF()}
function fuelCars(){return Math.min(freeF(),hasW(me,'f'))}
function usableCars(){return Math.min(MAX_CARS,(ownCarFree()?1:0)+fuelCars())}
function tripOn(o){return tripsOf(me).find(x=>x.o===o)}
function nextBack(){const t=tripsOf(me);return t.length?Math.max(0,Math.ceil((Math.min(...t.map(x=>+x.until))-now())/1000)):0}
function hurtBack(){const c=me.crew;const l=(Array.isArray(c.hurt)?c.hurt:[]).filter(x=>+x.until>now());return l.length?Math.ceil((Math.min(...l.map(x=>+x.until))-now())/1000):0}
/* Trupp: Du wählst mit −/+, wie viele Schläger mitfahren. Je 3 ein Auto, dein eigenes zuerst, Fahrer-Autos brauchen 1 Fusel */
function maxAtkN(){return Math.min(freeS(),usableCars()*SEAT)}
function atkWhy(P){
  const mx=maxAtkN(); if(!P.n||P.n<mx)return '';
  if(mx>=MAX_CARS*SEAT)return 'Autos voll';
  const fs=freeS();
  if(fs<usableCars()*SEAT){const hn=hurtOf(me), aw=awayS(me);return hn?`🤕 ${hn} verletzt · ${dur(hurtBack())}`:aw?`🚗 ${aw} unterwegs`:`nur ${fs} daheim`}
  const ff=freeF(), fc=fuelCars(), T=tripsOf(me);
  if(ff>fc)return hasW(me,'f')?`🥃 nur ${hasW(me,'f')} Fusel`:'🥃 kein Fusel';
  if(T.length)return `🚗 unterwegs · ${mmss(nextBack())}`;
  return `🏎️ ${me.crew.f||0} Fahrer`;
}

function polyOf(id){if(!POLY[id]){const n=(GEO[id].path.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number),a=[];for(let i=0;i+1<n.length;i+=2)a.push([n[i],n[i+1]]);POLY[id]=a}return POLY[id]}

const pendingSlotWrites=[];

    let wcap=0, inc=0, heatG=0;

    else if(me.heat>=80&&Math.random()<dt){raid('district');hit=true}
    else if(me.heat>=60&&me.heat<80&&Math.random()<dt/3){raid('small');hit=true}

}

    const x=rk.map(([s,d,i])=>({s,d,i,c:curStock(s,d)})).sort((a,b)=>b.c-a.c)[0];
    const lost=x&&x.c>=1?emptyKasse(x.s,x.d,x.i,.5):0;

const NPC_CAP=12, NPC_FREE_MIN=6, AWAY_D=3, GONE_D=7;
function npcCanBuild(){let n=0,f=0;D.filter(d=>!d.x).forEach(d=>slotsOfD(d).forEach(x=>{if(!x)return;if(!x.owner)f++;else if(isNpc(x.owner))n++}));return n<NPC_CAP&&f>=NPC_FREE_MIN}
function awayDays(o){if(isNpc(o))return 0;const p=o===(me&&me.id)?me:players[o];return p&&p.last_seen?(now()-p.last_seen)/(24*HOUR):0}

/* Nach 7 Tagen holen sich die KI-Banden die Läden abgetauchter Banden nach und nach (der letzte Laden bleibt) */
async function npcClaimGone(){
  const gone=Object.values(players).filter(p=>p.id!==(me&&me.id)&&awayDays(p.id)>=GONE_D);
  for(const p of gone){
    const sl=[];eachS((s,d,i)=>{if(s.owner===p.id)sl.push([s,d,i])});
    if(sl.length<=1||Math.random()>.5)continue;
    const [s,d,i]=pick(sl), npc=pick(Object.keys(NPC));
    const ok=await casSlot(d.id,i,{owner:p.id,ver:s.ver},{owner:npc,stock:0,stock_at:now(),sec:0,ver:s.ver+1}).catch(()=>null);
    if(ok)await addEvent({kind:'atk',actor:npc,target:p.id,district:d.id,txt:`💤 ${p.name} ist abgetaucht. ${NPC[npc].name} übernimmt ${art(s.type)} ${TYPES[s.type].name} in ${d.name}.`});
  }
}
async function npcRoutine(){
  if(!world||srvFight())return;
  const hrs=(now()-(+world.npc_at||0))/HOUR;
  if(hrs<1)return;
  const n=Math.min(6,Math.floor(hrs));
  let w;
  try{w=await q(sb.from('world').update({npc_at:now(),npc_ver:world.npc_ver+1}).eq('id',WORLD).eq('npc_ver',world.npc_ver).select())}catch(e){return}
  if(!w||!w[0]){try{const wo=await q(sb.from('world').select('*').eq('id',WORLD));world=wo[0]||world}catch(e){}return}
  world=w[0];
  try{await npcClaimGone()}catch(e){console.warn(e)}
  for(let r=0;r<n;r++){
    for(const id of Object.keys(NPC)){
      if(Math.random()<.45&&npcCanBuild()){

const REFUND=.4;

function credit(s){return Math.round(invested(s)*REFUND)}

function convertCost(s,t){const O=TYPES[s.type],N=TYPES[t],cr=credit(s);
  if(O.cur===N.cur)return {pay:Math.max(0,N.cost-cr),back:Math.max(0,cr-N.cost),cr,same:true};
  return {pay:N.cost,back:cr,cr,same:false}}

function hire(k){const C=CREW[k];if(me.bar<C.cost||!unlocked(unlockKey(k)))return;if(k==='f'&&(me.crew.f||0)>=MAX_FH){toast(`Mehr als ${MAX_FH} Fahrer bringen nichts.`,'bad');return}
  if(k==='t'&&(me.crew.t||0)>=doorsN()){toast(`🚪 Alle Türen voll: ${doorsN()} Türen, ${me.crew.t||0} Türsteher. Mehr gibt es mit Läden in weiteren Vierteln.`,'bad');return}
  if(k==='f'&&hasW(me,'t')<FAHRER_TEILE){toast(`Ein Fahrer braucht ein Auto: ${FAHRER_TEILE} 🔩 Teile. Du hast ${hasW(me,'t')}.`,'bad');return}
  if(srvShop())return guard(async()=>{const x=await shopAct('anheuern',{k});if(x)toast(k==='f'?`🏎️ Neuer Fahrer mit Auto an Bord! −${FAHRER_TEILE} 🔩 Teile.`:`${C.ico} Neuer ${C.name} an Bord!`,'good')});
  bk('crew',{bar:-C.cost},{k});if(k==='f')addWare('t',-FAHRER_TEILE);me.crew={...me.crew,[k]:(me.crew[k]||0)+1};savePlayer();toast(k==='f'?`🏎️ Neuer Fahrer mit Auto an Bord! −${FAHRER_TEILE} 🔩 Teile.`:`${C.ico} Neuer ${C.name} an Bord!`,'good')}
/* Bestechung: 3.000, jedes weitere Mal am selben Tag (Nürnberger Zeit) +1.000, höchstens 9.000 */
function berlinDay(){try{return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(now())}catch(e){return 'd'+Math.floor((now()+2*HOUR)/864e5)}}
function bribesToday(){return me.bribe_day===berlinDay()?(me.bribe_n||0):0}
function bribeCost(){return Math.min(9000,3000+1000*bribesToday())}
function bribe(){const c=bribeCost();if(me.clean<c||me.heat<1)return;bk('bribe',{clean:-c,heat:-Math.min(25,me.heat)});const n=bribesToday()+1;me.bribe_day=berlinDay();me.bribe_n=n;savePlayer();
  toast(`🤝 Ein Umschlag wechselt den Besitzer. Hitze −25.${n<7?` Nächster Umschlag heute: ${fmt(bribeCost())} ✦`:''}`,'good')}
/* ---------- BratCoin ab Beta 4.4: gemeinsamer Kurs in der Datenbank ---------- */
const COIN_NEWS=20000; // ab diesem Betrag meldet der Kurier das Geschäft mit Namen
let coinReady=false, coinBusy=false;
function addMove(m){if(!m||m.ts==null)return;if(coinMoves.some(x=>+x.ts===+m.ts&&+x.s1===+m.s1))return;coinMoves.push({ts:+m.ts,s0:+m.s0,s1:+m.s1,kind:m.kind});coinMoves.sort((a,b)=>a.ts-b.ts);const cut=now()-30*HOUR;while(coinMoves.length>1&&coinMoves[1].ts<cut)coinMoves.shift()}
async function loadCoin(){
  try{
    let rows=await q(sb.from('coin_moves').select('*').eq('world',WORLD).gt('ts',now()-30*HOUR).order('ts',{ascending:true}).limit(500));
    if(!rows||!rows.length){
      // Kein Verlauf: den letzten Stand holen, beim allerersten Start beim alten Wellenkurs beginnen
      const last=await q(sb.from('coin_moves').select('*').eq('world',WORLD).order('ts',{ascending:false}).limit(1));
      if(last&&last.length)rows=last;
      else{const t=now();const {data,error}=await sb.rpc('coin_init',{p_world:WORLD,p_s:(1-COIN_WAVE)*waveLog(t)});if(error)throw error;rows=data?[data]:[]}
    }
    coinMoves=[]; (rows||[]).forEach(addMove); coinReady=true;
  }catch(e){console.warn(e)}
}
/* Kurs in der Datenbank bewegen; liefert den Druck vor und nach dem eigenen Handel */
async function coinTrade(delta,kind){
  const {data,error}=await sb.rpc('coin_trade',{p_world:WORLD,p_delta:delta,p_kind:kind});
  if(error)throw error;
  const m=data&&(Array.isArray(data)?data[0]:data); if(!m)throw new Error('kein Kurs');
  addMove(m); return m;
}
function coinPush(f,kind){if(srvShop())return Promise.resolve();return coinTrade(Math.log(1+f),kind).then(()=>{dirty=true}).catch(e=>console.warn(e))}
function loseCoins(f){if(!(me.coins>0.005))return 0;const c=me.coins*f;me.basis-=me.basis*f;me.coins-=c;return c}
function coinPrice(m){return 100*Math.exp(COIN_WAVE*waveLog(+m.ts)+(+m.s0))}
async function buyCoin(f){
  if(!unlocked('coin')||coinBusy)return;
  const amt=Math.floor(me.bar*f); if(amt<10)return;
  if(srvMoney()){
    coinBusy=true; const r=await kasse({coin:{side:'buy',f}}), x=r&&r.coin; coinBusy=false;
    if(x){toast(`🪙 ${de(x.c,2)} BratCoin für ${fmt(x.amt)} Bargeld gekauft (Kurs ${de(x.pr,2)})`,'good');
      if(x.amt>=COIN_NEWS)addEvent({kind:'info',actor:me.id,amount:x.amt,txt:`🪙 ${me.name} kauft BratCoin für ${fmt(x.amt)}. Der Kurs zieht an.`})}
    else toast('Die Börse hakt. Nichts gekauft, versuch es gleich nochmal.','bad');
    dirty=true; render(); return;
  }
  coinBusy=true; me.bar-=amt; renderHUD();
  try{
    const m=await coinTrade(tradeLog(amt),'buy'), p=coinPrice(m), c=amt*.88/p;
    me.coins+=c; me.basis+=amt; await savePlayer();
    toast(`🪙 ${de(c,2)} BratCoin für ${fmt(amt)} Bargeld gekauft (Kurs ${de(p,2)})`,'good');
    if(amt>=COIN_NEWS)addEvent({kind:'info',actor:me.id,amount:amt,txt:`🪙 ${me.name} kauft BratCoin für ${fmt(amt)}. Der Kurs zieht an.`});
  }catch(e){console.warn(e);me.bar+=amt;toast('Die Börse hakt. Nichts gekauft, versuch es gleich nochmal.','bad')}
  coinBusy=false; dirty=true; render();
}
async function sellCoin(f){
  if(me.coins<=0.0001||coinBusy)return;
  const c=me.coins*f, est=c*priceAt(now());
  if(srvMoney()){
    coinBusy=true; const r=await kasse({coin:{side:'sell',f}}), x=r&&r.coin; coinBusy=false;
    if(x){toast(`🪙 Verkauft: +${fmt(x.v)} sauber · ${x.pl>=0?'Gewinn':'Verlust'} ${x.pl>=0?'+':'−'}${fmt(Math.abs(x.pl))}`,x.pl>=0?'good':'bad');
      if(x.v>=COIN_NEWS)addEvent({kind:'info',actor:me.id,amount:x.v,txt:`🪙 ${me.name} wirft BratCoin für ${fmt(x.v)} auf den Markt. Der Kurs fällt.`})}
    else toast('Die Börse hakt. Nichts verkauft, versuch es gleich nochmal.','bad');
    dirty=true; render(); return;
  }
  coinBusy=true;
  try{
    const m=await coinTrade(-tradeLog(est),'sell'), p=coinPrice(m), v=c*p*.98, part=me.basis*f, pl=v-part;
    me.coins-=c; me.basis-=part; if(me.coins<1e-6){me.coins=0;me.basis=0}
    me.clean+=v; await savePlayer();
    toast(`🪙 Verkauft: +${fmt(v)} sauber · ${pl>=0?'Gewinn':'Verlust'} ${pl>=0?'+':'−'}${fmt(Math.abs(pl))}`,pl>=0?'good':'bad');
    if(v>=COIN_NEWS)addEvent({kind:'info',actor:me.id,amount:v,txt:`🪙 ${me.name} wirft BratCoin für ${fmt(v)} auf den Markt. Der Kurs fällt.`});
  }catch(e){console.warn(e);toast('Die Börse hakt. Nichts verkauft, versuch es gleich nochmal.','bad')}
  coinBusy=false; dirty=true; render();
}

function attackReq(kind,victim){
  const kb=knastBlock(); if(kb)return kb; // ab 5.1
  if(kind==='uebernahme'&&victim&&jailOn(victim)&&jailLost(victim)>=1)return '🚔 Sitzt im Knast und hat schon einen Laden verloren. Mehr gibt es erst, wenn sie draußen ist';
  if(kind==='uebernahme'&&!unlocked('uebernahme')&&!(victim&&isNpc(victim)))return lockTxt('uebernahme'); // ab 5.2.2: KI-Läden ab Stufe 1
  if(kind==='hack')return !unlocked('hack')?lockTxt('hack'):me.crew.h>=1?null:'Braucht 1 Hacker';
  // Ab Beta 4.8: Trupp im Auto, pro Gegner nur ein Angriff gleichzeitig
  if(victim&&tripOn(victim))return `Dein Trupp ist schon dort, zurück in ${dur(Math.ceil((+tripOn(victim).until-now())/1000))}`;
  if(!carsFree())return `Alle Autos unterwegs, das erste ist in ${dur(nextBack())} zurück`;
  if(!usableCars())return 'Kein 🥃 Fusel im Lager für die Fahrer';
  const need=kind==='uebernahme'?3:1, n=crewPick().n;
  if(n>=need)return null;
  if((me.crew.s||0)<need)return `Braucht ${need} Schläger`;
  if(freeS()<need)return 'Zu wenig Schläger daheim (unterwegs oder verletzt)';
  return `Braucht ${need} Schläger, tipp oben auf +`;
}
function chanceOf(kind,s,d,mult,n){
  if(kind==='ueberfall'){const a=(atkPow(n)+ubBonus(d.id))*mult;return clamp(a/(a+defOf(s,d,usesPick(kind,s))),.05,.95)}
  if(kind==='uebernahme'){const a=(atkPow(n)+ubBonus(d.id))*mult;return clamp(a/(a+defOf(s,d)*1.6),.03,.9)}
  const a=me.crew.h*2*mult*bossHackMul()*(holds(me.id,'ei')?1.2:1), dp=isNpc(s.owner)?npcPower():(1+((players[s.owner]||{crew:{h:0}}).crew.h||0)*2);
  return clamp(a/(a+dp*.6+2),.05,.92);
}
function cam(s){return (+s.sec||0)>=2?5:0}
/* Dietrich wird von selbst benutzt (nur Überfall auf Läden mit Sicherung), Nitro ab 4.8.2 nur per Schalter im Angriffsfenster */
function usesPick(kind,s){return kind==='ueberfall'&&(+s.sec||0)>0&&hasG(me,'d')>0}
function usesCar(){return hasG(me,'c')>0&&!!ui.nitro}
/* Ab Beta 4.6.2: Hinweis mit Bestand, der Dietrich hilft nur beim Überfall */
function gearHint(s){
  const t=[], nd=hasG(me,'d'), nc=hasG(me,'c');
  if(nd>0&&(+s.sec||0)>0)t.push(`🗝️ Dietrich (noch ${nd}): knackt die Sicherung, aber nur beim Überfall`);
  if(nc>0)t.push(`🚀 Nitro (noch ${nc}): keine Hitze, Trupp sofort zurück, nicht beim Hack`);
  return t.length?`<p class="small muted">${t.join('<br>')}<br>Wird beim Angriff von selbst verbraucht.</p>`:'';
}
/* Ab Beta 4.6.2: Das Ergebnis meldet verbrauchte Ausrüstung mit Restbestand */
let resGear=null, resHack=false;
function gearUsedTxt(g){

function revBonus(o){return (ui.revenge&&ui.revenge.o===o&&now()<ui.revenge.until)||betrayedMe(o)?.25:0}
function homeless(o){let n=0;eachS(s=>{if(s.owner===o)n++});return n<=1}

function attack(did,i,kind){
  const s0=slotOf(did,i);
  if(!s0||!s0.owner||s0.owner===me.id||waitSec(kind)||attackReq(kind,s0.owner))return;
  const victim=s0.owner;
  if(isAlly(victim)){toast('🤝 Ihr seid Spezln. Erst auflösen oder verraten.','bad');return}
  if(kind==='ueberfall'&&!isNpc(victim)&&duelOn(did,i)){toast('Dort läuft schon ein Überfall.','bad');return}
  if(srvFight())return attackSrv(did,i,kind,victim);
  lastVictim=victim;
  playGame(kind,mult=>guard(async()=>{
    const d=DM[did];
    const s=await fetchSlot(did,i);
    const vName=ownerInfo(victim).name;
    if(!s||s.owner!==victim){showResult(false,'ZU SPÄT','Jemand anderes war schneller.','');return}
    mult+=revBonus(victim);
    const isHack=kind==='hack';
    // Ab Beta 4.8: Der Trupp steigt ein, Fahrer-Autos tanken je 1 Fusel
    const pk=isHack?null:crewPick();
    if(pk&&attackReq(kind,victim)){showResult(false,'KEIN TRUPP',attackReq(kind,victim),'',null,true);return}
    const isDuel=kind==='ueberfall'&&!isNpc(victim);
    const trip=pk?{id:now().toString(36)+Math.random().toString(36).slice(2,5),n:pk.n,c:pk.fc,own:pk.own,o:victim,d:did,until:now()+(isDuel?DUEL_MS+60000:travelMin()*60000)}:null;
    if(isHack)me.hack_until=now()+HACK_MIN*60000;else{addTrip(trip);if(pk.fc)addWare('f',-pk.fc)}
    // Ab Beta 4.4: Dietrich und Nitro (bis 4.8 „Fluchtwagen“)
    const pickOn=usesPick(kind,s), h0=me.heat; let car=!isHack&&usesCar();
    // Ab Beta 4.6.2: Bricht der Angriff ab, gibt es die Ausrüstung zurück, ab 4.8 auch Fusel und Trupp
    const refund=()=>{if(pickOn)addGear('d',1);if(car)addGear('c',1);car=false;resGear=null;if(trip){dropTrip(trip.id);if(pk.fc)addWare('f',pk.fc)}};
    const ok=Math.random()<chanceOf(kind,s,d,mult,pk?pk.n:0);
    if(pickOn)addGear('d',-1);
    if(car)addGear('c',-1);
    resGear=null;
    const T=TYPES[s.type], cs=pickOn?{...s,sec:0}:s;
    // Ab Beta 4.3: Überfall auf echte Spieler läuft 5 Minuten als Duell
    if(isDuel){await startDuel(did,i,s,mult,victim,{nosec:pickOn,car,trip});await savePlayer();return}
    resGear=pickOn||car?{d:pickOn,c:car}:null; resHack=isHack;
    try{
    if(kind==='ueberfall'){
      if(ok){
        const cur=curStock(s,d), loot=Math.round(cur*Math.min((+cs.sec||0)>=3?.5:1,.5+.4*mult)*(newbieProt(victim)?.4:1));
        const done=loot>0?await casSlot(did,i,{owner:victim,ver:s.ver},{stock:cur-loot,stock_at:now(),ver:s.ver+1}):s;
        if(!done){refund();showResult(false,'ZU SPÄT','Die Kasse wurde gerade geleert.','');await savePlayer();return}
        bk('rob',{bar:loot,heat:(8+cam(cs))*fogMul()}); weekLoot(loot); addRuf(15); daily('rob',1);
        addEvent({kind:'atk',actor:me.id,target:victim,district:did,amount:loot,txt:`${me.name} hat ${vName}s ${T.name} in ${d.name} ausgeraubt: ${fmt(loot)} weg!`});
        showResult(true,loot>0?'BEUTE!':'LEER!',loot>0?pick(LINES.robOk):'Rein, umgeschaut, nichts drin.',loot>0?`+${fmt(loot)} Bargeld`:'',`c-dirty`);
      }else{
        bk('heat',{heat:(5+cam(cs))*fogMul()}); const lost=hurtCrew(trip.n,trip.id);
        addEvent({kind:'def',actor:me.id,target:victim,district:did,txt:`${vName} wehrt einen Überfall von ${me.name} in ${d.name} ab.`});
        showResult(false,'VERKACKT!',pick(LINES.robNo),lost);
      }
    }else if(kind==='uebernahme'){
      if(ok&&newbieProt(victim)){
        refund();showResult(false,'NEULINGSSCHUTZ','Diese Bande ist noch zu klein für eine Übernahme. Raub sie aus, wenn es sein muss.','');await savePlayer();return;
      }
      if(ok&&!isNpc(victim)&&homeless(victim)){
        refund();showResult(false,'GESCHÜTZT','Das ist das letzte Geschäft dieser Bande. Das lassen wir ihr. Raub es lieber aus.','');await savePlayer();return;
      }
      if(ok){
        // Ab 5.1: Spitzenreiter-Prämie, wer der Nr. 1 der Rangliste einen Laden abnimmt, bekommt doppelten Ruf
        const top=rankOf(victim).pos===1;
        const done=await casSlot(did,i,{owner:victim,ver:s.ver},{owner:me.id,stock:0,stock_at:now(),sec:0,ver:s.ver+1});
        if(!done){refund();showResult(false,'ZU SPÄT','Hat sich gerade etwas geändert.','');await savePlayer();return}
        bk('take',{heat:15+cam(s)}); addRuf(top?50:25);
        let extra=`${T.ico} ${T.name} gehört dir${top?' · 🎯 Spitzenreiter-Prämie: ⭐ doppelt':''}`;
        if(controller(d)===me.id)extra+=` · 👑 ${d.name} unter deiner Kontrolle`;
        const bty=await claimBounty(victim); if(bty)extra+=` · 💰 Kopfgeld +${fmt(bty)} sauber`;
        addEvent({kind:'atk',actor:me.id,target:victim,district:did,txt:`${me.name} hat ${vName} ${art(s.type)} ${T.name} in ${d.name} abgenommen!${isNpc(victim)?'':' BratCoin −1 %.'}`});
        if(!isNpc(victim))coinPush(-.01,'event');
        if(top)addEvent({kind:'info',actor:me.id,target:victim,district:did,txt:`🎯 ${me.name} legt sich mit der Nr. 1 an: ${vName} verliert ${art(s.type)} ${T.name} in ${d.name}!`});
        step('laden'); showResult(true,'ÜBERNOMMEN!',pick(LINES.takeOk),extra,'c-yellow');
      }else{
        bk('heat',{heat:8+cam(s)}); const lost=hurtCrew(trip.n,trip.id);
        addEvent({kind:'def',actor:me.id,target:victim,district:did,txt:`${vName} schlägt eine Übernahme von ${me.name} in ${d.name} zurück.`});
        showResult(false,'ABGEWEHRT!',pick(LINES.takeNo),lost);
      }
    }else{
      if(ok){
        let amt, coins=0;
        if(isNpc(victim))amt=Math.round((300+s.lvl*400)*mult);
        else{const v=players[victim]||{clean:0,coins:0},nb=newbieProt(victim)?.4:1;amt=Math.round(Math.min(Math.max(200,v.clean*.12*mult),v.clean)*nb);
          // Ab Beta 4.4: Hacker klauen auch 12 % der BratCoins (ab 5.0 zählen sie mit dem Kurs vom Hack in den Einstand)
          coins=Math.floor(Math.min((+v.coins||0)*.12*mult,+v.coins||0)*nb*100)/100}
        if(amt<=0&&coins<=0){showResult(false,'KONTO LEER','Da war nichts zu holen.','');await savePlayer();return}
        bk('hack',{clean:amt,coins,basis:coins*priceAt(now()),heat:4+cam(s)}); addRuf(15); weekLoot(amt);
        addEvent({kind:isNpc(victim)?'atk':'hack',actor:me.id,target:victim,district:did,amount:amt,loot:coins>0?{c:coins}:null,txt:`${me.name} hat ${vName} gehackt: ${fmt(amt)} sauberes Geld${coins>0?` und ${de(coins,1)} BratCoin`:''} weg!`});
        showResult(true,'GEHACKT!',pick(LINES.hackOk),`+${fmt(amt)} sauber${coins>0?` · 🪙 +${de(coins,2)} BratCoin`:''}`,'c-clean');
      }else{
        bk('heat',{heat:6+cam(s)});
        showResult(false,'ZUGRIFF VERWEIGERT',pick(LINES.hackNo),'');
      }
    }
    }finally{if(car){if(me.heat>h0)bk('nitro',{heat:h0-me.heat});if(trip)dropTrip(trip.id);savePlayer()}}
    await savePlayer();
  }),{quick:isNpc(victim)});
}

/* ======================================================================
   Beta 4 „Der Coup“: Ruf-Stufen, Freischaltungen, Coups, Tagesziele
   ====================================================================== */
const RUF_AT=[0,150,500,1200,2500,5000,10000];
const RUF_TITLE=['Straßenhaufen','Eckbande','Kiezbande','Viertel-Clan','Syndikat','Kartell','Imperium'];
const RUF_ART=['ein','eine','eine','ein','ein','ein','ein']; // für „ist jetzt ein …“
// Ab welcher Stufe etwas freigeschaltet ist (fehlt ein Eintrag: ab Stufe 1)
const UNLOCK={shisha:2,brenn:2,schrott:2,hehler:2,club:3,gear:3,immo:4,f:2,a:2,h:3,guards:2,uebernahme:3,hack:3,coin:3,sec1:3,sec2:4,sec3:5,tip:3,ally:3,heist:3,open:3,lm:3,dn:3};
const UNLOCK_TXT={shisha:'Shisha-Bar',brenn:'Brennerei',schrott:'Schrottplatz',gear:'Ausrüstung',hehler:'Hehlerlager',club:'Club',immo:'Immobilie',f:'Fahrer',a:'Anwalt',h:'Hacker',guards:'Türsteher',uebernahme:'Übernahme',hack:'Hack',coin:'BratCoin',sec1:'Stahltür',sec2:'Kamera',sec3:'Tresor',tip:'Anonymer Tipp',ally:'Bündnis & Angebote',heist:'Großcoups',open:'Stadtteile erschließen',lm:'Wahrzeichen stürmen',dn:'Darknet'};
function rufOf(p){return p&&p.ruf!=null?(+p.ruf||0):null}
function levelOfRuf(r){let l=1;for(let k=0;k<RUF_AT.length;k++)if(r>=RUF_AT[k])l=k+1;return l}
function levelOf(o){if(isNpc(o))return null;const p=o===(me&&me.id)?me:players[o];const r=rufOf(p);return r==null?null:levelOfRuf(r)}
function myLevel(){return levelOfRuf(+me.ruf||0)}
function titleOf(l){return RUF_TITLE[Math.max(0,Math.min(RUF_TITLE.length,l)-1)]}
function unlocked(k){return myLevel()>=(UNLOCK[k]||1)}
function lockTxt(k){const l=UNLOCK[k]||1;return `🔒 ab Stufe ${l} (${titleOf(l)})`}
function unlocksAt(l){return Object.keys(UNLOCK).filter(k=>UNLOCK[k]===l).map(k=>UNLOCK_TXT[k])}
function addRuf(v,why){
  if(!me||!(v>0))return;
  if(srvFight()&&why)bk('ruf',{},why); // ab 5.1.1: Der Server schreibt den Ruf gut, hier nur gleich anzeigen
  if(holds(me.id,'kaiserburg'))v*=2; // ab 5.0: Kaiserburg doppelter Ruf
  ensureWeek();
  const before=myLevel(); me.ruf=(+me.ruf||0)+Math.round(v); levelUp(before);
}
function levelUp(before){
  const after=myLevel();
  if(after>before){
    const neu=unlocksAt(after);
    toast(`⭐ Aufgestiegen: ${titleOf(after)}!${neu.length?' Neu: '+neu.join(', '):''}`,'good'); floatGain('⭐');
    addEvent({kind:'info',actor:me.id,txt:`⭐ ${me.name} ist jetzt ${RUF_ART[after-1]||'ein'} ${titleOf(after)}.`});
  }
}
/* Bestehende Banden (vor Beta 4) bekommen eine Stufe, die alles abdeckt, was sie schon haben */
function assignRuf(){
  let need=1;
  mySlots().forEach(([s])=>{need=Math.max(need,UNLOCK[s.type]||1,(+s.sec||0)>0?UNLOCK['sec'+s.sec]:1)});

}

const DAY=24*HOUR;
const HIDE_EV=new Set(['duel','dres','help','allyask','offer','offerok','gift','heist','smuggle','fest']); // nur für Push, nicht im Kurier

/* ---------- Stadtfunk ---------- */
const MSG_MAX=200, MSG_GAP=5000, MSG_DAYS=7;
let msgs=[], lastSent=0;
let readMem=null; // Gelesen-Stand, falls der Browser keinen Speicher erlaubt
function readMap(){if(readMem)return readMem;try{readMem=JSON.parse(lsGet('imperium-read')||'{}')||{}}catch(e){readMem={}}return readMem}
function markRead(ch){const m=readMap();m[ch]=now();try{lsSet('imperium-read',JSON.stringify(m))}catch(e){}}
function chanOf(m){return m.recipient==null?'city':(m.sender===me.id?m.recipient:m.sender)}
function addMsg(m){if(!m||m.gone||msgs.some(x=>x.id===m.id))return false;msgs.push(m);msgs.sort((a,b)=>+a.ts-+b.ts||a.id-b.id);if(msgs.length>400)msgs.splice(0,msgs.length-400);return true}
async function loadMsgs(){
  if(!me)return;
  const since=now()-MSG_DAYS*DAY;
  try{
    const [a,b,c]=await Promise.all([
      q(sb.from('messages').select('*').eq('world',WORLD).is('recipient',null).gt('ts',since).order('ts',{ascending:false}).limit(120)),
      q(sb.from('messages').select('*').eq('world',WORLD).eq('recipient',me.id).gt('ts',since).order('ts',{ascending:false}).limit(200)),
      q(sb.from('messages').select('*').eq('world',WORLD).eq('sender',me.id).gt('ts',since).order('ts',{ascending:false}).limit(200))]);
    [...(a||[]),...(b||[]),...(c||[])].forEach(addMsg);
  }catch(e){console.warn(e)}
}
function unreadOf(ch){const r=readMap()[ch]||0;return msgs.filter(m=>chanOf(m)===ch&&m.sender!==me.id&&+m.ts>r).length}
function dmUnread(){const chs=new Set(msgs.filter(m=>m.recipient===me.id).map(m=>m.sender));let n=0;chs.forEach(c=>{n+=unreadOf(c)});return n}
function dmChans(){
  const last={};msgs.forEach(m=>{if(m.recipient==null)return;const c=chanOf(m);last[c]=Math.max(last[c]||0,+m.ts)});
  if(ui.chan&&ui.chan!=='city'&&!last[ui.chan])last[ui.chan]=now();
  return Object.keys(last).filter(c=>ownerInfo(c)).sort((x,y)=>last[y]-last[x]);
}
let msgSel=null;
function msgItem(m){
  const mine=m.sender===me.id, oi=ownerInfo(m.sender)||{name:'Unbekannt',color:'#888'};
  return `<li class="msg ${mine?'me':''}">${mine?'':portrait(m.sender,28)}<div ${mine?`class="tap" data-act="msel" data-id="${m.id}" role="button" aria-label="Eigene Nachricht, antippen zum Löschen"`:''}><small><b style="color:${oi.color}">${esc(oi.name)}</b> · ${ago(+m.ts)}</small><p>${esc(m.txt)}</p>${mine&&msgSel===m.id?`<button class="minib del" data-act="mdel" data-id="${m.id}">🗑️ Löschen</button>`:''}</div></li>`;
}
async function deleteMsg(id){
  const m=msgs.find(x=>x.id===id); if(!m||m.sender!==me.id)return;
  try{await q(sb.from('messages').update({gone:true}).eq('id',id).eq('sender',me.id))}catch(e){console.warn(e);toast('Löschen hat nicht geklappt. Versuch es nochmal.','bad');return}
  msgs=msgs.filter(x=>x.id!==id); msgSel=null; refreshChat(); toast('🗑️ Nachricht gelöscht.','good');
}
function onMsgGone(o){if(!o||o.id==null)return;const n=msgs.length;msgs=msgs.filter(x=>x.id!==o.id);if(msgs.length!==n&&!refreshChat())renderTabs()}
function chatList(){
  const ch=ui.chan||'city', list=msgs.filter(m=>chanOf(m)===ch).slice(-80);
  if(!list.length)return `<li class="msg empty">${ch==='city'?'Noch still im Funk. Sag was, die ganze Stadt hört mit.':`Noch keine Nachrichten mit ${esc((ownerInfo(ch)||{}).name||'')}. Nur ihr beide könnt das lesen.`}</li>`;
  return list.map(msgItem).join('');
}
function funkHTML(){
  const ch=ui.chan||'city', chans=dmChans();
  const chip=(c,label,n)=>`<button class="fch ${ch===c?'on':''}" data-act="chan" data-c="${c}">${label}${n?` <b class="nb">${n}</b>`:''}</button>`;
  return `<div class="fchans">${chip('city','📻 Stadt',unreadOf('city'))}${chans.map(c=>chip(c,`${esc(ownerInfo(c).name)}`,unreadOf(c))).join('')}</div>
    <section class="card chatbox"><ul class="chat" id="chatlist">${chatList()}</ul>
    <div class="sendrow"><input id="fmsg" class="inp sm" maxlength="${MSG_MAX}" placeholder="${ch==='city'?'An die ganze Stadt …':'Direktnachricht an '+esc((ownerInfo(ch)||{}).name||'')+' …'}" autocomplete="off" enterkeyhint="send"><button class="btn sm" data-act="fsend">Senden</button></div>
    <p class="small muted">${ch==='city'?'Alle Banden lesen mit. Direktnachrichten schreibst du über 💬 in der Übersicht einer Bande.':'Nur ihr beide lest diese Nachrichten.'} Eigene Nachricht antippen zum Löschen. Nachrichten verschwinden nach ${MSG_DAYS} Tagen.</p></section>`;
}
function scrollChat(){const el=document.getElementById('chatlist');if(el)el.scrollTop=el.scrollHeight}
function refreshChat(){
  const el=document.getElementById('chatlist'); if(!el)return false;
  const keepPos=msgSel!=null, top=el.scrollTop;
  el.innerHTML=chatList(); if(keepPos)el.scrollTop=top;else scrollChat(); markRead(ui.chan||'city'); renderTabs(); return true;
}
async function sendMsg(){
  const el=document.getElementById('fmsg'); if(!el)return;
  const t=(el.value||'').trim().replace(/\s+/g,' ').slice(0,MSG_MAX); if(!t)return;
  if(now()-lastSent<MSG_GAP){toast('Kurz durchatmen: höchstens eine Nachricht alle 5 Sekunden.','bad');return}
  if(isBad(t)){toast('Bitte ohne Beleidigungen oder Schimpfwörter.','bad');return}
  lastSent=now(); el.value='';
  const ch=ui.chan||'city', row={world:WORLD,ts:now(),sender:me.id,recipient:ch==='city'?null:ch,txt:t};
  try{const d=await q(sb.from('messages').insert(row).select());if(d&&d[0])addMsg(d[0])}
  catch(e){console.warn(e);toast('Nachricht nicht gesendet. Versuch es nochmal.','bad');el.value=t;lastSent=0;return}
  refreshChat();
}
function onMsg(m){
  if(!m||!me||m.world!==WORLD)return;
  if(!(m.recipient==null||m.recipient===me.id||m.sender===me.id))return;
  if(!addMsg(m))return;
  const viewing=ui.tab==='feed'&&ui.feedTab==='funk'&&(ui.chan||'city')===chanOf(m);
  if(viewing)refreshChat();
  else if(m.recipient===me.id){toast(`💬 ${(ownerInfo(m.sender)||{}).name||'Nachricht'}: ${m.txt.slice(0,60)}`,'ev');renderTabs()}
  else if(ui.tab==='feed'&&ui.feedTab==='funk')renderMain();
  else renderTabs();
}
function openDM(o){closeModal();ui.tab='feed';ui.feedTab='funk';ui.chan=o;render();setTimeout(scrollChat,30)}

/* ---------- Überfall als Duell ---------- */
const DUEL_MS=5*60000, DUEL_GRACE=20000;
let duels=[];
async function loadDuels(){
  try{
    // liegengebliebene Entscheidungen (App beim Rechnen geschlossen) wieder freigeben (ab 5.1.1 entscheidet der Server)
    if(!srvFight())await q(sb.from('duels').update({status:'open'}).eq('world',WORLD).eq('status','res').lt('ends_at',now()-3*60000));
    duels=(await q(sb.from('duels').select('*').eq('world',WORLD).eq('status','open')))||[];
  }catch(e){console.warn(e)}
}
function duelOn(did,i){return duels.find(x=>x.status==='open'&&x.district===did&&+x.idx===+i)}
function myIncoming(){return duels.filter(x=>x.status==='open'&&x.victim===me.id&&now()<+x.ends_at)}
async function startDuel(did,i,s,mult,victim,g){
  g=g||{};
  await loadDuels();
  if(duelOn(did,i)){if(g.nosec)addGear('d',1);if(g.car)addGear('c',1);if(g.trip){dropTrip(g.trip.id);if(g.trip.c)addWare('f',g.trip.c)}showResult(false,'BESETZT','Dort läuft schon ein Überfall. Such dir ein anderes Ziel.','',null,true);return}
  const d=DM[did], T=TYPES[s.type], vName=ownerInfo(victim).name;
  if(g.car&&g.trip)dropTrip(g.trip.id); // Nitro: Trupp sofort zurück
  const row={world:WORLD,ts:now(),attacker:me.id,victim,district:did,idx:i,atk:atkPow(g.trip?g.trip.n:0)*mult,mult,newbie:newbieProt(victim),cam:g.nosec?0:cam(s),ends_at:now()+DUEL_MS,status:'open'};
  if(g.nosec)row.nosec=true; if(g.car)row.car=true; if(tgtFor(victim))row.tgt=true; // Ab 4.5.1: Zielscheibe
  const data=await q(sb.from('duels').insert(row).select()); if(data&&data[0])duels.push(data[0]);
  await addEvent({kind:'duel',actor:me.id,target:victim,district:did,txt:`${me.name} überfällt in ${d.name} deinen Laden: ${T.ico} ${T.name}! Du hast 5 Minuten, um dich zu wehren.`});
  const al=allyOf(victim); // Ab Beta 4.5: Der Verbündete des Opfers kann Schläger schicken
  if(al&&al!==me.id&&players[al])await addEvent({kind:'help',actor:me.id,target:al,district:did,txt:`🤝 ${me.name} überfällt deinen Spezl ${vName} in ${d.name}! Du hast 5 Minuten, um Schläger zu schicken.`});
  lastVictim=null; // Ab Beta 4.4.1: Spruch erst mit dem Ergebnis
  showResult(true,'ÜBERFALL LÄUFT!',`${esc(vName)} hat jetzt 5 Minuten, um sich zu wehren. Das Ergebnis bekommst du als Mitteilung und im Kurier.`,`⏱️ Entscheidung in 5 Minuten${row.tgt?' · Prämie auf die Nr. 1':''}${g.nosec?` · 🗝️ Dietrich im Einsatz, noch ${hasG(me,'d')}`:''}${g.car?` · 🚀 Trupp sofort zurück, Nitro noch ${hasG(me,'c')}`:g.trip?` · 🚗 ${g.trip.n} Schläger vor Ort`:''}`,'c-yellow',true);
}
async function resolveDuels(){
  for(const x of duels.slice()){
    if(x.status!=='open')continue;
    const mineX=x.victim===me.id||x.attacker===me.id;
    if(now()<+x.ends_at+(mineX?0:DUEL_GRACE))continue;
    let row=null;
    try{const r=await q(sb.from('duels').update({status:'res'}).eq('id',x.id).eq('status','open').select());row=r&&r[0]}catch(e){console.warn(e)}
    x.status='res';
    if(!row)continue;
    try{await settleDuel(row)}catch(e){console.warn(e);try{await q(sb.from('duels').update({status:'open'}).eq('id',row.id))}catch(_){}}
  }
  duels=duels.filter(x=>x.status==='open');
}
async function settleDuel(x){
  const d=DM[x.district]; const s=await fetchSlot(x.district,+x.idx);
  const vName=ownerInfo(x.victim).name, aName=ownerInfo(x.attacker).name;
  let ok=false, loot=0, vest=false; const ware={};
  if(s&&s.owner===x.victim){
    if(x.victim!==me.id){try{const pv=await q(sb.from('players').select('*').eq('id',x.victim));if(pv&&pv[0])players[x.victim]=norm(pv[0])}catch(e){}}
    const vp=x.victim===me.id?me:players[x.victim];
    // Ab Beta 4.4: Schutzweste des Opfers (+20 %), Dietrich des Angreifers (Sicherung zählt nicht)
    vest=hasG(vp,'w')>0;
    const def=(defOf(s,d,!!x.nosec,x.attacker)+(+x.help||0)*2.5)*(1+(+x.def_bonus||0))*(vest?1+VEST:1); // ab 4.5 mit Schlägern vom Spezl
    ok=Math.random()<clamp(+x.atk/(+x.atk+def),.05,.95);
    if(ok){
      const cur=curStock(s,d); loot=Math.round(cur*Math.min(!x.nosec&&(+s.sec||0)>=3?.5:1,.5+.4*(+x.mult||1))*(x.newbie?.4:1));
      if(loot>0){const done=await casSlot(x.district,+x.idx,{owner:x.victim,ver:s.ver},{stock:cur-loot,stock_at:now(),ver:s.ver+1});if(!done)loot=0}
      // Ab Beta 4.4: Ein gelungener Überfall raubt auch 20 % vom Lager
      Object.keys(WARE).forEach(k=>{const n=Math.floor(hasW(vp,k)*LAGER_RAUB*(x.newbie?.4:1));if(n>0)ware[k]=n});
    }
  }
  const wl=Object.keys(ware).length?ware:null;
  await q(sb.from('duels').update({status:'done',ok,loot,ware:wl}).eq('id',x.id));
  const T=s?TYPES[s.type]:{name:'Laden'}, wt=wl?wareTxt(wl):'';
  const l=wl||vest?Object.assign({},wl||{},vest?{w:1}:{}):null;
  if(ok)await addEvent({kind:'atk',actor:x.attacker,target:x.victim,district:x.district,amount:loot,loot:l,txt:`${aName} hat ${vName}s ${T.name} in ${d.name} ausgeraubt: ${fmt(loot)}${wt?` und ${wt}`:''} weg!${x.defended?' Die Gegenwehr hat nicht gereicht.':''}${x.tgt?' Volltreffer auf die Nr. 1!':''}${vest?' 🦺 Auch die Schutzweste hat nicht gereicht.':''}`});
  else await addEvent({kind:'def',actor:x.attacker,target:x.victim,district:x.district,loot:l,txt:`${vName} wehrt einen Überfall von ${aName} in ${d.name} ab.${x.defended?' 💪 Live verteidigt!':''}${+x.help>0?` 🤝 ${ownerInfo(x.helper).name} hat ${x.help} Schläger geschickt.`:''}${vest?' 🦺 Die Schutzweste hat gehalten.':''}`});
  await addEvent({kind:'dres',actor:x.victim,target:x.attacker,district:x.district,amount:loot,txt:ok?`Dein Überfall auf ${vName} in ${d.name} hat geklappt: +${fmt(loot)} Bargeld${wt?`, ${wt}`:''}.`:`${vName} hat deinen Überfall in ${d.name} abgewehrt.`});
  if(x.victim===me.id){toast(ok?`😤 ${aName} hat dich ausgeraubt: ${fmt(loot)}${wt?` und ${wt}`:''} weg.`:`💪 Überfall von ${aName} abgewehrt!`,ok?'bad':'good');await applyHacks();savePlayer()}
  dirty=true;
}
async function payDuels(){
  let rows=[];
  try{rows=(await q(sb.from('duels').update({status:'paid'}).eq('world',WORLD).eq('attacker',me.id).eq('status','done').select()))||[]}catch(e){console.warn(e);return}
  if(!rows.length)return;
  for(const x of rows){
    const vName=ownerInfo(x.victim).name, d=DM[x.district], loot=+x.loot||0;
    const xw=lootOf({loot:x.ware})||{}, wt=wareTxt(xw);
    if(x.ok){
      const tg=x.tgt&&loot>0?Math.min(TGT_MAX,Math.round(loot*TGT_PCT)):0; // Ab 4.5.1: Prämie für einen Treffer auf die Nr. 1
      bk('duel',{bar:loot+tg,heat:x.car?0:(8+(+x.cam||0))*fogMul(+x.ts)}); weekLoot(loot+tg); Object.keys(xw).forEach(k=>addWare(k,+xw[k]||0));
      addRuf(x.tgt?TGT_RUF:15); daily('rob',1); daily('robReal',1);
      const b=await claimBounty(x.victim);
      resultOrToast(true,loot>0||wt?'BEUTE!':'LEER!',loot>0||wt?`${esc(vName)} in ${d.name}: ${pick(LINES.robOk)}`:'Rein, umgeschaut, nichts drin.',[loot>0?'+'+fmt(loot)+' Bargeld':'',wt?'+'+wt:'',tg?`Prämie Nr. 1 +${fmt(tg)}`:'',b?`💰 Kopfgeld +${fmt(b)} sauber`:''].filter(Boolean).join(' · '),'c-dirty',{to:x.victim});
    }else{
      if(!x.car)bk('heat',{heat:(5+(+x.cam||0))*fogMul(+x.ts)});
      // Ab Beta 4.8: Verletzte statt geschnappter Schläger; Truppgröße aus der Angriffskraft

const TRUCK_D=['flughafen','johannis','maxfeld','erlenstegen','gostenhof','altstadt','woehrd','leonhard','suedstadt','zabo','hafen','langwasser'];
const TRUCK_MS=30*60000, TRUCK_NPC=20*60000, TRUCK_E=2;
function th(s){return strHash(s)/4294967296}
function trucksOfDay(dd){
  const k=0, qn=32+Math.floor(th(`t${dd}:${k}:q`)*24), at=dd*DAY+qn*15*60000;
  // Ab 4.5.1: Der zweite Transporter ist der Feierabend-Coup um 22 Uhr deutscher Zeit
  return [{id:`${dd}-${k}`,at,until:at+TRUCK_MS,d:TRUCK_D[Math.floor(th(`t${dd}:${k}:d`)*TRUCK_D.length)],loot:15000+Math.floor(th(`t${dd}:${k}:l`)*11)*1000},faOfDay(dd)];
}
function truckNow(){const t=now(), dd=Math.floor(t/DAY);return trucksOfDay(dd).find(x=>t>=x.at&&t<x.until)||null}

  const id='F'+dayStr(dd);

  return {id,at,until:at+TRUCK_MS,d:TRUCK_D[Math.floor(th(id+':d')*TRUCK_D.length)],loot:FA_LOOT,fa:true};
}

/* WANTED: höchstes Kopfgeld zuerst, aufgefüllt mit den Top 3 der Rangliste */
function wantedList(r){
  // Ab 4.5.1: Die Nr. 1 der echten Banden hängt immer ganz vorn (Zielscheibe)
  const tp=topReal(), first=tp&&Object.keys(players).length>1?r.find(x=>x.o===tp.o):null;
  if(first)return [first,...wantedList0(r.filter(x=>x!==first))].slice(0,3);
  return wantedList0(r);
}
function wantedList0(r){
  const withB=r.filter(x=>!isNpc(x.o)&&bountyOn(x.o)>0).sort((a,b)=>bountyOn(b.o)-bountyOn(a.o));
  const out=withB.slice(0,3); for(const x of r){if(out.length>=3)break;if(!out.includes(x))out.push(x)}
  return out;
}

function cap1(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function sellWare(k){
  if(!unlocked('brenn'))return;
  const n=hasW(me,k); if(n<1)return;

    const v=n*WARE[k].price, pd={w:{[k]:n},cu:'bar',c:-v}; addWare(k,-n); me.bar+=v; shopPend.push(pd);

    return shopLater(async()=>{await shopAct('verkauf',{k},false,pd)});
  }
  const v=n*WARE[k].price; addWare(k,-n); bk('sell',{bar:v}); savePlayer();
  floatGain('+'+fmt(v)); toast(`📦 ${n} ${WARE[k].name} an den Hehler: +${fmt(v)} Bargeld`,'good');

function gearBlock(k){

  if(hasG(me,k)>=GEAR_MAX)return `Du hast schon ${GEAR_MAX}`;
  const miss=Object.keys(G.need).filter(w=>hasW(me,w)<G.need[w]);
  return miss.length?`Fehlt: ${miss.map(w=>`${G.need[w]-hasW(me,w)} ${WARE[w].name}`).join(', ')}`:null;

function craft(k){
  const G=GEAR[k]; if(!G||gearBlock(k))return;
  if(srvFight())return craftSrv(k);
  Object.keys(G.need).forEach(w=>addWare(w,-G.need[w])); addGear(k,1); savePlayer();

}
