function stufenHTML(){
  return 'Ruf sammelst du mit Coups, Tageszielen, Bauen und gewonnenen Angriffen. Die Stufe zeigt, wie groß deine Bande ist:</p><table class="stufen"><tr><th>Stufe</th><th>Ruf</th><th>Neu dabei</th></tr>'+RUF_TITLE.map((t,i)=>{const u=unlocksAt(i+1);return `<tr><td><b>${i+1} · ${t}</b></td><td>${i?fmt(RUF_AT[i]):'Start'}</td><td>${i===0?'Späti, Wettbüro, Schläger, Überfall, Coups, Übernahme von KI-Läden':u.length?u.join(', '):'mehr mit späteren Updates'}</td></tr>`}).join('')+'</table><p class="small muted">Banden, die 2 oder mehr Stufen unter dir sind, stehen unter Neulingsschutz.';
}
const GUIDE=[
  ['🍀 Die Fürther kommen','Jeden Samstag um 20 Uhr greift die Kleeblatt-Gang aus Fürth an, 30 Minuten lang, in den 5 Vierteln, die Fürth am nächsten liegen. Um 19:45 und 20 Uhr kommt eine Mitteilung, oben auf der Karte zeigt ein Banner die Viertel und die Zeit. Tipp auf ein Viertel und auf 🛡️ Verteidigen: Im Minispiel verjagt jeder Treffer einen Fürther, egal wem das Viertel gehört. Nach jeder Runde 1 Min. Pause. In Viertel, die noch nicht frei sind, kommen alle 5 Minuten Fürther nach. Ein Viertel ohne Fürther ist gehalten. Hält Nürnberg am Ende 3 von 5, bekommt jede Bande, die mitverteidigt hat, 50 Ruf, die beste steht im Kurier. Sonst lacht Fürth im Kurier, mehr passiert nicht. Je mehr Banden mitspielen, desto mehr Fürther kommen. Das Minispiel wechselt jede Woche. Fürther Invaders: Zieh die Bratwurstbude hin und her, sie schießt von allein, die U1 oben bringt +3. Fürther raus!: Tipp die Fürther in den Fenstern weg, die Oma kostet 2. Kleeblatt-Ninja: Wisch durch die Fürther, ein Kleeblatt bringt +2, ein zerschnittener Lebkuchen kostet 2.','stadt'],
  ['🎓 Erste Schritte','Neue Banden sehen auf der Karte „Erste Schritte“: fünf kleine Aufgaben, jede mit 1.000 Bargeld und ⭐ 20 Ruf, alle zusammen mit 3.000 und ⚡ 2 obendrauf. Ist kein Platz frei, nimm deinen ersten Laden einer KI-Bande ab.','start'],
  ['🔢 Sparkassen-Safe','Neben den Coups unten links sitzt der 🔢 Safe. Jeden Sonntag um 20 Uhr steht ein neuer Safe mit einem Code aus 4 Ziffern da. Er startet mit 10.000 und wächst mit 10 % aller Wäsche-Gebühren und Bestechungen in der Stadt, dazu Kaution und Richter-Schmiergeld. Jede Bande hat einen Versuch pro Tag (nicht aus dem Knast). Danach steht im Kurier, welche Stellen gepasst haben, etwa „4-7-?-?“, das sehen alle. Hinweise („Stelle 2 ist eine 7“) fallen mit etwas Glück bei Coups und Überfällen ab, und im Knast verrät der Zellennachbar eine Ziffer. Wer den Code knackt, bekommt den ganzen Topf als sauberes Geld, alle bekommen Bescheid. Dann ist der Knopf grau mit 🔒 bis Sonntag 20 Uhr. Was bis dahin wieder hineinfließt, steht daneben und kommt in den neuen Safe. Knackt ihn bis Sonntag 20 Uhr niemand, verrät der Kurier den Code und das Geld wandert in den neuen Safe.','akt'],
  ['🎯 Coups','Tipp auf 🎯 auf der Karte, auf „Coups“ unten links oder auf ⚡ oben. Alle 2 Stunden gibt es drei neue Coups: leicht (⚡1), mittel (⚡2) und schwer (⚡3). Im Minispiel blinken Alarm-Lichter, die du nachtippst. Jede Runde kommt ein Licht dazu, das ergibt bis zu 3 Treffer. Bei leichten Coups brauchst du einen Treffer, bei mittleren und schweren zwei. Leichte Coups kannst du auch „schnell erledigen“, das zählt wie 2 Treffer. Gelingt der Coup, gibt es Bargeld und Ruf, manchmal einen Glücksfund. Coups machen etwas Hitze. Energie lädt sich alle 20 Minuten um 1 auf, höchstens 5.','akt'],
  ['✅ Tagesziele & ⭐ Ruf','Die Tagesziele stehen oben im Coups-Fenster, wie viele du heute schon hast, zeigt der Coups-Knopf auf der Karte. Um Mitternacht gibt es neue. Jeden Tag gibt es drei Ziele: zwei wie Coups machen, kassieren oder waschen und eins mit Mitspielern, also einen Überfall auf eine echte Bande gewinnen, auf Kurier-Meldungen anderer Banden reagieren oder nach einem Kampf einen Spruch hinterlassen. Jedes bringt Bargeld und Ruf, alle drei zusammen Bonus-Ruf, 2 Energie und verlängern deine Serie. Ruf bekommst du auch fürs Bauen und für gewonnene Angriffe. Mit jeder Stufe wird etwas freigeschaltet, siehe ⭐ Stufen.','akt'],
  ['⭐ Stufen',stufenHTML(),'start'],
  ['🎯 Ziel','Werde Boss der Stadt. Die Rangliste zählt dein Vermögen: Geschäfte, sauberes Geld, Bargeld, BratCoin und jedes Viertel, das du kontrollierst.','start'],
  ['💵 Bargeld verdienen','Wettbüros, Hehlerlager und Clubs füllen laufend ihre Kasse. Nach etwa 3 Stunden ist eine Kasse voll und hört auf zu wachsen. Also regelmäßig abholen, bevor andere sie ausrauben. Dein Geld rechnet der Server, Kassieren braucht deshalb Netz.','geld'],
  ['🧼 Geld waschen','Spätis und Shisha-Bars waschen dein Bargeld automatisch zu sauberem Geld (10 % Gebühr). Gewaschen wird nur Bargeld, das du verdienst (Kassen, Schutzgeld, Beute), dein Startgeld bleibt dir zum Bauen. Eine Reserve bleibt immer als Bargeld liegen, die stellst du unter Geld ein. Sauberes Geld brauchst du für Immobilien, Bestechung und manche Upgrades.','geld'],
  ['🔑 Stadtteile erschließen','Zehn Nürnberger Stadtteile sind noch schraffiert. Ab Stufe 3 tippst du auf einen mit 🔑 und erschließt ihn für 10 % deines sauberen Geldes, mindestens 5.000. Jede Bande schafft einen pro Woche (neue Woche ab Sonntag 20 Uhr). Danach hat der Stadtteil 4 Plätze für alle und einen eigenen Bonus, den ersten Platz bekommst du mit einem Späti geschenkt. KI-Banden bauen dort nicht. In der ersten halben Stunde darf jede Bande dort nur einen Laden haben (Eröffnungsrunde, der geschenkte Späti zählt mit).','stadt'],
  ['🏗️ Bauzuschlag','Bis zu deinem 14. Laden zahlst du den normalen Preis. Ab dem 15. kostet jeder neue Laden 4 % mehr pro Laden, höchstens das Doppelte. Ausbauen und Umbauen kosten wie immer.','stadt'],
  ['🏠 Heimatviertel','Im Crew-Tab tippst du daheim auf „📍 Daheim einchecken“. Das Spiel schaut einmal, in welchem Viertel du bist, und merkt sich nur das Viertel, nie den Standort. Deine Läden dort verteidigen dann 24 Std. lang mit +2. In den letzten 6 Std. kannst du verlängern, dann gilt es wieder 24 Std. ab da. Wechseln geht einmal pro Woche. Wer nicht in Nürnberg wohnt, wählt eine Wahlheimat und bekommt dauerhaft +1. Sind zwei Banden im selben Viertel daheim, ist das ein ⚔️ Lokalderby: Zwischen ihnen zählt kein Heimvorteil, und wer dort mehr Läden hat, ist 🦌 Platzhirsch.','kampf'],
  ['👑 Viertel kontrollieren','Wer mindestens die Hälfte der Plätze in einem Viertel hält und mehr als jede andere Bande, kontrolliert es. Das bringt 1.000 Schutzgeld pro Stunde, bessere Verteidigung und Punkte für die Rangliste.','kampf'],
  ['👊 Angreifen','Tipp auf einen fremden Laden: Überfall räumt die Kasse aus, Übernahme schnappt dir den Laden, Hack klaut sauberes Geld. Jede Angriffsart hat ihr Minispiel: Beim Überfall tippst du, wenn der Zeiger im grünen Feld steht, bei der Übernahme knackst du ein Drehrad, beim Hack tippst du nur die grünen Pakete. Gegen KI-Banden kannst du auch „schnell erledigen“, das zählt wie 2 Treffer. Für Überfall und Übernahme wählst du mit − und +, wie viele Schläger mitfahren: In jedes Auto passen 3 Schläger, dein eigenes fährt umsonst, jedes Fahrer-Auto braucht 1 🥃 Fusel. Pro Angriff fahren höchstens 3 Autos, also 9 Schläger. Der Trupp ist ein paar Minuten unterwegs, deine Türsteher bleiben auf Posten. Mit genug Autos laufen mehrere Angriffe gleichzeitig, auf dieselbe Bande aber immer nur einer. Geht ein Angriff schief, fällt jeder 4. Mitfahrer 1 Std. verletzt aus. Nach einem Hack machen nur deine Hacker 10 Minuten Pause. Ein gelungener Überfall auf Mitspieler holt auch 20 % ihres Lagers, ein Hack auch 12 % ihrer BratCoins. Raubst oder hackst du dieselbe Bande am selben Tag öfter, gibt es beim zweiten Mal die Hälfte der Beute und danach ein Viertel. Wie voll die Kasse eines fremden Ladens ist, siehst du im Angriffsfenster.','kampf'],
  ['🎲 Fair gewürfelt','Ob ein Angriff, Coup oder Großcoup klappt, würfelt der Server. Dein Handy schickt nur, wie gut du im Minispiel warst. Ohne Netz geht deshalb kein Angriff.','kampf'],
  ['🚨 Polizei-Hitze','Wettbüros, Hehlerlager, Clubs und Angriffe erhöhen die Hitze. Pro Stunde sinkt sie um 5, jeder Anwalt senkt sie um 4 mehr. Deine Läden heizen höchstens bis 80, darüber bringen dich nur Angriffe, und dort sinkt die Hitze um mindestens 10 pro Stunde. Ab 60 kommen Kontrollen, ab 80 Razzien im heißesten Viertel, bei 100 sofort die große Razzia und 2 Stunden 🚔 Knast. Bist du weg, gibt es höchstens ein Polizei-Ereignis und nie die große Razzia. Tipp oben auf 🚨: Dort steht alles im Detail. Bestechung senkt die Hitze sofort um 25, jedes weitere Mal am Tag kostet 1.000 mehr.','pol'],
  ['🚪 Türsteher & Sicherung','Türsteher heuerst du ab Stufe 2 im Crew-Tab unter 🚪 Türsteher an und stellst sie dort (oder über 🚪 in der Viertel-Leiste) in ein Viertel: Leere Tür antippen stellt einen hin, volle Tür zieht ihn ab. Jeder verteidigt alle deine Läden im Viertel mit +2,5, höchstens 3 pro Viertel zählen. Anheuern kannst du nur so viele, wie du Türen hast: 3 je Viertel mit eigenem Laden. Ein gelber Kreis am Reiter zeigt freie Türsteher für leere Türen, ein roter Türsteher ohne Tür. Türsteher greifen nicht an, Schläger verteidigen nicht. Dazu kann jeder Laden eine Sicherung bekommen: 🚪 Stahltür (+3 Verteidigung), 📹 Kamera (Angreifer bekommen +5 Hitze), 🔐 Tresor (Überfälle holen höchstens die Hälfte der Kasse).','kampf'],
  ['📻 Stadtfunk','Im Kurier oben auf „📻 Funk“ tippen. „Stadt“ lesen alle Banden mit. Eine Direktnachricht schreibst du über 💬 in der Übersicht einer Bande, dann erscheint sie oben als eigener Kanal. Höchstens 200 Zeichen, eine Nachricht alle 5 Sekunden, ohne Schimpfwörter. Eine eigene Nachricht antippen, dann erscheint „🗑️ Löschen“. Nachrichten verschwinden nach 7 Tagen. Für Direktnachrichten gibt es eine Mitteilung, das schaltest du unter ☰ → Mitteilungen.','stadt'],
  ['🚗 Autos & Trupp','Deine Garage steht oben im Crew-Tab: dein eigenes Auto und eins pro Fahrer, mit Uhr, solange es unterwegs ist. Ein Fahrer kostet beim Anheuern 1.000 Bargeld und 3 🔩 Teile für sein Auto, jede Fahrt 1 🥃 Fusel. Teile bauen das Auto, Fusel füllt den Tank. Im Angriffsfenster wählst du mit − und +, wie viele Schläger mitfahren, die Autos füllen sich von selbst. Angriffskraft ist 1 plus die Schläger im Trupp. Mehr Fahrer in der Bande machen jede Fahrt schneller, bis 6 Fahrer (dann 3 Minuten).','kampf'],
  ['🚨 Überfall als Duell','Ein Überfall auf eine Bande von Mitspielern ist nicht sofort entschieden. Nach deinem Minispiel läuft er 5 Minuten, das Opfer bekommt eine Mitteilung. In der Zeit kann es sich mit einem eigenen Minispiel wehren (bis zu 50 % mehr Verteidigung) oder alle freien Schläger als Wache ins Viertel schicken. Danach wird entschieden, beide bekommen das Ergebnis. Reagiert das Opfer nicht, zählt die normale Verteidigung. Übernahme, Hack und Angriffe auf KI-Banden laufen weiter sofort.','kampf'],
  ['🚚 Geldtransporter','Einmal am Tag, tagsüber zu einer zufälligen Zeit, steht für 30 Minuten ein Geldtransporter in einem Viertel. Alle bekommen eine Mitteilung, auf der Karte erscheint 🚚. Knacken kostet ⚡ 2, im Minispiel tippst du Alarm-Lichter nach und brauchst zwei Treffer. Jede Bande hat einen Versuch, der erste Erfolg kassiert 15.000 bis 25.000 Bargeld und ⭐ 40. Nach 20 Minuten schnappt ihn sich eine KI-Bande.','akt'],
  ['🍺 Feierabend-Coup','Der zweite Geldtransporter des Tages kommt fest um 22 Uhr: In einem Viertel wird die Tageskasse abgeholt, 30 Minuten lang. Alle bekommen eine Mitteilung, auf der Karte erscheint 🍺. Wie beim Geldtransporter: ⚡ 2, zwei Treffer, ein Versuch pro Bande. Der erste Erfolg kassiert 30.000 Bargeld und ⭐ 50. Keine KI-Bande schnappt ihn weg, er gehört den echten Banden.','akt'],
  ['🎄 Feste','Zu Festen in Nürnberg passiert in der Stadt mehr. Vom 27.11. (17:30 Uhr) bis 24.12. (14 Uhr) ist Christkindlesmarkt: Läden in der Altstadt bringen +25 % Bargeld, und in jedem 2-Stunden-Fenster gibt es einen 🎄 Markt-Coup (⚡1). Gelungen bringt er Bargeld und ❤️ 3 Lebkuchenherzen, geplatzt ❤️ 1. Herzen gibt es höchstens 25 am Tag, auch wer spät einsteigt, kann aufholen. Im Rang-Tab zeigt „🎄 Markt“ die Rangliste der echten Banden, sonntags berichtet der Kurier. Am 24.12. um 14 Uhr bekommen die ersten drei 30.000, 15.000 und 10.000 sauber, der Sieger trägt den 🎄 für immer am Namen, jede Bande mit mindestens 30 ❤️ ein Jahr lang den 🍪.','stadt'],
  ['🛷 Lebkuchen-Schmuggel','Nur während des Christkindlesmarkts: Einmal am Tag zwischen 9 und 22 Uhr kannst du eine Ladung Lebkuchen durch die Altstadt schmuggeln (⚡2, im Fest-Fenster oder bei den Coups). Sie ist 20 Minuten unterwegs, alle anderen echten Banden bekommen eine Mitteilung und sehen 🛷 auf der Karte. Kommt sie durch, bekommst du ❤️ 10 und Bargeld. Abfangen kostet ⚡1, das Minispiel ist schwer, jede Bande hat einen Versuch, Spezln nicht. Wer zuerst trifft, bekommt ❤️ 6 und das Bargeld, der Schmuggler geht leer aus.','akt'],
  ['🎯 Spitzenreiter-Prämie','Nimmst du der Nr. 1 der Rangliste einen Laden ab, bekommst du doppelten Ruf (⭐ 50 statt 25) und eine Schlagzeile im Kurier. Das gilt für jede Bande, egal wie groß du selbst bist.','kampf'],
  ['🏴 Zielscheibe','Die stärkste echte Bande hängt in der Rangliste immer ganz vorn auf dem WANTED-Plakat. Hast du höchstens halb so viele Punkte, bringt dir ein gelungener Überfall auf sie +50 % Prämie obendrauf (bis 10.000) und doppelten Ruf. Ist dieselbe Bande 3 Tage lang vorn, berichtet der Kurier.','kampf'],
  ['⚔️ Revanche','Hat dich eine Bande ausgeraubt oder gehackt, während du weg warst, siehst du das beim Öffnen. Ein Tipp auf „Revanche“ bringt dich zu ihrem Laden mit der vollsten Kasse, und 10 Minuten lang hast du gegen sie +25 % Angriffskraft. Im Kurier geht das weiter über „Rache“.','kampf'],
  ['⚔️ Rache der KI','Die KI-Banden vergessen nicht. Wer sie oft überfällt, hackt oder ihnen Läden abnimmt, macht sie wütend. Dann schlagen sie abends zurück, wenn du gerade spielst. Der Kurier kündigt die Rache vorher an und sagt, wo sie sich sammeln: Schick Türsteher hin! Gewinnt die KI, nimmt sie dir dort einen Laden ab oder legt ihn ein paar Stunden lahm. Wehrst du sie ab, bekommst du Ruf. Lässt du sie in Ruhe, beruhigen sie sich wieder. Höchstens eine Rache am Abend, dein letzter Laden ist sicher, und Banden bis Stufe 2 lassen sie in Ruhe.','kampf'],
  ['🏰 Wahrzeichen','Drei Wahrzeichen sind jede Woche umkämpft: die 🏰 Kaiserburg, der 🚇 U-Bahnhof Plärrer und ein drittes, das jeden Sonntag wechselt. Ab Stufe 3 findest du sie im Coups-Fenster unter 🚩 Wahrzeichen und in der Viertel-Leiste und stürmst sie mit deinen Schlägern. Verteidigt wird immer mit 10, Türsteher zählen dort nicht, mit 9 Schlägern hast du also 50 % Chance. Jede Bande kann nur eins halten, nach einer Eroberung gibt es 1 Std. Schonzeit. Solange du es hältst, bekommst du seinen Bonus. Beim Plärrer zeigt das Fenster die U-Bahn-Viertel, dort steht dann unten „🚇 +1 Angriff“. Sonntag um 20 Uhr bekommt jeder Halter 10.000 sauber, danach gehört alles wieder der Stadtwache.','stadt'],
  ['🏆 Boss der Woche','Jede Woche zählt dein Ruf seit Sonntag 20 Uhr plus deine Beute geteilt durch 100 (Überfälle, Hacks, Transporter). Den Zwischenstand siehst du im Reiter 🏆 Woche der Rangliste. Sonntag um 20 Uhr bekommt die beste Bande 20.000 sauberes Geld und eine Woche lang den 🏆 neben dem Namen, alle anderen bekommen eine Mitteilung, wer gewonnen hat.','stadt'],
  ['📻 Funkgerät & Mitteilungen','Unter ☰ → Mitteilungen schaltest du sie ein. Beim ersten Mal gibt es einmal 5.000 Bargeld. Banden ohne Mitteilungen haben in der Rangliste ein 📵. Neu ist eine Mitteilung, wenn dich eine Bande überholt (höchstens alle 3 Stunden), und eine bei neuen Versionen. Mitteilungen kommen nur, wenn das Spiel nicht offen ist.','stadt'],
  ['💰 Kopfgeld','Im 💻 Darknet einer anderen Bande kannst du einmal am Tag 5.000, 10.000 oder 25.000 sauberes Geld als Kopfgeld aussetzen, anonym und nur auf Banden ab Stufe 3 (Kiezbande). Mehrere Kopfgelder werden zusammengezählt. Der erste gelungene Überfall oder die erste Übernahme kassiert alles, dein eigenes Kopfgeld kannst du nicht selbst kassieren. Nach 7 Tagen ohne Treffer bekommst du dein Geld zurück. Banden mit Kopfgeld hängen auf den WANTED-Plakaten in der Rangliste, auf der Karte haben ihre Läden einen roten Rand und in der Viertel-Leiste ein 💰.','kampf'],
  ['📰 Kurier','Im Kurier steht alles, was in der Stadt passiert, ganz oben die Schlagzeile. Unter jeder Meldung kannst du mit 😂 💀 🔥 reagieren. Nach einem gelungenen Angriff auf einen Mitspieler kannst du ihm einen Spruch hinterlassen. Wehrst du einen Überfall ab, darfst du dem Angreifer einen Spruch zurückschicken. Bewegt sich BratCoin um 5 % oder mehr, meldet der Börsenticker 📈📉 die Gründe, höchstens einmal pro Stunde.','stadt'],
  ['🚔 Knast','Erreicht deine Hitze 100, kommt sofort die große Razzia (40 % Bargeld, alle Kassen) und dein Boss sitzt 2 Stunden. Wirtschaften geht weiter: bauen, kassieren, waschen, Crew. Angriffe, Coups, Tipps und der Safe warten. Im Knast verlierst du höchstens einen Laden. Raus kommst du so: 🪚 Ausbruch (ein Versuch, Minispiel mit drei Gitterstäben; klappt er, bist du sofort frei, sonst 30 Minuten länger), 💸 Kaution (10 % von Bargeld und sauberem Geld, mindestens 1.000) oder dein 🤝 Spezl zahlt sie und bekommt ⭐ 40 Ruf. Ein Rivale kann einmal den Richter schmieren (BratCoin im Wert von 3.000): 1 Stunde länger, der Kurier nennt keinen Namen. Kaution und Schmiergeld wandern in den Sparkassen-Safe. Dein Zellennachbar verrät dir pro Aufenthalt eine Ziffer des Safes.','pol'],
  ['📞 Anonymer Tipp','Im 💻 Darknet einer anderen Bande hetzt du ihr die Polizei auf den Hals: ihre Hitze +15, höchstens bis 99. Kostet BratCoin im Wert von 2.500, einmal am Tag. Mit 20 % Chance fliegst du selbst auf: +10 Hitze für dich, und der Kurier nennt deinen Namen. Nicht gegen Spezln und Banden mit Neulingsschutz.','pol'],
  ['💻 Darknet','Ab Stufe 3 (Kiezbande). Tipp auf eine andere Bande, dann auf 💻 Darknet. Dort gibt es 📞 Anonymer Tipp (BratCoin im Wert von 2.500), 🗞️ Gerücht (Wert 1.500), 📦 Paket (Wert 2.000) und 💰 Kopfgeld (sauberes Geld). Jeder Dienst geht einmal am Tag, ausgegebene Coins sind weg. Keine Coins? „+ Coins kaufen“ bringt dich direkt zum BratCoin. 🗞️ Gerücht: Du wählst einen von sechs Sätzen über die Bande, er steht im Kurier, wahr oder erfunden. Mit 20 % Chance steht dein Name dabei. 📦 Paket: Lebkuchen mit 1.000, 2.500 oder 5.000 deines sauberen Gelds (nur zwischen Banden ab 7 Tagen) oder eine Stinkbombe (einer ihrer Läden verliert die Einnahmen einer Stunde). Die Bande sieht nicht, was drin ist und von wem es kommt. Gibt sie es bei der Polizei ab, sind die Lebkuchen weg, und bei einer Stinkbombe fliegt der Absender auf (+15 Hitze).','pol'],
  ['🐀 Die Ratte','Jeden Montag ab 8 Uhr wird heimlich eine aktive Bande ab Stufe 3 zur Ratte, nie zweimal hintereinander und nur, wenn mindestens 3 Banden mitspielen. Nur sie selbst erfährt es. Sie hat 3 Sabotagen: 🚪 Türsteher bestechen (2 Std. einer weniger), 🎯 Coup platzen lassen (der nächste Coup einer Bande platzt) und 💩 Stinkbombe. Der Kurier meldet jede Sabotage 2 bis 6 Stunden später, nur mit Viertel und Wochentag. Sonntag von 18 bis 20 Uhr stimmen alle Banden ab, die mindestens 7 Tage dabei sind und an 3 Tagen gespielt haben (Leiste im Kurier). Hat die Ratte allein die meisten Stimmen, ist sie erwischt. Wer richtig getippt hat, bekommt 10.000 sauber. Kommt sie durch, bekommt sie 25.000 sauber und eine Woche 🐀 am Namen.','stadt'],
  ['🪙 BratCoin','BratCoin kaufst du mit Bargeld und verkaufst ihn gegen sauberes Geld (12 % Gebühr beim Kauf, 2 % beim Verkauf). Der Kurs ist für alle gleich und wird von den Spielern gemacht: Jede 10.000 Kauf treibt ihn um 1 % hoch, Verkäufe drücken ihn, höchstens 5 % pro Geschäft. Du zahlst immer den Kurs vor deinem eigenen Geschäft. Nachrichten im Kurier bewegen ihn um 8 bis 20 %, eine große Razzia drückt ihn um 3 %, ruhige Stunden ohne Überfälle heben ihn ein wenig. Alles zusammen wirkt höchstens ±20 % und klingt alle 6 Stunden zur Hälfte ab, dazu schwankt er leicht von selbst. Vorsicht: Hacker klauen 12 % deiner Coins, Razzien 20 bis 40 %. Geschäfte ab 20.000 meldet der Kurier mit Namen.','geld'],
  ['🥃 Ware & Lager','Brennerei (🥃 Fusel, etwas Hitze) und Schrottplatz (🔩 Teile) baust du ab Stufe 2 (Eckbande). Sie füllen sich wie eine Kasse: 4 pro Stunde, mit jeder Stufe mehr, nach 3 Stunden voll. Abholen geht mit „Kassieren“ auf der Karte. Die Ware liegt dann im Lager (Crew-Tab → 📦 Lager). Dort verkaufst du sie jederzeit an den Hehler (600 pro Fusel, 500 pro Teil) oder baust Ausrüstung daraus. Ein gelungener Überfall auf dich raubt 20 % vom Lager, die Polizei lässt es in Ruhe.','geld'],
  ['🧰 Ausrüstung','Ab Stufe 3 (Kiezbande) baust du im Lager Ausrüstung aus Ware. 🗝️ Dietrich (3 Teile): Beim nächsten Überfall auf einen Laden mit Sicherung zählen Stahltür, Kamera und Tresor nicht. 🦺 Schutzweste (2 Teile, 1 Fusel): Der nächste Überfall auf dich trifft auf 20 % mehr Verteidigung. 🚀 Nitro (2 Teile, 3 Fusel): Schaltest du es im Angriffsfenster an, macht dieser Überfall oder diese Übernahme keine Hitze, und dein Trupp ist sofort zurück. Ohne Schalter bleibt es im Lager. Dietrich und Schutzweste wirken von selbst. Von jeder Sorte hast du höchstens 3. Wie viele du hast, steht im Lager und im Angriffsfenster; nach jedem Angriff siehst du, was verbraucht wurde und was übrig ist. Bei Übernahme und Hack hilft der Dietrich nicht. Bricht ein Angriff ab, bekommst du die Ausrüstung zurück. Etwa jeder 5. gelungene Coup bringt welche mit.','kampf'],
  ['📦 Bestellungen','Zweimal am Tag sucht jemand in Nürnberg 10 bis 20 Fusel oder Teile, zum Beispiel der Wirt vom Weißgerbergraben. Die Bestellung steht im Kurier, auf der Karte als 📦 und im Lager und gilt 6 Stunden. Wer zuerst liefert, bekommt den doppelten Hehlerpreis als Bargeld und ⭐ 20. Eine Mitteilung gibt es über den Schalter „Coups, Großcoups & Transporter“.','akt'],
  ['💸 Geldfluss','Oben im Geld-Tab steht Schritt für Schritt, was pro Stunde passiert: wie viel Bargeld reinkommt, wie viel davon gewaschen wird (die Quote zeigt den Anteil), was die Löhne kosten und was unterm Strich als Bargeld und sauberes Geld bleibt. Darunter steht ein Tipp, was sich gerade lohnt. Ein Tipp auf die Karte zeigt jeden Laden einzeln.','geld'],
  ['⬆️ Ausbauen','Im Pop-up deines Ladens hebst du ihn auf Stufe 2 und 3: mehr Einnahmen, größere Kasse.','geld'],
  ['🔁 Umbauen & 🧨 Abreißen','Im Pop-up deines Ladens. Beim Abriss bekommst du 40 % von Bau und Upgrades zurück, der Platz wird frei. Beim Umbau wird diese Gutschrift mit dem neuen Laden verrechnet, er startet auf Stufe 1. Die Kasse wird vorher automatisch kassiert. Deinen letzten Laden kannst du nur umbauen.','geld'],
  ['🎩 Boss','Jede Bande hat einen Boss. Tipp auf deinen Namen oben und dann auf „🎩 Bearbeiten“: Dort wählst du Gesicht und Hautton für das Abzeichen deiner Bande und einen Spruch mit höchstens 40 Zeichen, das geht jederzeit gratis. Die Boss-Art bringt einen Bonus: 💼 Geschäftsmann wäscht 10 % mehr und baut Immobilien 10 % günstiger, 🥊 Schläger greift 10 % stärker an und seine Wachen verteidigen 20 % besser, 🦊 Schlitzohr hackt 15 % mehr und baut 1 Hitze pro Stunde schneller ab, 🎲 Zocker holt bei Coups 15 % mehr und findet 1,5-mal so oft etwas, 👑 Pate kassiert 25 % mehr Schutzgeld. Die erste Wahl ist gratis, ein Wechsel kostet 25.000 sauberes Geld und geht höchstens einmal am Tag.','stadt'],
  ['🏴 Banden','Tipp auf deinen Namen oben oder auf eine Bande in der Rangliste. Du siehst Rang, Läden, kontrollierte Viertel und die Bilanz aus Angriffen und Razzien. Geld, Crew und Hitze anderer Banden bleiben geheim. Deine eigene Bande kannst du dort einmal pro Saison umbenennen, die Farbe bleibt. In der Rangliste hängen die drei stärksten Banden als WANTED-Plakat, das Kopfgeld sind ihre Rang-Punkte.','stadt'],
  ['🗺️ Karte lesen','Gelber Rand: gewähltes Viertel. Gestrichelter Rand in deiner Farbe: Viertel mit eigenem Laden, aber ohne Kontrolle. Farbige Fläche und ♛: Diese Bande kontrolliert das Viertel. Punkte: die Plätze, farbig gehört einer Bande, dunkel ist frei. 💰: deine Kasse dort ist mindestens halb voll. Rot blinkend: Du wirst gerade angegriffen. Boss-Gesichter: Dort war die Bande zuletzt, grüner Punkt heißt online. Schraffiert mit 🔑: Diesen Nürnberger Stadtteil kann eine Bande ab Stufe 3 erschließen. Schraffiert ohne 🔑: Fürth und Erlangen, die kommen mit einem späteren Update. 🏠: dein Heimatviertel. In der Viertel-Leiste: Deine Läden haben einen Rand in deiner Farbe und das Schild „DEINS“, darunter steht 💰 deine Kasse, ist sie mindestens halb voll, leuchtet der Rand. Bei fremden Läden steht der Bandenname und 🎯 die Beute, die gerade in der Kasse liegt. 🛡️ zeigt deine Wachen, 🚪📹🔐 oben auf einer Laden-Kachel die Sicherung.','start'],
  ['🤝 Bündnis','Ab Stufe 3 (Kiezbande) kannst du in der Übersicht einer anderen Bande ein Bündnis anbieten. Nimmt sie an, seid ihr Spezln: kein Überfall, keine Übernahme, kein Hack, kein Tipp und kein Kopfgeld gegeneinander, und in der Rangliste steht 🤝. Jede Bande hat höchstens ein Bündnis. In Ruhe auflösen dauert 24 Stunden. Verraten geht sofort, dann trägst du 7 Tage die 🐍 Schlange, der Kurier berichtet, und dein Ex-Spezl bekommt +25 % Rache-Bonus gegen dich.','stadt'],
  ['🥊 Hilfe im Duell','Wird dein Spezl von einem Mitspieler überfallen, bekommst du eine Mitteilung und unten auf der Karte zeigt der Live-Ticker den Überfall mit dem Knopf „Helfen“. In den 5 Minuten schickst du alle Schläger, die daheim sind, dazu, jeder bringt +2,5 Verteidigung. Nach dem Überfall kommen sie zurück.','kampf'],
  ['📦 Angebote','In der Übersicht einer Bande tippst du auf „Angebot machen“: Du gibst Fusel, Teile oder Bargeld und willst dafür etwas anderes. Was du gibst, ist sofort reserviert. Die andere Bande hat 24 Stunden, danach oder bei Absage kommt alles zurück. Bargeld darf höchstens das Doppelte des Hehlerwerts der Ware sein. Im Bündnis kannst du außerdem Geld schicken: ab 1 Tag Bündnis, 20 % Gebühr, höchstens 20.000 am Tag. Angebote und Geld schicken gehen nur, wenn beide Banden mindestens 7 Tage dabei sind.','geld'],
  ['⚽ Club-Spieltag','Spielt der 1. FC Nürnberg (2. Liga oder DFB-Pokal), bringen die Wettbüros in Nürnberg von 2 Stunden vor bis 2 Stunden nach Anpfiff +50 % Bargeld. Am Spieltag zeigt ein Chip auf der Karte Gegner und Anstoß, zu Beginn bekommen alle eine Mitteilung (Schalter „Coups, Großcoups & Transporter“). Volle Wettbüros lohnen sich auch für Überfälle. Nach dem Spiel: Sieg BratCoin +5 % und Schlagzeile im Kurier, Niederlage −3 %, unentschieden bleibt der Kurs.','stadt'],
  ['🌧️ Wetter','Oben rechts steht das echte Wetter in Nürnberg, es kommt jede Stunde neu. ☀️ Sonne (nur tagsüber): Coups bringen +20 % Beute. 🌧️ Regen, ⛈️ Gewitter und ❄️ Schnee: Clubs bringen +20 % Bargeld, Shisha-Bars waschen +20 %. 🌫️ Nebel: Überfälle machen nur halbe Hitze. Bewölkt oder nachts klar: keine Wirkung. Ein Tipp aufs Wetter erklärt die Wirkung gerade jetzt.','stadt'],
  ['🗺️ Karte und Viertel','Oben stehen in einer Zeile 💵 Bargeld, 🧼 Sauber, 🪙 BratCoin und 🚨 Hitze, darunter die Karte bis an den Rand. Unten steht das gewählte Viertel. Tipp darauf oder auf ein Viertel der Karte, dann klappen seine Plätze hoch. Der gelbe Knopf „▼ Zuklappen“ oben rechts klappt sie wieder ein.','start'],
  ['📣 Wos is los?','Oben auf der Karte steht immer nur eine Zeile: links wer online ist, daneben der wichtigste Hinweis, zum Beispiel ein Großcoup, Geldtransporter oder Schmuggel. Gibt es mehr, zeigt ein rosa „+2“ die Zahl. Ein Tipp darauf öffnet „Wos is los?“ mit allen Hinweisen: oben, wo du jetzt zuschlagen kannst, darunter, was heute in der Stadt los ist (Club, Feste, Events). Gezoomt wird mit zwei Fingern, ⌖ oben rechts holt die Innenstadt zurück.','start'],
  ['🟢 Live-Stadt','Oben links auf der Karte steht mit 🟢, wie viele Banden gerade online sind, mit ihren Bossen. Ein Tipp zeigt alle Banden der letzten 7 Tage: online oder seit wann offline und in welchem Viertel sie zuletzt waren. Auf der Karte sitzt jeder Boss in seinem zuletzt besuchten Viertel, grüner Punkt heißt online. Geraten zwei Banden aneinander, blitzt es kurz: 💥 BAM! beim Überfall, 🚚 beim Geldtransporter, 🚔 bei der Razzia, 🛷 beim abgefangenen Schmuggel. Läuft ein Überfall zwischen anderen Banden, steht er im Live-Ticker unten auf der Karte; ist dein Spezl das Opfer, hilfst du dort mit „Helfen“.','stadt'],
  ['💰 Großcoups','Ab Stufe 3 (Kiezbande) im Coups-Fenster unter 💰 Großcoups: Du planst einen Großcoup (⚡ 3, zwischen 8 und 21 Uhr), alle anderen Banden ab Kiezbande bekommen Bescheid und haben 2 Stunden zum Einsteigen (⚡ 3), höchstens 3 Banden. Danach spielt jede ihr eigenes schweres Minispiel mit Alarm-Lichtern. Wer es schafft, bekommt seinen Anteil: 20.000 zu zweit, 25.000 zu dritt, mit deiner Stufe mehr, dazu ⭐ 40 und 8 Hitze. Steigt keiner ein, gibt es die Energie zurück. Einmal am Tag pro Bande.','akt'],
];
const FAQ=[
  ['Wie verteidige ich gegen die Fürther?','Samstag zwischen 20 und 20:30 Uhr ein angegriffenes Viertel antippen (rot auf der Karte oder ⚔️ im Banner) und 🛡️ Verteidigen. Jeder Treffer im Minispiel verjagt einen Fürther, jede Woche gibt es ein anderes Minispiel. Du brauchst keine Schläger und verlierst nichts. Nach jeder Runde 1 Min. Pause, dann gleich wieder. Wer mindestens einmal verteidigt hat, bekommt bei einem Sieg 50 Ruf.','stadt'],
  ['Kann ich als neue Bande schon Läden übernehmen?','Ja, Läden von KI-Banden kannst du schon ab Stufe 1 übernehmen. Läden von Mitspielern erst ab Stufe 3 (Kiezbande).','start'],
  ['Wie funktionieren die Minispiele?','Es gibt vier Arten: Zeiger-Balken (Überfall, Verteidigen), Tresor-Drehrad (Übernahme), Pakete (Hack) und Alarm-Lichter (Coups, Großcoups, Geldtransporter, Schmuggel). Überall zählen bis zu 3 Treffer, Perfekt bringt etwas mehr. Bei Angriffen auf KI-Banden und leichten Coups kannst du „schnell erledigen“ wählen, das zählt wie 2 Treffer. Gegen Mitspieler wird immer gespielt.','kampf'],
  ['Wer entscheidet, ob mein Angriff klappt?','Seit Beta 5.1.1 der Server. Dein Handy schickt nur deine Treffer im Minispiel, die Chance am Knopf ist dieselbe wie vorher.','kampf'],
  ['Warum greift mich eine KI-Bande abends an?','Das ist ihre Rache: Du hast sie zu oft überfallen, gehackt oder ihnen Läden abgenommen. Der Kurier warnt dich vorher, dann hast du Zeit, Türsteher hinzuschicken. Wehrst du sie ab, gibt es Ruf. Lässt du sie eine Weile in Ruhe, beruhigen sie sich.','kampf'],
  ['Wie erschließe ich einen Stadtteil?','Ab Stufe 3 tippst du auf einen schraffierten Stadtteil mit 🔑. Das kostet 10 % deines sauberen Geldes, mindestens 5.000, und geht einmal pro Woche (ab Sonntag 20 Uhr wieder). Danach hat der Stadtteil 4 Plätze für alle, den ersten bekommst du mit einem Späti geschenkt. In der ersten halben Stunde darf jede Bande dort nur einen Laden haben.','stadt'],
  ['Warum kostet mein neuer Laden mehr als angegeben?','Ab deinem 15. Laden gibt es den Bauzuschlag: jeder neue Laden 4 % mehr pro Laden, höchstens das Doppelte. Der Preis im Bau-Fenster ist schon der richtige.','stadt'],
  ['Was bringt mein Heimatviertel?','Checkst du im Crew-Tab daheim ein, verteidigen deine Läden in diesem Viertel 24 Std. lang mit +2, so viel wie fast ein Türsteher. In den letzten 6 Std. kannst du verlängern, dann gilt der Bonus wieder 24 Std. ab dem Verlängern. Wer nicht in Nürnberg wohnt, wählt eine Wahlheimat und bekommt dort dauerhaft +1. Liegt dein Viertel noch brach, gilt der Bonus, sobald es jemand erschließt.','kampf'],
  ['Wird mein Standort gespeichert?','Nein. Das Spiel fragt ihn nur, wenn du auf „Daheim einchecken“ tippst, und merkt sich nur das Viertel. Andere sehen nur, in welchem Viertel du daheim bist.','start'],
  ['Was ist ein Lokalderby?','Sind zwei Banden im selben Viertel daheim, steht das im Kurier und keiner hat dort gegen den anderen Heimvorteil. Wer im Viertel mehr Läden hat, ist 🦌 Platzhirsch.','kampf'],
  ['Warum hängt immer dieselbe Bande vorn auf dem WANTED-Plakat?','Ganz vorn hängt die stärkste echte Bande. Hast du höchstens halb so viele Rang-Punkte, bringt ein gelungener Überfall auf sie +50 % Prämie (bis 10.000) und doppelten Ruf. Wer selbst groß ist, bekommt keine Prämie.','kampf'],
  ['Wie erobere ich ein Wahrzeichen?','Ab Stufe 3 öffnest du 🎯 Coups, tippst unter „🚩 Wahrzeichen“ z. B. auf die Kaiserburg und dann auf „Stürmen“. In der Viertel-Leiste steht das Wahrzeichen auch als Knopf, z. B. „🚇 Plärrer“ in Gostenhof. Deine Chance ist deine Angriffskraft geteilt durch (Angriffskraft + 10), mit 9 Schlägern also 50 %. Verlierst du, fällt jeder 4. Schläger 1 Std. aus. Du kannst nur ein Wahrzeichen halten.','stadt'],
  ['Was bringen die Wahrzeichen?','Kaiserburg: doppelter Ruf. Plärrer: +1 Angriffskraft in Vierteln an der U-Bahn (welche, steht im Plärrer-Fenster; wenn der Bonus gilt, zeigt die Viertel-Leiste „🚇 +1 Angriff“). Wechselnd: Stadion und Volksfestplatz +20 % für Wettbüros bzw. Clubs, Schöner Brunnen täglich 1.000 bis 5.000 Bargeld, Bratwurstglöcklein Energie 20 % schneller, Tiergarten Hitze sinkt 20 % schneller, Nürnberger Ei Hacks +20 %, Felsengänge 1 Fusel pro Stunde, Hauptbahnhof Trupp 30 % schneller zurück, Containerhafen Hehlerlager +15 %, Flughafen nur 5 % Wäsche-Gebühr. Sonntag um 20 Uhr gibt es 10.000 sauber pro Wahrzeichen.','stadt'],
  ['Warum ist die Karte nachts dunkel?','Die Karte folgt der echten Uhrzeit in Nürnberg: Nach Sonnenuntergang wird sie dunkel und die Läden leuchten. Auf das Spiel hat das keine Wirkung.','stadt'],
  ['Wie werde ich Boss der Woche?','Sammle von Sonntag 20 Uhr bis Sonntag 20 Uhr möglichst viel Ruf und Beute. Punkte = Ruf der Woche + Beute/100. Den Zwischenstand siehst du im Reiter 🏆 Woche der Rangliste, der Sieger bekommt 20.000 sauber und den 🏆.','stadt'],
  ['Was heißt 📵 in der Rangliste?','Diese Bande hat keine Mitteilungen an. Sie merkt also erst beim nächsten Öffnen, wenn du sie überfällst. Wer Mitteilungen einschaltet, bekommt einmal 5.000 Bargeld.','stadt'],
  ['Warum hat das Spiel gerade neu geladen?','Wenn es eine neue Version gibt und du in die App zurückkommst, lädt sie einmal von selbst. Dein Spielstand liegt in der Datenbank, es geht nichts verloren.','start'],
  ['Warum wird mein Bargeld weniger?','Drei Gründe: Deine Fassaden waschen Bargeld zu sauberem Geld, deine Crew bekommt Lohn, und bei einer Razzia beschlagnahmt die Polizei 40 %. Oben im Geld-Tab zeigt der Geldfluss, was pro Stunde rein- und rausgeht.','geld'],
  ['Wie funktioniert Hitze?','Jedes Wettbüro, jedes Hehlerlager und jeder Club macht pro Stunde Hitze, höhere Stufen mehr, am Flughafen und in Erlenstegen noch mehr. Angriffe machen zusätzlich Hitze. Pro Stunde sinkt sie von selbst um 5 und mit jedem Anwalt um 4 mehr. Deine Läden heizen höchstens bis 80, darüber bringen dich nur Angriffe. Ab 60 kommen Kontrollen (die Hälfte einer Kasse weg), ab 80 Razzien im heißesten Viertel (dort alle Kassen und 20 % Bargeld weg), bei 100 sofort die große Razzia (40 % Bargeld, alle Kassen, ein Crew-Mitglied in U-Haft) und 2 Stunden Knast für den Boss. Tipp auf 🚨 oben zeigt alles im Detail. Ist die Mitteilung „Hitze-Vorwarnung“ an, bekommst du etwa 2 Stunden vorher Bescheid.','pol'],
  ['Warum zeigt der Geldfluss weniger, als meine Läden bringen?','Volle Kassen verdienen nichts mehr, bis du kassierst. Sie zählen deshalb nicht mit und stehen in den Details als „voll“.','geld'],
  ['Warum wäscht mein Späti am Anfang nichts?','Gewaschen wird nur Bargeld, das du verdienst: aus Kassen, Schutzgeld und Beute. Dein Startgeld bleibt dir so zum Bauen. Bau ein Wettbüro, Hehlerlager oder einen Club, dann hat dein Späti zu tun. Das gilt für alle Banden, die ab Beta 3.3.1 gegründet wurden.','geld'],
  ['Wie viel Bargeld wasche ich gerade?','Das steht im Geldfluss bei „Wäsche“, dazu die Quote: welcher Anteil deines Bargelds sauber wird. Liegt genug Bargeld über deiner Reserve, waschen alle Fassaden mit voller Leistung. Liegt es an der Reserve, wird nur gewaschen, was nach den Löhnen reinkommt. Kommt nichts rein, pausiert die Wäsche. Kommt mehr Bargeld rein, als du waschen kannst, lohnt sich eine weitere Fassade.','geld'],
  ['Lohnt sich Abreißen oder Umbauen?','Du bekommst 40 % von Bau und Upgrades zurück. Umbauen lohnt sich, wenn ein anderer Laden in dem Viertel einen Bonus hat oder du weniger Hitze willst. Achtung: Ein Abriss kann dich die Kontrolle über das Viertel kosten, das Pop-up warnt dich vorher.','geld'],
  ['Wie benenne ich meine Bande um?','Tipp oben auf deinen Namen, dann auf den Stift. Das geht einmal pro Saison und kostet nichts. Der Name muss neu in der Stadt sein, höchstens 18 Zeichen. Die Farbe bleibt.','stadt'],
  ['Was ist der Unterschied zwischen Bargeld und sauberem Geld?','Bargeld kommt aus Wettbüros, Hehlerlagern und Clubs. Damit baust du die meisten Läden und bezahlst die Crew. Sauberes Geld entsteht durch Geldwäsche, Mieten und BratCoin-Verkäufe. Es ist für Immobilien, Bestechung und manche Upgrades nötig und zählt voll für die Rangliste.','geld'],
  ['Warum kann ich gerade nicht angreifen?','Der Grund steht am Knopf: Alle Autos sind unterwegs, auf diese Bande läuft schon ein Trupp von dir, dir fehlt 🥃 Fusel für die Fahrer, deine Hacker machen Pause, oder es sind zu wenig Schläger daheim (Überfall braucht 1, Übernahme 3, Hack 1 Hacker). Verletzte sind nach 1 Std. wieder fit.','kampf'],
  ['Wie schütze ich meine Läden?','Mit Türstehern und Sicherung. Türsteher stellst du im Crew-Tab unter 🚪 Türsteher oder über 🚪 in der Viertel-Leiste in ein Viertel, jeder macht dort alle deine Läden um 2,5 stärker, höchstens 3 pro Viertel. Im Pop-up eines Ladens baust du nacheinander Stahltür (2.000), Kamera (3.000) und Tresor (6.000) ein, bezahlt mit sauberem Geld. Bei einer Übernahme oder einem Abriss ist die Sicherung weg.','kampf'],
  ['Was ist ein anonymer Tipp, und was kann ich dagegen tun?','Andere Banden können dich im Darknet für BratCoin im Wert von 2.500 bei der Polizei verpfeifen, jede höchstens einmal am Tag: deine Hitze steigt um 15, höchstens bis 99. Du bekommst sofort eine Mitteilung. Dagegen helfen Anwälte, Bestechung und ein Auge auf deine Hitze. Wer verpfeift, fliegt mit 20 % Chance selbst auf.','pol'],
  ['Warum kostet Bestechen mal 3.000 und mal mehr?','Der erste Umschlag am Tag kostet 3.000, jeder weitere 1.000 mehr, höchstens 9.000. Um Mitternacht fängt es wieder bei 3.000 an. Dauerhaft weniger Hitze bringen Anwälte.','pol'],
  ['Kann ich alles verlieren?','Nein. Dein letztes Geschäft kann dir niemand per Übernahme abnehmen, und du kannst es auch nicht abreißen, nur umbauen. Geld und Läden kannst du aber durch Überfälle, Übernahmen und Razzien verlieren.','start'],
  ['Ich sitze im Knast. Was jetzt?','Tipp oben auf der Karte auf 🚔 KNAST. Du kannst einmal ausbrechen (Minispiel, klappt es, bist du sofort frei, sonst 30 Minuten länger) oder Kaution zahlen: 10 % deines Geldes, mindestens 1.000. Hast du einen Spezl, bekommt er eine Mitteilung und kann für dich zahlen. Oder du sitzt die 2 Stunden ab und wirtschaftest so lange weiter. Mehr als einen Laden kann dir in der Zeit niemand abnehmen.','pol'],
  ['Kann ich nur durch Läden in den Knast kommen?','Nein. Läden heizen höchstens bis 80. In den Knast bringen dich nur Angriffe und anonyme Tipps, die dich über 80 treiben. Wer nur baut, bekommt Kontrollen und Viertel-Razzien, aber nie die große Razzia.','pol'],
  ['Wie knacke ich den Safe?','Tipp unten links neben den Coups auf 🔢. Gib 4 Ziffern ein, einmal am Tag. Was gepasst hat, steht danach im Kurier, auch für alle anderen. Hinweise bekommst du mit Glück bei Coups und Überfällen und im Knast vom Zellennachbarn. Jeden Sonntag um 20 Uhr gibt es einen neuen Code. Ist der Knopf grau mit 🔒, hat ihn schon jemand geknackt. Dann heißt es warten bis Sonntag, das Geld daneben liegt dann im neuen Safe.','akt'],
  ['Was passiert, während ich offline bin?','Die Stadt läuft weiter: Kassen füllen sich, Geld wird gewaschen, Löhne laufen, und andere Banden können dich angreifen. Von der Polizei gibt es während deiner Abwesenheit höchstens ein Ereignis und nie die große Razzia. Beim nächsten Öffnen siehst du, was passiert ist.','start'],
  ['Wer sind die KI-Banden?','Schäufele-Syndikat (🥊 Schläger-Boss Schäufele-Schorsch), Lebkuchen-Clan (💼 Geschäftsfrau Oma Lebkuchen) und Die Drei im Weggla (🎲 Zocker, die Weggla-Brüder). Sie bauen, wachsen und greifen ab und zu an. Wer sie oft angreift, muss abends mit ihrer Rache rechnen. Sie spielen immer dann eine Runde, wenn jemand online ist.','stadt'],
  ['Wie funktioniert BratCoin, und wann mache ich Gewinn?','Du kaufst mit Bargeld und verkaufst gegen sauberes Geld. Beim Kauf gehen 12 % als Mixer-Gebühr weg, deshalb brauchst du etwa 14 % Kursplus für Gewinn. Den Kurs machen die Spieler: Käufe treiben ihn hoch, Verkäufe drücken ihn, dazu kommen Nachrichten im Kurier. Unter Geld siehst du deinen Einstand und deinen Gewinn oder Verlust. Geklaute Coins zählen dort mit dem Kurs vom Hack.','geld'],
  ['Kann ich den BratCoin-Kurs selbst hochtreiben?','Ein bisschen, aber es lohnt sich nicht: Du zahlst den Kurs vor deinem Kauf, und die Gebühren von etwa 14 % sind größer als alles, was du selbst bewegen kannst. Wer viel kauft, hilft vor allem denen, die schon Coins haben.','geld'],
  ['Warum ist der BratCoin-Kurs gefallen?','Jemand hat verkauft, eine Nachricht im Kurier hat ihn gedrückt, oder es gab eine große Razzia oder Übernahme. Bewegt sich der Kurs um 5 % oder mehr, meldet der Börsenticker im Kurier die Gründe. Was übrig bleibt, ist die Marktlaune, das Auf und Ab, das niemand macht. Jede Bewegung klingt alle 6 Stunden zur Hälfte ab.','geld'],
  ['Jemand kennt meinen Bandencode. Was tun?','Menü ☰ › Bandencode › „Neuen Code erzeugen“. Der alte Code gilt dann nicht mehr, und alle anderen Geräte sind von deiner Bande abgemeldet.','start'],
  ['Wofür brauche ich Fusel und Teile?','Ein neuer Fahrer braucht 3 🔩 Teile für sein Auto, jede Fahrt eines Fahrer-Autos kostet 1 🥃 Fusel. Außerdem kannst du sie an den Hehler verkaufen, für eine Bestellung liefern (doppelter Preis), mit anderen Banden tauschen oder ab Kiezbande daraus Ausrüstung bauen. Am meisten bringt eine Bestellung, aber nur die schnellste Bande bekommt sie.','geld'],
  ['Wie schütze ich mein Lager?','Ein gelungener Überfall auf einen deiner Läden raubt 20 % vom Lager. Verkauf oder verbau Ware, die du nicht brauchst, und halte deine Läden mit Wachen und einer 🦺 Schutzweste stark. Die Polizei lässt das Lager in Ruhe.','kampf'],
  ['Warum kann ich nicht mehr Schläger mitnehmen?','Steht der Zähler auf Maximum, steht direkt darunter der Grund: kein 🥃 Fusel für die Fahrer-Autos, Schläger verletzt oder unterwegs, Autos unterwegs, zu wenig Fahrer oder alle 3 Autos voll (höchstens 9).','kampf'],
  ['Wann wird meine Ausrüstung benutzt?','Der Dietrich von selbst beim nächsten Überfall auf einen Laden mit Sicherung, die Schutzweste von selbst beim nächsten Überfall auf dich. Nitro nur, wenn du es im Angriffsfenster mit dem Schalter anmachst (nicht beim Hack), sonst bleibt es im Lager. Der Dietrich hilft nicht bei Übernahme und Hack. Im Angriffsfenster steht, was gleich benutzt wird und wie viele du noch hast, im Ergebnis, was verbraucht wurde. Eine verbrauchte Schutzweste meldet sich, sobald du wieder im Spiel bist.','kampf'],
  ['Kann ich auf mehreren Geräten gleichzeitig spielen?','Nein. Seit Beta 5.1.2 gehört jede Bande genau einem Gerät. Holst du sie mit deinem Bandencode (Menü ☰) auf ein anderes Gerät, wird das alte abgemeldet und bekommt einen Hinweis. Mit dem Code holst du sie jederzeit zurück.','geld'],
  ['Ich habe ein neues Handy. Wie behalte ich meine Bande?','Im Menü ☰ unter Bandencode steht dein geheimer Code (BRAT-…). Auf dem neuen Gerät das Spiel öffnen, bei „Du hast schon eine Bande?“ den Code eingeben, fertig. Das gilt auch, wenn du vom Safari-Tab in die Home-Bildschirm-App wechselst. Gib den Code nicht weiter: Wer ihn hat, spielt deine Bande.','start'],
  ['Warum bekomme ich keine Mitteilungen?','Auf dem iPhone gehen Mitteilungen nur, wenn du das Spiel über das Icon auf dem Home-Bildschirm öffnest und sie im Menü unter Mitteilungen einschaltest. Prüf auch, ob sie in den iPhone-Einstellungen für Imperium erlaubt sind. Unter Mitteilungen schaltest du Angriffe, volle Kassen, Hitze-Vorwarnung und neue Banden einzeln. Alles außer Angriffen kommt nicht zwischen 23 und 8 Uhr. Solange du das Spiel offen hast, kommen gar keine Mitteilungen, du siehst dann alles direkt im Spiel.','start'],
  ['Kann ich schon in Fürth oder Erlangen spielen?','Noch nicht. Beide Städte sind schon auf der Karte, ihre Stadtteile werden mit einem späteren Update freigeschaltet. Bis dahin wird nur in Nürnberg gespielt.','start'],
  ['Wo finde ich die Tagesziele?','Tipp auf der Karte auf 🎯 Coups. Die Tagesziele stehen ganz oben im Fenster. Am Knopf siehst du schon vorher, wie viele du heute geschafft hast.','akt'],
  ['Was bringt mir der Ruf?','Ruf hebt deine Bande Stufe für Stufe vom Straßenhaufen bis zum Imperium. Jede Stufe schaltet neue Läden, Crew oder Aktionen frei und zeigt allen, wie weit du bist (alle Stufen stehen in der Anleitung unter ⭐ Stufen). Außerdem werden Coups und Tagesziele mit jeder Stufe lohnender. Deinen Fortschritt siehst du im Coup-Fenster und in deiner Bandenübersicht.','start'],
  ['Warum kann ich einen Club oder Hacker nicht kaufen?','Das wird mit dem Ruf freigeschaltet. Beim gesperrten Eintrag steht, ab welcher Stufe es geht. Ruf bekommst du am schnellsten mit Coups und Tageszielen.','start'],
  ['Was ist der Neulingsschutz?','Ist eine Bande mindestens 2 Ruf-Stufen unter dir, bringen Überfall und Hack bei ihr nur 40 % der Beute, eine Übernahme und Anonyme Tipps gehen gar nicht. KI-Banden holen bei Banden auf Stufe 1 und 2 nur die Hälfte.','kampf'],
  ['Warum ist meine Energie leer?','Jeder Coup kostet 1 bis 3 Energie. Alle 20 Minuten kommt eine dazu, bis 5 erreicht sind. Wenn du alle drei Tagesziele schaffst, gibt es 2 Energie extra.','akt'],
  ['Warum fahren nur 9 Schläger mit?','Pro Angriff fahren höchstens 3 Autos mit je 3 Schlägern, sonst würde die größte Truppe jeden Laden knacken. Mehr Schläger lohnen sich trotzdem: Mit genug Autos fährst du mehrere Angriffe gleichzeitig auf verschiedene Banden und hast Ersatz, wenn welche verletzt sind.','kampf'],
  ['Was bringen mehr Fahrer?','Jeder Fahrer bringt ein Auto mehr, also mehr Angriffe gleichzeitig, und macht jede Fahrt 2 Minuten kürzer, bis 6 Fahrer (dann 3 Minuten). Mehr als 6 kannst du nicht anheuern.','kampf'],
  ['Warum zählen nur 3 Türsteher pro Viertel?','Sonst würde die Bande mit den meisten Leuten unangreifbar. Ein 4. Türsteher lässt sich deshalb gar nicht erst hinstellen, und anheuern kannst du nur so viele, wie du Türen hast (3 je Viertel mit eigenem Laden). Steht „Alle Türen voll“, bau erst einen Laden in einem neuen Viertel. Freie Türsteher stellst du in andere Viertel oder entlässt sie mit −1. Steht „ohne Tür“ in Rot, hast du ein Viertel verloren: Diese Türsteher kosten nur Lohn, bis du einen Laden in einem neuen Viertel hast oder sie entlässt.','kampf'],
  ['Wie werde ich Leute wieder los?','Im Crew-Tab steht neben jedem Eintrag „−1“. Damit entlässt du einen Mann, sein Lohn fällt sofort weg. Geld fürs Anheuern gibt es nicht zurück. Entlassen kannst du nur Schläger, die daheim sind, und Fahrer, deren Auto in der Garage steht. Türsteher entlässt du nur, wenn sie frei sind. Stehen alle auf Posten, ziehst du erst einen ab (volle Tür antippen), so entscheidest du, welches Viertel Schutz verliert.','kampf'],
  ['Was bedeutet 💤 auf der Karte?','Diese Bande war seit mindestens 3 Tagen nicht online. Ihre Läden verteidigen sich nur noch halb so gut. Nach 7 Tagen holen sich die KI-Banden ihre Läden nach und nach, der letzte bleibt ihr. Sobald die Bande wieder spielt, ist der Spuk vorbei.','start'],
  ['Was passiert, wenn die Stadt voll ist?','KI-Banden bauen höchstens 12 Läden und nur, solange mindestens 6 Plätze frei sind. Eine neue Bande bekommt immer einen Start-Späti, notfalls kauft sie einer KI-Bande einen Laden ab. Seit Beta 4.7 könnt ihr außerdem neue Stadtteile erschließen, dort bauen KI-Banden nicht.','start'],
  ['Welche Boss-Art passt zu mir?','Baust du viel und wäschst viel, nimm den 💼 Geschäftsmann. Greifst du gern an oder willst dich mit Türstehern schützen, den 🥊 Schläger. Hast du Hacker oder Ärger mit der Polizei, das 🦊 Schlitzohr. Spielst du jeden Tag deine Coups, den 🎲 Zocker. Kontrollierst du mehrere Viertel, den 👑 Paten.','stadt'],
  ['Was kostet es, die Boss-Art zu wechseln?','Die erste Wahl ist gratis. Danach kostet jeder Wechsel 25.000 sauberes Geld und geht höchstens einmal am Tag. Aussehen, Spitzname und Spruch kannst du jederzeit gratis ändern.','stadt'],
  ['Warum wird mein Spruch oder Bandenname abgelehnt?','Ein Filter blockiert Schimpfwörter und Beleidigungen, auch mit vertauschten Buchstaben oder Zahlen. Formulier es einfach anders.','stadt'],
  ['Wie erkenne ich in einem Viertel meine Läden?','Deine Kacheln haben einen Rand in deiner Farbe und oben das Schild „DEINS“. 💰 und ein leuchtender Rand heißen: Kasse mindestens halb voll, abholen. Fremde Läden zeigen den Bandennamen und 🎯 die Beute, die du dort holen könntest.','start'],
  ['Warum ist mein Überfall nicht sofort fertig?','Seit Beta 4.3 ist ein Überfall auf Mitspieler ein Duell: 5 Minuten, in denen sich das Opfer wehren kann. Deine Crew ist so lange unterwegs. Das Ergebnis bekommst du als Mitteilung und im Kurier, du musst nicht im Spiel bleiben.','kampf'],
  ['Ich werde überfallen. Was kann ich tun?','Tipp auf die rote Leiste oben oder auf die Mitteilung. Du hast zwei Möglichkeiten: Verteidigen (Minispiel, bis zu 50 % mehr Verteidigung) und Türsteher schicken (freie Türsteher stehen sofort im Viertel, bis 3). Beides geht zusammen, solange die Zeit läuft.','kampf'],
  ['Kann ich nach einem Überfall einen Spruch hinterlassen?','Ja. Klappt dein Überfall, wählst du im Ergebnis-Fenster einen Spruch für das Opfer. Wehrst du einen Überfall eines Mitspielers ab, bekommst du ein Fenster „ABGEWEHRT!“ und kannst dem Angreifer einen Spruch zurückschicken. Dein Boss-Spruch steht jedes Mal mit zur Auswahl. Der Spruch erscheint im Kurier und als Mitteilung.','kampf'],
  ['Wer kann meine Nachrichten lesen?','Im Kanal „Stadt“ alle Banden. Direktnachrichten nur ihr beide. Alles wird nach 7 Tagen gelöscht.','stadt'],
  ['Kann ich eine Nachricht wieder löschen?','Ja, deine eigenen. Tipp im Stadtfunk auf deine Nachricht, dann erscheint „🗑️ Löschen“. Sie verschwindet dann auch bei allen anderen.','stadt'],
  ['Wann kommt der Geldtransporter?','Einmal tagsüber zu einer zufälligen Zeit, dazu fest um 22 Uhr der 🍺 Feierabend-Coup, jeweils für 30 Minuten. Du bekommst eine Mitteilung, wenn der Schalter „Coups, Großcoups & Transporter“ an ist.','akt'],
  ['Ich habe keine BratCoin. Wie nutze ich das Darknet?','Im Darknet auf „+ Coins kaufen“ tippen, das bringt dich zu Geld › BratCoin. Dort kaufst du Coins mit Bargeld (ab Stufe 3). Was ein Dienst kostet, steht am Knopf und richtet sich nach dem Kurs: Tipp im Wert von 2.500, Gerücht 1.500, Paket 2.000.','pol'],
  ['Ich habe ein Paket bekommen. Aufmachen?','Drin sind Lebkuchen mit sauberem Geld oder eine Stinkbombe, von außen sieht man es nicht. Aufmachen: Lebkuchen bringen das Geld, eine Stinkbombe kostet einen deiner Läden die Einnahmen einer Stunde. Bei der Polizei abgeben: Lebkuchen sind weg, bei einer Stinkbombe kennt die ganze Stadt den Absender. Wartende Pakete stehen oben im Kurier.','pol'],
  ['Wie finde ich die Ratte?','Lies den Kurier: Jede Sabotage steht dort mit Viertel und Wochentag, aber erst 2 bis 6 Stunden später. Wer hat dort Läden, wer war da unterwegs, wer hat einen Grund? Sonntag 18 bis 20 Uhr tippst du im Kurier auf 🗳️ Abstimmen. Liegst du richtig, bekommst du 10.000 sauber, auch wenn die anderen falsch liegen.','stadt'],
  ['Bin ich diese Woche die Ratte?','Das erfährt nur deine Bande: Sobald du das Spiel öffnest, zeigt es dir ein Fenster, und im 💻 Darknet jeder anderen Bande steht der Knopf 🐀 Sabotage. Sonst bist du es nicht.','stadt'],
  ['Wie bekomme ich ein Kopfgeld?','Raub eine Bande mit Kopfgeld erfolgreich aus oder übernimm einen ihrer Läden. Das ganze Kopfgeld landet sofort als sauberes Geld bei dir. Ein Hack zählt nicht.','kampf'],
  ['Kann mich mein Spezl angreifen?','Nein, solange das Bündnis läuft, auch nicht in den 24 Stunden nach dem Auflösen. Nur wer verrät, darf sofort wieder angreifen und trägt dafür 7 Tage die 🐍 Schlange.','stadt'],
  ['Warum kann ich meinem Spezl noch kein Geld schicken?','Geld schicken geht erst, wenn das Bündnis einen Tag alt ist und beide Banden mindestens 7 Tage dabei sind. Dann höchstens 20.000 am Tag, 20 % davon behält der Geldbote. Angebote mit Ware gehen auch ohne Bündnis, aber ebenfalls erst ab 7 Tagen.','geld'],
  ['Warum darf ich nicht so viel Bargeld für meine Ware verlangen?','Damit niemand über Fantasiepreise Geld verschiebt: Bargeld in einem Angebot darf höchstens das Doppelte des Hehlerwerts der Ware sein, also 1.200 pro Fusel und 1.000 pro Teil.','geld'],
  ['Was passiert, wenn beim Großcoup keiner einsteigt?','Dann fällt er aus und du bekommst deine ⚡ 3 zurück, sobald du das Spiel öffnest. Du kannst am selben Tag keinen neuen planen.','akt'],
  ['Wie bekomme ich Lebkuchenherzen?','Nur während des Christkindlesmarkts: mit dem 🎄 Markt-Coup (❤️ 3, geplatzt ❤️ 1), mit einem Schmuggel, der durchkommt (❤️ 10), oder indem du einen fremden Schmuggel abfängst (❤️ 6). Höchstens 25 am Tag. Überfälle klauen keine Herzen.','stadt'],
  ['Warum stehe ich nicht in der Markt-Rangliste?','Dort stehen nur echte Banden mit mindestens einem ❤️. KI-Banden machen beim Fest nicht mit. Dein erster Markt-Coup bringt dich hinein.','stadt'],
  ['Woher kommen Spielplan und Wetter?','Beides ist echt: Der Spielplan des 1. FC Nürnberg kommt von OpenLigaDB, das Wetter von Open-Meteo. Das Spiel holt beides alle 15 Minuten, damit alle Banden denselben Stand haben. Fehlen die Daten mal, wirkt einfach nichts.','stadt'],
  ['Warum bringt mein Wettbüro gerade mehr?','Wahrscheinlich spielt der Club: Von 2 Stunden vor bis 2 Stunden nach Anpfiff bringen alle Wettbüros in Nürnberg +50 %. Der ⚽-Chip auf der Karte zeigt, wie lange noch.','geld'],
  ['Wo sind die Plätze eines Viertels hin?','Seit Beta 4.6.5 ist die Viertel-Leiste unten eingeklappt, damit die Karte größer ist. Tipp auf das Viertel unten oder auf ein Viertel der Karte, dann klappen die Plätze hoch.','stadt'],
  ['Wo sind die Hinweise auf der Karte hin?','Seit Beta 4.6.2 zeigt die Karte oben nur noch den wichtigsten Hinweis. Alle anderen, etwa Event, Club-Spieltag oder Bündnis-Anfragen, findest du hinter dem rosa „+N“ im Fenster „Wos is los?“.','stadt'],
  ['Warum steht bei mir nur eine Bande online?','Gezählt werden echte Banden, die das Spiel gerade offen haben, du eingeschlossen. KI-Banden zählen nicht. Wer die App schließt, ist nach etwa anderthalb Minuten offline.','stadt'],
  ['Wann bekomme ich meinen Fest-Preis?','Am 24.12. kurz nach 14 Uhr rechnet das Spiel ab. Das saubere Geld kommt beim nächsten Öffnen, das Abzeichen steht dann neben deinem Namen.','stadt'],
  ['Wann endet die Saison?','In der Beta gibt es kein festes Ende. Eine neue Saison startet, wenn der Spielleiter die Stadt zurücksetzt. Dann fangen alle wieder bei null an.','start']
];
function seenVersion(){return lsGet(SEEN_KEY)}
function markSeen(){lsSet(SEEN_KEY,CURRENT_VERSION);updateMenuBtn()}
function updateMenuBtn(){const b=document.getElementById('menubtn');if(b)b.classList.toggle('dot',seenVersion()!==CURRENT_VERSION||!!newVersion)}
function ensureMenuBtn(){
  if(document.getElementById('menubtn'))return;
  const brand=document.querySelector&&document.querySelector('.brand'); if(!brand)return;
  const b=document.createElement('button'); b.id='menubtn'; b.className='menubtn'; b.setAttribute('data-act','menu'); b.setAttribute('aria-label','Menü'); b.textContent='☰';
  brand.appendChild(b); updateMenuBtn();
  const hb=document.getElementById('heatBox');
  if(hb&&!document.getElementById('enVal')){const en=document.createElement('button');en.id='enVal';en.className='enpill';en.setAttribute('data-act','coups');en.setAttribute('aria-label','Coups und Energie');en.textContent='⚡ 5';hb.appendChild(en)}
  if(hb){hb.setAttribute('data-act','heat');hb.setAttribute('role','button');hb.setAttribute('aria-label','Hitze-Aufschlüsselung öffnen');hb.classList.add('tap')}
}
function mHead(t){return `<div class="mtop"><button class="back" data-act="menu" aria-label="Zurück zum Menü">‹</button><h3>${t}</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>`}

  const n=seenVersion()!==CURRENT_VERSION;
  showModal(`<div class="mbox" role="dialog" aria-label="Menü"><div class="mtop"><span></span><h3>Menü</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>
    <div class="mlist">
      <button data-act="m-guide"><span>📖</span>Anleitung</button>

      <button data-act="m-news"><span>🆕</span>Was ist neu${n?' <em class="new">neu</em>':''}<small>${CURRENT_VERSION}</small></button>
      <button data-act="m-push"><span>🔔</span>Mitteilungen<small>${pushState()==='on'?'an':'aus'}</small></button>
      <button data-act="m-code"><span>🔑</span>Bandencode</button>
      <button data-act="m-invite"><span>📨</span>Freunde einladen</button>
    </div></div>`);
}

function chTiles(act,list){return `<div class="chtiles">${CHAPTERS.map(c=>{const n=list.filter(x=>x[2]===c.id).length;return `<button class="cht" data-act="${act}" data-k="${c.id}"><span>${c.ico}</span><b>${c.name}</b><small>${act==='fch'?n+' Fragen':c.sub}</small></button>`}).join('')}</div>`}
function chHead(title,back){return `<div class="mtop"><button class="back" data-act="${back}" aria-label="Zurück zur Übersicht">‹</button><h3>${title}</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>`}
function showGuide(ch){
  if(!ch){showModal(`<div class="mbox" role="dialog" aria-label="Anleitung">${mHead('Anleitung')}<p class="small muted">Wähl ein Thema. Häufige Fragen findest du im Menü unter FAQ.</p>${chTiles('gch',GUIDE)}</div>`);return}
  const c=CHAPTERS.find(x=>x.id===ch); const list=GUIDE.filter(x=>x[2]===ch).sort((a,b)=>c.order.indexOf(a[0])-c.order.indexOf(b[0]));
  showModal(`<div class="mbox" role="dialog" aria-label="Anleitung: ${c.name}">${chHead(c.ico+' '+c.name,'m-guide')}<div class="faq">${list.map(([t,x],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${x}</p></details>`).join('')}</div>${chNext('gch',ch)}</div>`);
}
function chNext(act,ch){const i=CHAPTERS.findIndex(x=>x.id===ch), n=CHAPTERS[(i+1)%CHAPTERS.length];return `<button class="btn ghost wide sm" data-act="${act}" data-k="${n.id}">Weiter: ${n.ico} ${n.name} ›</button>`}
function showFaq(ch){
  if(!ch){showModal(`<div class="mbox" role="dialog" aria-label="FAQ">${mHead('FAQ')}<p class="small muted">Wähl ein Thema.</p>${chTiles('fch',FAQ)}</div>`);return}
  const c=CHAPTERS.find(x=>x.id===ch);
  showModal(`<div class="mbox" role="dialog" aria-label="FAQ: ${c.name}">${chHead(c.ico+' '+c.name,'m-faq')}<div class="faq">${FAQ.filter(x=>x[2]===ch).map(([q2,a])=>`<details><summary>${q2}</summary><p>${a}</p></details>`).join('')}</div>${chNext('fch',ch)}</div>`);
}
function diagLine(){
  try{
    const app=document.getElementById('app'), r=app&&app.getBoundingClientRect?app.getBoundingClientRect():{height:0,top:0};
    const st=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
    return `${CURRENT_VERSION} · ${st?'Home-App':'Browser'} · Bildschirm ${window.screen.width}×${window.screen.height} · Fenster ${innerWidth}×${innerHeight} · App ${Math.round(r.height)} ab ${Math.round(r.top)} · SW ${navigator.serviceWorker&&navigator.serviceWorker.controller?'aktiv':'aus'}`;
  }catch(e){return CURRENT_VERSION}
}

/* Ab 13.10.2026: neueste Version offen, darunter „Ältere Versionen“ (zugeklappt), gruppiert nach Hauptversion (5.2, 5.1 …) */
function newsGroups(){
  const g={},ord=[];
  VERSIONS.slice(1).forEach(v=>{const k=v.v.replace('Beta ','').split('.').slice(0,2).join('.');if(!g[k]){g[k]=[];ord.push(k)}g[k].push(v)});
  return ord.map(k=>({k,vs:g[k]}));
}
function newsBody(){

// Deutsche Uhrzeit mit Sommer- und Winterzeit
function berlinParts(ms){
  try{
    const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(ms);
    const g=t=>(f.find(x=>x.type===t)||{}).value;
    return {y:parseInt(g('year'),10),m:parseInt(g('month'),10),d:parseInt(g('day'),10),h:parseInt(g('hour'),10)%24,mi:parseInt(g('minute'),10),wd:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(g('weekday'))};
  }catch(e){const t=ms+2*HOUR, dd=Math.floor(t/DAY), c=ymdOf(dd), r=t-dd*DAY;return {...c,h:Math.floor(r/HOUR),mi:Math.floor(r%HOUR/60000),wd:(dd+3)%7}}
}
// Kalendertage ohne Date-Objekt (Tage seit 1.1.1970)
function daysOf(y,m,d){y-=m<=2?1:0;const era=Math.floor(y/400),yoe=y-era*400,doy=Math.floor((153*(m+(m>2?-3:9))+2)/5)+d-1,doe=yoe*365+Math.floor(yoe/4)-Math.floor(yoe/100)+doy;return era*146097+doe-719468}
function ymdOf(z){z+=719468;const era=Math.floor(z/146097),doe=z-era*146097,yoe=Math.floor((doe-Math.floor(doe/1460)+Math.floor(doe/36524)-Math.floor(doe/146096))/365),doy=doe-(365*yoe+Math.floor(yoe/4)-Math.floor(yoe/100)),mp=Math.floor((5*doy+2)/153),d=doy-Math.floor((153*mp+2)/5)+1,m=mp+(mp<10?3:-9);return {y:yoe+era*400+(m<=2?1:0),m,d}}
function berlinOffset(ms){const p=berlinParts(ms);return daysOf(p.y,p.m,p.d)*DAY+p.h*HOUR+p.mi*60000-Math.floor(ms/60000)*60000}
function pad2(n){return String(n).padStart(2,'0')}
function dayStr(dd){const c=ymdOf(dd);return `${c.y}-${pad2(c.m)}-${pad2(c.d)}`}
// Woche = Datum ihres Montags (deutsche Zeit); ab Sonntag 20 Uhr zählt schon die nächste Woche
function weekKey(ms){const p=berlinParts(ms);return dayStr(daysOf(p.y,p.m,p.d)-p.wd+(p.wd===6&&p.h>=20?7:0))}

/* Zielscheibe: Die stärkste echte Bande. Wer höchstens halb so viele Punkte hat, bekommt beim Überfall eine Prämie. */

function isTarget(o){return Object.keys(players).length>1&&!!me&&(topReal()||{}).o===o}
function tgtFor(o){if(!me||o===me.id||isNpc(o)||!isTarget(o))return false;return worth(me.id).w*2<=topReal().w}

/* Boss der Woche: Ruf dieser Woche + Beute/100. Sonntag um 20 Uhr gewinnt die beste echte Bande. */
const WK_BONUS=20000;
function ensureWeek(){
  if(!me||me.ruf==null)return; const k=weekKey(now());
  if(me.week_key===k){if(me.week_ruf0==null)me.week_ruf0=+me.ruf||0;return}
  if(me.week_key)me.week_last={key:me.week_key,pts:weekRaw(me)};
  me.week_key=k; me.week_ruf0=+me.ruf||0; me.week_loot=0;
}
function weekRaw(p){if(p&&p._pub)return +p.week_pts||0;return Math.max(0,Math.round((p.week_ruf0==null?0:(+p.ruf||0)-(+p.week_ruf0||0))+(+p.week_loot||0)/100))}
function weekPts(p){return p&&p.week_key===weekKey(now())?weekRaw(p):0}
function weekLoot(v){if(!me||!(v>0))return;ensureWeek();me.week_loot=(+me.week_loot||0)+Math.round(v)}
function wkBossId(){return world&&world.boss_id&&world.boss_week===weekKey(now()-7*DAY)?world.boss_id:null}
function weekCard(){
  const list=Object.keys(players).filter(o=>!isNpc(o)).map(o=>({o,p:weekPts(o===me.id?me:players[o])})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,5);
  const wb=wkBossId(), wi=wb&&ownerInfo(wb);
  return `<section class="card"><h3>🏆 Boss der Woche</h3><p class="small muted">Punkte = Ruf dieser Woche + Beute geteilt durch 100. Sonntag um 20 Uhr bekommt die beste Bande ${fmt(WK_BONUS)} sauber und eine Woche lang den 🏆.</p>
    ${list.length?`<ol class="rank">${list.map((x,i)=>`<li class="rk tap ${x.o===me.id?'me':''}" data-act="gang" data-o="${x.o}" role="button"><span class="pos">${i+1}</span>${portrait(x.o,30)}<div><b>${esc(ownerInfo(x.o).name)}</b></div><span class="w">${x.p}</span></li>`).join('')}</ol>`:'<p class="small muted">Diese Woche hat noch keine Bande gepunktet.</p>'}
    ${wi?`<p class="small">Letzte Woche: 🏆 <b>${esc(wi.name)}</b> mit ${fmt(+world.boss_pts||0)} Punkten.</p>`:''}</section>`;
}

const FESTS=[
  {id:'ckm26',ico:'🎄',name:'Christkindlesmarkt',up:'CHRISTKINDLESMARKT',start:'2026-11-27 17:30',end:'2026-12-24 14:00',city:'nbg',

];
function berlinMs(str){const m=String(str).match(/(\d+)-(\d+)-(\d+) (\d+):(\d+)/);const loc=daysOf(+m[1],+m[2],+m[3])*DAY+(+m[4])*HOUR+(+m[5])*60000;return loc-berlinOffset(loc-HOUR)}
FESTS.forEach(F=>{F.a=berlinMs(F.start);F.b=berlinMs(F.end)});
function festAt(t){return FESTS.find(F=>t>=F.a&&t<F.b)||null}
function festNow(){return festAt(now())}
function festSoon(){const t=now();return FESTS.find(F=>t<F.a&&F.a-t<=FEST_PRE)||null}
function festLast(){const t=now();return FESTS.filter(F=>t>=F.b&&t<F.b+FEST_AFTER).pop()||null}
/* Wirkung auf die Kassen: Faktor zu einem Zeitpunkt und Zeit (in ms) gewichtet über einen Zeitraum */
function festMul(d,t){const F=festAt(t);return F&&F.eff&&F.eff.d===d.id?F.eff.bar:1}
function festInt(d,a,b){let v=b-a;FESTS.forEach(F=>{if(F.eff&&F.eff.d===d.id){const ov=Math.min(b,F.b)-Math.max(a,F.a);if(ov>0)v+=ov*(F.eff.bar-1)}});return v}
function festLeft(F){const s=Math.max(0,Math.ceil((F.b-now())/1000));return s>=2*DAY/1000?`noch ${Math.floor(s/86400)} Tage`:'noch '+dur(s)}
function festDate(ms){try{return new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}).format(ms)+' Uhr'}catch(e){return ''}}

/* ======================================================================
   Ab Beta 4.6.1 „Stadtleben“: echter Club-Spieltag und echtes Wetter, je Stadt.
   cashcheck holt Spielplan (OpenLigaDB) und Wetter (Open-Meteo) und legt sie in world.city ab:
   {nbg:{wx:{h0,c:[Wettercode je Stunde],t:[°C],d:[Tag 1/0]}, m:[{id,ko,opp,home,derby,cup}], r:{id,ko,opp,g:[Club,Gegner],res,derby,home}}}
   Bis Beta 8 gilt alles nur für Nürnberg.
   ====================================================================== */
const TOWNS={nbg:{name:'Nürnberg',club:'Club',clubLong:'1. FC Nürnberg'},fue:{name:'Fürth',club:'Kleeblatt',clubLong:'SpVgg Greuther Fürth'}};
const CLUB_PRE=2*HOUR, CLUB_POST=2*HOUR, CLUB_WETT=1.5, WX_BOOST=1.2;
const WX={
  sun:{ico:'☀️',name:'Sonnig',txt:'Coups bringen +20 % Beute.'},
  rain:{ico:'🌧️',name:'Regen',txt:'Alle sitzen drinnen: Clubs bringen +20 % Bargeld, Shisha-Bars waschen +20 %.'},
  storm:{ico:'⛈️',name:'Gewitter',txt:'Alle sitzen drinnen: Clubs bringen +20 % Bargeld, Shisha-Bars waschen +20 %.'},
  snow:{ico:'❄️',name:'Schnee',txt:'Alle sitzen drinnen: Clubs bringen +20 % Bargeld, Shisha-Bars waschen +20 %.'},
  fog:{ico:'🌫️',name:'Nebel',txt:'Überfälle machen nur halbe Hitze.'},
  cloud:{ico:'☁️',name:'Bewölkt',txt:'Heute wirkt das Wetter nicht aufs Geschäft.'},
  night:{ico:'🌙',name:'Klar',txt:'Heute Nacht wirkt das Wetter nicht aufs Geschäft.'}
};
function townOf(d){return (d&&d.city)||'nbg'}
function cityRow(c){const w=world&&world.city;const x=typeof w==='string'?(()=>{try{return JSON.parse(w)}catch(e){return null}})():w;return x&&x[c||'nbg']||null}
/* Wetter zu einem Zeitpunkt: Code, Temperatur, Tag/Nacht und Art (sun, rain, storm, snow, fog, cloud, night) */
function wxAt(t,c){
  const x=cityRow(c), w=x&&x.wx; if(!w||!Array.isArray(w.c))return null;
  const i=Math.floor((t-(+w.h0||0))/HOUR); if(i<0||i>=w.c.length||w.c[i]==null)return null;
  const code=+w.c[i], day=!w.d||+w.d[i]===1;
  let k='cloud';
  if(code<=1)k=day?'sun':'night';
  else if(code===45||code===48)k='fog';
  else if(code>=95)k='storm';
  else if(code>=71&&code<=77||code===85||code===86)k='snow';
  else if(code>=51&&code<=67||code>=80&&code<=82)k='rain';
  return {k,code,temp:w.t&&w.t[i]!=null?Math.round(+w.t[i]):null,day,...WX[k]};
}
function wxIs(t,ks,c){const w=wxAt(t,c);return !!w&&ks.includes(w.k)}
const WET=['rain','storm','snow'];
/* Club-Spieltag: Spielfenster 2 Std. vor bis 2 Std. nach Anpfiff */
function clubMatches(c){const x=cityRow(c);return x&&Array.isArray(x.m)?x.m.filter(m=>m&&+m.ko>0):[]}
function clubAt(t,c){return clubMatches(c).find(m=>t>=+m.ko-CLUB_PRE&&t<+m.ko+CLUB_POST)||null}
function clubToday(c){const day=berlinDay(),t=now();return clubMatches(c).filter(m=>berlinDayOf(+m.ko)===day&&t<+m.ko+CLUB_POST).sort((a,b)=>a.ko-b.ko)[0]||null}
function clubResult(c){const x=cityRow(c), r=x&&x.r;return r&&+r.ko>0&&now()-(+r.ko)<20*HOUR&&berlinDayOf(+r.ko)===berlinDay()?r:null}
function berlinDayOf(ms){const p=berlinParts(ms);return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')}
function clubPair(m){const cl=TOWNS.nbg.club;return m.home?`${cl} – ${m.opp}`:`${m.opp} – ${cl}`}
function clubTime(m){try{return new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit'}).format(+m.ko)}catch(e){return ''}}
/* Wirkung auf die Läden zu einem Zeitpunkt (zusätzlich zu Viertel-Bonus und Fest) */
function lifeMul(type,d,t){
  let m=1; const c=townOf(d);
  if(type==='wett'&&clubAt(t,c))m*=CLUB_WETT;
  if(type==='club'&&wxIs(t,WET,c))m*=WX_BOOST;

function lifeInt(s,d,a,b){
  if(s.type!=='wett'&&s.type!=='club')return festInt(d,a,b);

  a=Math.max(a,b-2*DAY);

  if(s.type==='wett')clubMatches(townOf(d)).forEach(m=>{add(+m.ko-CLUB_PRE);add(+m.ko+CLUB_POST)});
  if(s.type==='club')for(let h=Math.ceil(a/HOUR)*HOUR;h<b;h+=HOUR)add(h);
  const pts=[...cut].sort((x,y)=>x-y); let v=0;
  for(let k=1;k<pts.length;k++){const p=pts[k-1],q=pts[k],mid=(p+q)/2;v+=(q-p)*festMul(d,mid)*lifeMul(s.type,d,mid)}
  return v;
}
