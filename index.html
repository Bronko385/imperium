  if(x.smuggler===me.id){
    const st=x.catcher?`<p class="warn">${esc(ownerInfo(x.catcher).name)} hat deine Ladung abgefangen.</p>`:smugOn(x)?`<p>Deine Lebkuchen sind in <b>${dname(x.district)}</b> unterwegs, noch ${left}. Kommen sie durch, bekommst du die Belohnung beim nächsten Öffnen.</p>`:'<p>Deine Ladung ist angekommen.</p>';
    return `<div class="mbox" role="dialog" aria-label="Lebkuchen-Schmuggel">${head}${st}<div class="kv"><div><span>💵 Belohnung</span><b class="c-dirty">${fmt(+x.loot)}</b></div><div><span>❤️ Lebkuchenherzen</span><b>+${SMUG_H}</b></div></div><button class="btn wide" data-act="close">Okay</button></div>`;
  }
  const bl=smugCatchBlock(x);
  return `<div class="mbox" role="dialog" aria-label="Lebkuchen-Schmuggel">${head}
    <p><b>${esc(ownerInfo(x.smuggler).name)}</b> schmuggelt eine Ladung Lebkuchen durch <b>${viaD(x.district)}</b>. Wer sie zuerst abfängt, behält sie.</p>
    <div class="kv"><div><span>💵 Beute</span><b class="c-dirty">${fmt(+x.loot)}</b></div><div><span>❤️ Lebkuchenherzen</span><b>+${SMUG_CH}</b></div><div><span>⏱️ Noch unterwegs</span><b>${left}</b></div><div><span>⚡ Kosten</span><b>${SMUG_CE} Energie</b></div></div>
    <button class="btn wide" data-act="smuggo" data-id="${x.id}" ${bl?'disabled':''}>🛷 Abfangen · ⚡${SMUG_CE}<span class="sub">${bl||'Schweres Minispiel: zwei Treffer, ein Versuch pro Bande'}</span></button></div>`;
}
/* Im Coup-Fenster: Schmuggel starten */
function smugCoupHTML(){
  const F=festNow(); if(!F||!F.smuggle||!me)return '';
  const bl=smugStartBlock();
  return `<h4>🛷 Lebkuchen-Schmuggel</h4><div class="heist fest"><small>Einmal am Tag zwischen ${SMUG_FROM} und ${SMUG_TO} Uhr: Deine Ladung fährt 20 Minuten durch die Altstadt, alle anderen Banden bekommen Bescheid und können sie abfangen.</small>
    <small>Kommt sie durch: 💵 ${fmt(smugLoot())} · ❤️ +${SMUG_H} · ⭐ +${SMUG_RUF}</small>
    <button class="btn sm" data-act="smugstart" ${bl?'disabled':''}>${bl?esc(bl):`Losfahren · ⚡ ${SMUG_E}`}</button></div>`;
}

/* Fest-Chip, Fest-Fenster und Rangliste */
function festChip(){
  if(!me)return '';
  const F=festNow();
  if(F)return `<button class="chipb fest" data-act="fest"><b>${F.ico} ${F.up}</b>${festLeft(F)}${F.pts?` · ${F.pts.ico} ${festPts(me,F)}`:''}</button>`;
  const S=festSoon(); if(S){const dd=Math.ceil((S.a-now())/DAY);return `<button class="chipb fest" data-act="fest"><b>${S.ico} ${S.up}</b>${dd<=1?'öffnet '+festDate(S.a):`in ${dd} Tagen`}</button>`}
  return '';
}
function festList(F){
  return Object.keys(players).filter(o=>!isNpc(o)).map(o=>{const p=o===me.id?me:players[o],x=festOf(p,F);return {o,p:x?(+x.p||0):0,t:x?(+x.t||0):0}}).filter(x=>x.p>0).sort((a,b)=>b.p-a.p||a.t-b.t);
}
function festRows(F,list){
  return list.length?`<ol class="rank">${list.map((x,i)=>`<li class="rk tap ${x.o===me.id?'me':''}" data-act="gang" data-o="${x.o}" role="button"><span class="pos">${i+1}</span>${portrait(x.o,30)}<div><b>${esc(ownerInfo(x.o).name)}${nameTag(x.o)}</b>${i<F.prize.length&&now()<F.b?`<span>Preis: ${fmt(F.prize[i])} sauber</span>`:''}</div><span class="w">${x.p} ${F.pts.ico}</span></li>`).join('')}</ol>`:`<p class="small muted">Noch hat keine Bande ${F.pts.name} gesammelt.</p>`;
}
function festRules(F){
  return `<ul class="list"><li><span>🏙️ ${F.eff.txt}</span></li><li><span>🎯 Markt-Coup alle 2 Stunden (⚡ 1)</span><b>❤️ +${FEST_CD.hearts}</b></li><li><span>🛷 Schmuggel einmal am Tag (⚡ 2)</span><b>❤️ +${SMUG_H}</b></li><li><span>🛷 Fremde Ladung abfangen (⚡ 1)</span><b>❤️ +${SMUG_CH}</b></li></ul>
    <p class="small muted">Höchstens ${F.pts.day} ${F.pts.ico} am Tag. Die Stufe spielt keine Rolle, nur echte Banden zählen. Preise: ${F.prize.map((v,i)=>`${i+1}. Platz ${fmt(v)}`).join(', ')} sauberes Geld, der Sieger trägt dauerhaft ${F.win.ico}, alle ab ${F.all.min} ${F.pts.ico} ein Jahr lang ${F.all.ico}.</p>`;
}
function festModal(){
  const F=festNow(), S=!F&&festSoon(), L=!F&&!S&&festLast(), G=F||S||L;
  const head=`<div class="mtop"><span></span><h3>${G?G.name:'Feste'}</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>`;
  if(!G)return `<div class="mbox" role="dialog" aria-label="Feste">${head}<p>Gerade ist kein Fest. Der Kurier sagt Bescheid, wenn das nächste kommt.</p><button class="btn wide" data-act="close">Okay</button></div>`;
  if(S)return `<div class="mbox" role="dialog" aria-label="${S.name}">${head}<div class="truckbig">${S.ico}</div><p>Der ${S.name} öffnet am <b>${festDate(S.a)}</b> und läuft bis ${festDate(S.b)}. Wer die meisten ${S.pts.name} sammelt, gewinnt.</p>${festRules(S)}<button class="btn wide" data-act="close">Okay</button></div>`;
  const list=festList(G);
  if(L)return `<div class="mbox" role="dialog" aria-label="${L.name}">${head}<div class="truckbig">${L.ico}</div><p>Der ${L.name} ist vorbei. Endstand:</p>${festRows(L,list)}<button class="btn wide" data-act="close">Fertig</button></div>`;
  const mine=festPts(me,F), today=festToday(F);
  return `<div class="mbox" role="dialog" aria-label="${F.name}">${head}
    <p>${F.ico} Der ${F.name} läuft bis ${festDate(F.b)}, ${festLeft(F)}. Wer die meisten ${F.pts.name} sammelt, gewinnt.</p>
    <div class="stats"><div class="stat"><small>Deine ${F.pts.ico}</small><b>${mine}</b></div><div class="stat"><small>Heute</small><b>${today}<span class="of">/${F.pts.day}</span></b></div></div>
    ${festRules(F)}
    ${festRows(F,list.slice(0,5))}
    <button class="btn violet wide" data-act="coups">🎯 Zu den Coups und zum Schmuggel</button>
    <button class="btn ghost wide" data-act="close">Fertig</button></div>`;
}
function festRankHTML(F){
  const list=festList(F), end=now()>=F.b;
  return `<section class="card"><h2>${F.ico} ${F.name}</h2><p class="small muted">${end?'Endstand. Die Preise sind verteilt.':`Bis ${festDate(F.b)}, ${festLeft(F)}. Wer die meisten ${F.pts.name} hat, gewinnt.`}</p>
    ${festRows(F,list)}${end?'':festRules(F)}</section>`;
}
/* Preis aus der Fest-Wertung (cashcheck schreibt ein Ereignis, das Spiel verbucht es genau einmal) */
let festBusy=false;
async function applyFestPrize(){
  if(srvShop())return;
  if(!me||festBusy)return; festBusy=true;
  try{
    const rows=(await q(sb.from('events').select('*').eq('world',WORLD).eq('kind','fest').eq('target',me.id).eq('applied',false)))||[];
    let got=0;
    for(const e of rows){
      const data=await q(sb.from('events').update({applied:true}).eq('id',e.id).eq('applied',false).select());
      if(data&&data[0])got+=+e.amount||0;
    }
    if(got>0){bk('fest',{clean:got});await savePlayer();toast(`🎄 Fest-Preis: +${fmt(got)} sauber`,'good');floatGain('🎄');renderHUD()}
  }catch(e){console.warn(e)}
  festBusy=false;
}

setNoGang(true);
/* Ab 5.0.3 „Tresor“: unsichtbare anonyme Anmeldung, die Bande gehört nur ihren Geräten */
const LS_AUTH='imperium-auth';
let myCode=null;
function authStore(){return {getItem:k=>{try{return localStorage.getItem(k)}catch(e){return null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},removeItem:k=>{try{localStorage.removeItem(k)}catch(e){}}}}
async function ensureAuth(){
  const {data}=await sb.auth.getSession(); if(data&&data.session)return;
  const r=await sb.auth.signInAnonymously(); if(r.error)throw r.error;
}
async function claimGang(id){
  const {data,error}=await sb.rpc('claim_gang',{p_id:id}); if(error)throw error;
  const c=data||{ok:false}; if(c.ok)myCode=c.code; return c;
}
async function codeLogin(){
  const inp=document.getElementById('gcode'), c=(inp&&inp.value||'').trim();
  if(c.length<8){toast('Gib deinen Bandencode ein, z. B. BRAT-7K4M-Q9TX.','bad');return}
  let r=null; try{const x=await sb.rpc('code_login',{p_code:c});if(x.error)throw x.error;r=x.data}catch(e){console.warn(e);toast('Keine Verbindung. Versuch es nochmal.','bad');return}
  if(!r||!r.ok){toast('Diesen Code gibt es nicht.','bad');return}
  try{sessionStorage.removeItem('imperium-out')}catch(_){}
  try{const row=await q(sb.from('players').select('*').eq('id',r.id));if(row&&row[0])players[r.id]=norm(row[0])}catch(e){}
  if(!players[r.id]){try{await refreshPlayers()}catch(e){}}
  if(!players[r.id]){toast('Diese Bande gibt es nicht mehr.','bad');return}
  try{localStorage.setItem(LS_KEY,r.id)}catch(_){}
  me=players[r.id]; try{await claimGang(r.id)}catch(e){}
  if(srvShop())try{await refreshSlots()}catch(e){}
  if(me.ruf==null)me.ruf=assignRuf(); ui.sel=null; ecoAdvance(); savePlayer(); startGame(); refreshPush(); toast(`Willkommen zurück, ${me.name}!`,'good');
}
async function newCode(){
  if(!ui.ncSure){ui.ncSure=true;showCode();return}
  ui.ncSure=false;
  try{const {data,error}=await sb.rpc('new_code',{p_id:me.id});if(error||!data)throw error||new Error('kein Code');myCode=data}catch(e){console.warn(e);toast('Das hat nicht geklappt. Versuch es nochmal.','bad');showCode();return}
  showCode(); toast('🔄 Neuer Bandencode. Der alte gilt nicht mehr, andere Geräte sind abgemeldet.','good');
}
async function boot(){
  if(!window.supabase||SUPABASE_URL.indexOf('HIER_')===0||SUPABASE_KEY.indexOf('HIER_')===0){
    showScreen(`<section class="card"><h2>Fast fertig</h2><p>Die Verbindung zur Datenbank fehlt noch. Trag in der Datei <b>config.js</b> die Project URL und den Key aus Supabase ein (siehe Anleitung).</p></section>`);return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:LS_AUTH,storage:authStore()}});
  showScreen(`${skyline()}<section class="card"><h2>Verbinde mit Nürnberg …</h2><p class="muted">Einen Moment.</p></section>`);
  try{await ensureAuth()}catch(e){console.warn(e);showScreen(`<section class="card"><h2>Anmeldung klappt nicht</h2><p>Das Spiel konnte dein Gerät nicht anmelden. Prüf die Internetverbindung und lade die Seite neu.</p><p class="small muted">${esc(e.message||e)}</p></section>`);return}
  try{await loadAll()}catch(e){console.warn(e);showScreen(`<section class="card"><h2>Keine Verbindung</h2><p>Die Datenbank antwortet nicht. Prüf die Internetverbindung, URL und Key in config.js und ob das Datenbank-Skript ausgeführt wurde. Ein pausiertes Supabase-Projekt musst du im Dashboard wieder starten.</p><p class="small muted">${esc(e.message||e)}</p></section>`);return}
  if(!world||!Object.keys(slots).length){showScreen(`<section class="card"><h2>Stadt noch leer</h2><p>Die Tabellen sind da, aber die Startbelegung fehlt. Führe das Skript <b>setup.sql</b> komplett im SQL Editor aus.</p></section>`);return}
  let id=null; try{id=localStorage.getItem(LS_KEY)}catch(e){}
  let claim=null;
  if(id&&players[id]){try{claim=await claimGang(id)}catch(e){console.warn(e);showScreen(`<section class="card"><h2>Keine Verbindung</h2><p>Die Datenbank antwortet nicht. Lade die Seite gleich nochmal.</p><p class="small muted">${esc(e.message||e)}</p></section>`);return}
    if(!claim.ok){try{localStorage.removeItem(LS_KEY)}catch(e){}id=null;onboarding(true);return}}
  if(id&&players[id]){
    me=players[id]; const since=me.last_seen||now();
    const firstB4=me.ruf==null; if(firstB4)me.ruf=assignRuf();
    const fCut=capDrivers(); ecoAdvance(); await flushSlotWrites(); await applyHacks(); await applyTips(); await savePlayer();
    ensureWeek(); startGame(); if(fCut)toast(`🏎️ Höchstens ${MAX_FH} Fahrer: ${fCut} ${fCut>1?'sind':'ist'} gegangen, du bekommst ${fmt(fCut*CREW.f.cost)} Bargeld zurück.`,'good'); refreshPush(); applyWeekBoss(); applyFestPrize();
    const needNews=seenVersion()!==CURRENT_VERSION;
    if(firstB4)toast(`⭐ Neu in Beta 4: Du startest als ${titleOf(myLevel())}.`,'good');
    if(claim&&claim.fresh)setTimeout(()=>toast('🔐 Deine Bande ist jetzt gesichert. Neuer Bandencode im Menü ☰.','good'),2500);
    if(!bossOf(me.id))pendingBoss=true;
    if(now()-since>5*60000){report(since);if(needNews)pendingNews=true}
    else if(needNews)showNews(true);
    else setTimeout(checkRevenge,1500);
    npcRoutine().then(()=>{dirty=true});
  }else onboarding();
}
boot();
})();

</script>
