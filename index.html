/* Bestellungen: zweimal am Tag, 6 Stunden lang, wer zuerst liefert, kassiert */
const ORDER_MS=6*HOUR, ORDER_RUF=20;
const ORDER_WHO={f:['der Wirt vom Weißgerbergraben','die Kneipe am Plärrer','ein Kiosk in Gostenhof','der Bratwurststand am Hauptmarkt'],
  t:['eine Hinterhof-Werkstatt in Gostenhof','ein Schrotthändler am Hafen','ein Tüftler aus Langwasser','die Fahrradbude am Hauptbahnhof']};
function ordersOfDay(dd){
  return [0,1].map(k=>{
    const qn=(k?56:28)+Math.floor(th(`o${dd}:${k}:q`)*16), at=dd*DAY+qn*15*60000;
    const wk=th(`o${dd}:${k}:w`)<.5?'f':'t', n=10+Math.floor(th(`o${dd}:${k}:n`)*11), L=ORDER_WHO[wk];
    return {id:`${dd}-${k}`,at,until:at+ORDER_MS,wk,n,pay:n*WARE[wk].price*2,who:L[Math.floor(th(`o${dd}:${k}:c`)*L.length)]};
  });
}
function orderNow(){const t=now(), dd=Math.floor(t/DAY);return ordersOfDay(dd).find(x=>t>=x.at&&t<x.until)||null}
let orderRow={};
function orderOpen(){const o=orderNow();if(!o)return null;const r=orderRow[o.id];return r&&r.winner?null:o}
async function loadOrder(){const o=orderNow();if(!o)return;try{const r=await q(sb.from('orders').select('*').eq('world',WORLD).eq('id',o.id));orderRow[o.id]=r&&r[0]||null}catch(e){}}
async function ensureOrder(o){
  try{
    const r=await q(sb.from('orders').upsert({world:WORLD,id:o.id,ware:o.wk,n:o.n,pay:o.pay,starts:o.at},{onConflict:'world,id',ignoreDuplicates:true}).select());
    if(r&&r[0]){orderRow[o.id]=r[0];await addEvent({kind:'info',txt:`📦 Bestellung: ${cap1(o.who)} braucht ${o.n} ${WARE[o.wk].name}. Wer zuerst liefert, kassiert ${fmt(o.pay)} und ⭐ ${ORDER_RUF}.`})}
  }catch(e){console.warn(e)}
}
async function syncOrder(){const o=orderNow();if(!o)return;await loadOrder();if(!orderRow[o.id])await ensureOrder(o);dirty=true}
function orderBlock(o){
  if(!unlocked('brenn'))return lockTxt('brenn');
  const have=hasW(me,o.wk); return have<o.n?`Du hast ${have} von ${o.n} ${WARE[o.wk].name}`:null;
}
function deliverOrder(){return guard(async()=>{
  const o=orderOpen(); if(!o||orderBlock(o))return;
  if(srvShop()){
    const x=await shopAct('liefern',{},true); loadOrder().then(()=>{dirty=true}).catch(()=>{}); if(!x)return;
    showResult(true,'GELIEFERT!',`${cap1(o.who)} ist zufrieden. Bar auf die Hand.`,`+${fmt(x.pay)} Bargeld · ⭐ +${x.ruf||ORDER_RUF}`,'c-dirty',true);
    return;
  }
  await ensureOrder(o);
  const w=await q(sb.from('orders').update({winner:me.id,won_at:now()}).eq('world',WORLD).eq('id',o.id).is('winner',null).select());
  if(!w||!w[0]){await loadOrder();showResult(false,'ZU SPÄT','Eine andere Bande hat schon geliefert.','',null,true);return}
  orderRow[o.id]=w[0];
  addWare(o.wk,-o.n); bk('order',{bar:o.pay}); addRuf(ORDER_RUF,'order'); await savePlayer();
  await addEvent({kind:'win',actor:me.id,amount:o.pay,txt:`📦 ${me.name} liefert ${o.n} ${WARE[o.wk].name} an ${o.who} und kassiert ${fmt(o.pay)}.`});
  showResult(true,'GELIEFERT!',`${cap1(o.who)} ist zufrieden. Bar auf die Hand.`,`+${fmt(o.pay)} Bargeld · ⭐ +${ORDER_RUF}`,'c-dirty',true);
})}
function orderCard(o){
  const bl=orderBlock(o), W=WARE[o.wk];
  return `<div class="order"><div class="row spread"><b>📦 Bestellung</b><span class="small muted">noch ${dur(Math.ceil((o.until-now())/1000))}</span></div>
    <p>${cap1(o.who)} braucht <b>${o.n} ${W.ico} ${W.name}</b>. Wer zuerst liefert, kassiert <b class="c-dirty">${fmt(o.pay)}</b> und ⭐ ${ORDER_RUF}.</p>
    <button class="btn wide" data-act="deliver" ${bl?'disabled':''}>📦 Liefern · +${fmt(o.pay)}<span class="sub">${bl||'Doppelter Hehlerpreis'}</span></button></div>`;
}
function orderChip(){const o=orderOpen();if(!o||!me)return '';return `<button class="chipb order" data-act="order"><b>📦 BESTELLUNG</b>${o.n} ${WARE[o.wk].ico} · noch ${dur(Math.ceil((o.until-now())/1000))}</button>`}
function orderModal(){
  const o=orderOpen();
  return `<div class="mbox" role="dialog" aria-label="Bestellung"><div class="mtop"><span></span><h3>Bestellung</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>
    ${o?orderCard(o):'<p>Gerade gibt es keine offene Bestellung. Zweimal am Tag sucht jemand Fusel oder Teile, das steht dann im Kurier.</p>'}
    <p class="small muted">Dein Lager: ${Object.keys(WARE).map(k=>`${WARE[k].ico} ${hasW(me,k)} ${WARE[k].name}`).join(' · ')}</p>
    <button class="btn ghost wide" data-act="close">Schließen</button></div>`;
}
function lagerHTML(){
  const wl=unlocked('brenn'), o=orderOpen();
  return `<section class="card"><h2>📦 Lager</h2>
    <div class="stats two">${Object.keys(WARE).map(k=>`<div class="stat"><small>${WARE[k].ico} ${WARE[k].name}</small><b>${hasW(me,k)}</b></div>`).join('')}</div>
    ${wl?`<div class="acts">${Object.keys(WARE).map(k=>`<button class="btn ghost sm" data-act="sellw" data-k="${k}" ${hasW(me,k)<1?'disabled':''}>${WARE[k].ico} An den Hehler · +${fmt(hasW(me,k)*WARE[k].price)}</button>`).join('')}</div>
    <p class="small muted">🥃 Brennerei und 🔩 Schrottplatz füllen sich wie eine Kasse, abholen auf der Karte. Der Hehler zahlt immer ${fmt(WARE.f.price)} pro Fusel und ${fmt(WARE.t.price)} pro Teil. Ein gelungener Überfall raubt dir 20 % vom Lager.</p>`
    :`<p class="small muted">${lockTxt('brenn')}: Dann baust du Brennerei und Schrottplatz.</p>`}
    ${o?orderCard(o):''}</section>
  <section class="card"><h2>🧰 Ausrüstung</h2><ul class="crewl">${Object.keys(GEAR).map(k=>{const G=GEAR[k],bl=gearBlock(k);return `<li class="crow"><span class="ico">${G.ico}</span><div><b>${G.name}</b><small>${G.txt}</small></div><span class="cnt">${hasG(me,k)}</span>${unlocked('gear')?`<button class="btn sm" data-act="craft" data-k="${k}" ${bl?'disabled':''} aria-label="${G.name} bauen${bl?': '+bl:''}">${needTxt(G)}</button>`:`<small class="lk">${lockTxt('gear')}</small>`}</li>`}).join('')}</ul>
    <p class="small muted">Höchstens ${GEAR_MAX} von jeder Sorte. Ausrüstung wirkt von selbst beim nächsten Angriff oder Überfall. Manchmal bringt ein Coup welche mit.</p></section>`;
}

/* ======================================================================
   Beta 4.5 „Familie“: Bündnisse zu zweit, Hilfe im Duell, Angebote (Tausch und Geld), Großcoups
   ====================================================================== */
const FAM_LVL=3, ALLY_ASK=24*HOUR, ALLY_END=24*HOUR, ALLY_GIFT=24*HOUR, TRAITOR_MS=7*24*HOUR;
const GIFT_FEE=.2, GIFT_MAX=20000, GIFT_OPTS=[5000,10000,20000], OFFER_MS=24*HOUR, OFFER_MAX=3, DEAL_BIG=20000;
let alliances=[], offers=[], heists=[], betrayAsk=null, famBusy=false;
function dayOf(t){try{return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(t)}catch(e){return 'd'+Math.floor((t+2*HOUR)/864e5)}}
function berlinHour(){try{return parseInt(new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'numeric',hour12:false}).format(now()),10)%24}catch(e){return new Date(now()).getHours()}}
function jparse(v,d){if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return d}}return v||d}
async function loadFam(){
  try{
    const [al,of,he]=await Promise.all([
      q(sb.from('alliances').select('*').eq('world',WORLD)),
      q(sb.from('offers').select('*').eq('world',WORLD).gt('ts',now()-14*24*HOUR)),
      q(sb.from('heists').select('*').eq('world',WORLD).gt('ts',now()-2*24*HOUR))]);
    alliances=al||[]; offers=(of||[]).map(normOffer); heists=(he||[]).map(normHeist);
  }catch(e){console.warn(e)}
}
function normOffer(o){o.give=jparse(o.give,{});o.want=jparse(o.want,{});return o}
function normHeist(h){h.members=jparse(h.members,[]);if(!Array.isArray(h.members))h.members=[];return h}
function upsertRow(list,r,fn){if(!r||r.id==null)return;const i=list.findIndex(x=>x.id===r.id);const v=fn?fn(r):r;if(i>=0)list[i]=v;else list.push(v)}

/* --- Bündnis --- */
function allyLive(x){return x.status==='on'||(x.status==='ending'&&now()<+x.ends_at)}
function allyRow(o){return alliances.find(x=>allyLive(x)&&(x.a===o||x.b===o))||null}
function allyOf(o){const x=allyRow(o);return x?(x.a===o?x.b:x.a):null}
function isAlly(o){return !!me&&!!o&&o!==me.id&&allyOf(me.id)===o}
function traitorUntil(o){let t=0;alliances.forEach(x=>{if(x.status==='off'&&x.broken_by===o)t=Math.max(t,+x.off_at+TRAITOR_MS)});return t>now()?t:0}
function betrayedMe(o){return !!me&&alliances.some(x=>x.status==='off'&&x.broken_by===o&&(x.a===me.id||x.b===me.id)&&now()<+x.off_at+TRAITOR_MS)}
function allyAsk(from,to){return alliances.find(x=>x.status==='ask'&&x.a===from&&x.b===to&&now()-x.ts<ALLY_ASK)||null}
function asksToMe(){return me?alliances.filter(x=>x.status==='ask'&&x.b===me.id&&now()-x.ts<ALLY_ASK&&players[x.a]):[]}
function nameTag(o){const p=o===(me&&me.id)?me:players[o];return badgeTag(p)+(wkBossId()===o?' 🏆':'')+(allyOf(o)?' 🤝':'')+(traitorUntil(o)?' 🐍':'')+(p&&!isNpc(o)&&p.push_ok===false?' 📵':'')}
function allyBlock(o){
  if(!players[o]||o===me.id)return 'Nur mit anderen Mitspielern';
  if(!unlocked('ally'))return lockTxt('ally');
  const l=levelOf(o); if(l==null||l<FAM_LVL)return `${esc(players[o].name)} ist noch keine ${titleOf(FAM_LVL)}`;
  if(allyRow(me.id))return 'Du hast schon ein Bündnis';
  if(allyRow(o))return 'Diese Bande hat schon ein Bündnis';
  if(allyAsk(me.id,o))return 'Anfrage läuft, warte auf die Antwort';
  return null;
}
function famRun(fn){
  if(famBusy)return; famBusy=true;
  return guard(async()=>{try{await fn()}finally{famBusy=false}await loadFam();dirty=true;if(ui.gang&&!document.getElementById('modal').hidden&&document.getElementById('famrow'))showGang(ui.gang)});
}
function askAlly(o){return famRun(async()=>{
  if(allyBlock(o))return;
  if(srvShop()){if(await shopAct('spezl',{op:'ask',o}))toast(`🤝 Anfrage an ${players[o].name} ist raus.`,'good');return}
  await q(sb.from('alliances').insert({world:WORLD,ts:now(),a:me.id,b:o,status:'ask'}));
  await addEvent({kind:'allyask',actor:me.id,target:o,txt:`🤝 ${me.name} will ein Bündnis mit dir. Antworte in der Übersicht der Bande.`});
  toast(`🤝 Anfrage an ${players[o].name} ist raus.`,'good');
})}
function acceptAlly(id){return famRun(async()=>{
  const x=alliances.find(y=>y.id===id); if(!x)return;
  if(allyRow(me.id)){toast('Du hast schon ein Bündnis.','bad');return}
  if(srvShop()){const y=await shopAct('spezl',{op:'ja',id});if(!y)return;
    showResult(true,'SPEZLN!',`${esc(ownerInfo(x.a).name)} und deine Bande halten jetzt zusammen.`,'Kein Angriff mehr gegeneinander · Hilfe im Überfall · Geld schicken ab morgen','c-clean',true);return}
  let r=null;
  try{const {data,error}=await sb.rpc('ally_accept',{p_id:id,p_player:me.id});if(error)throw error;r=data}catch(e){toast('Geht nicht: Diese Bande hat inzwischen ein anderes Bündnis.','bad');return}
  if(!r){toast('Die Anfrage gilt nicht mehr.','bad');return}
  const a=ownerInfo(x.a).name;
  await addEvent({kind:'ally',actor:me.id,txt:`🤝 ${a} und ${me.name} sind jetzt Spezln. Wer sich mit einem anlegt, hat es mit beiden zu tun.`});
  showResult(true,'SPEZLN!',`${esc(a)} und deine Bande halten jetzt zusammen.`,'Kein Angriff mehr gegeneinander · Hilfe im Überfall · Geld schicken ab morgen','c-clean',true);
})}
function declineAlly(id){return famRun(async()=>{
  if(srvShop()){if(await shopAct('spezl',{op:'nein',id}))toast('Anfrage abgelehnt.','ev');return}
  await q(sb.from('alliances').update({status:'no'}).eq('id',id).eq('status','ask'));
  toast('Anfrage abgelehnt.','ev');
})}
function endAlly(){return famRun(async()=>{
  const x=allyRow(me.id); if(!x||x.status!=='on')return; const o=allyOf(me.id);
  if(srvShop()){if(await shopAct('spezl',{op:'ende'}))toast('👋 Das Bündnis endet in 24 Stunden.','ev');return}
  const r=await q(sb.from('alliances').update({status:'ending',ends_at:now()+ALLY_END}).eq('id',x.id).eq('status','on').select());
  if(!r||!r[0])return;
  await addEvent({kind:'ally',actor:me.id,txt:`👋 ${me.name} und ${ownerInfo(o).name} gehen in 24 Stunden getrennte Wege. Ganz in Ruhe.`});
  toast('👋 Das Bündnis endet in 24 Stunden.','ev');
})}
function betray(){return famRun(async()=>{
  const x=allyRow(me.id); if(!x)return; const o=allyOf(me.id); betrayAsk=null;
  if(srvShop()){if(!await shopAct('spezl',{op:'bruch'}))return;
    showResult(false,'VERRAT!',`Das Bündnis mit ${esc(ownerInfo(o).name)} ist sofort vorbei. Du darfst wieder angreifen.`,`🐍 7 Tage Verräter · ${esc(ownerInfo(o).name)} bekommt den Rache-Bonus gegen dich`,'c-heat',true);return}
  const r=await q(sb.from('alliances').update({status:'off',broken_by:me.id,off_at:now()}).eq('id',x.id).in('status',['on','ending']).select());
  if(!r||!r[0])return;
  await addEvent({kind:'betray',actor:me.id,target:o,txt:`🐍 VERRAT! ${me.name} hat das Bündnis mit ${ownerInfo(o).name} gebrochen. Eine Woche lang trägt ${me.name} die Schlange.`});
  showResult(false,'VERRAT!',`Das Bündnis mit ${esc(ownerInfo(o).name)} ist sofort vorbei. Du darfst wieder angreifen.`,`🐍 7 Tage Verräter · ${esc(ownerInfo(o).name)} bekommt den Rache-Bonus gegen dich`,'c-heat',true);
})}

/* --- Angebote: Tausch und Geld --- */
const PK=['f','t','b'];
function pk(p){p=jparse(p,{});const o={};PK.forEach(k=>{const v=Math.max(0,Math.floor(+p[k]||0));if(v)o[k]=v});return o}
function pkEmpty(p){return !PK.some(k=>p[k]>0)}
function pkTxt(p){const t=[];if(p.f)t.push(`${p.f} ${WARE.f.ico} ${WARE.f.name}`);if(p.t)t.push(`${p.t} ${WARE.t.ico} ${WARE.t.name}`);if(p.b)t.push(`${fmt(p.b)} Bargeld`);return t.join(' + ')||'nichts'}
function pkVal(p){return (p.f||0)*WARE.f.price+(p.t||0)*WARE.t.price}
function pkHave(p){return hasW(me,'f')>=(p.f||0)&&hasW(me,'t')>=(p.t||0)&&me.bar>=(p.b||0)}
function pkBook(p,sign){if(p.f)addWare('f',sign*p.f);if(p.t)addWare('t',sign*p.t);if(p.b)bk(sign>0?'offer':'loss',{bar:sign*p.b})}
function offerOpen(o){return o.status==='open'&&now()<+o.expires_at}
function myOffersOut(){return me?offers.filter(o=>o.from_p===me.id&&!o.gift&&offerOpen(o)):[]}
function myOffersIn(){return me?offers.filter(o=>o.to_p===me.id&&!o.gift&&offerOpen(o)&&players[o.from_p]):[]}
function offerBlock(o){
  if(!players[o]||o===me.id)return 'Nur mit anderen Mitspielern';
  if(!unlocked('ally'))return lockTxt('ally');
  if(myOffersOut().length>=OFFER_MAX)return `Höchstens ${OFFER_MAX} offene Angebote gleichzeitig`;
  if(tooYoung(o))return 'Handel geht erst, wenn beide Banden mindestens 7 Tage dabei sind';
  return null;
}
function offerCheck(give,want){
  if(pkEmpty(give)||pkEmpty(want))return 'Auf beiden Seiten muss etwas stehen. Geld ohne Gegenleistung geht nur im Bündnis.';
  if(!pkHave(give))return 'So viel hast du nicht';
  const cash=(give.b||0)+(want.b||0), val=pkVal(give)+pkVal(want);
  if(cash>2*val)return val?`Zu viel Bargeld: Für diese Ware höchstens ${fmt(2*val)}`:'Geld gegen Geld geht nicht';
  return null;
}
function offerVal(id){const el=document.getElementById(id);return el?Math.max(0,Math.floor(+String(el.value||'').replace(/\D/g,'')||0)):0}
function offerNewModal(o,err){
  const oi=ownerInfo(o), inp=(id,ph)=>`<input id="${id}" class="inp" inputmode="numeric" maxlength="6" placeholder="${ph}" autocomplete="off">`;
  return `<div class="mbox" role="dialog" aria-label="Angebot an ${esc(oi.name)}"><div class="mtop"><button class="back" data-act="gang" data-o="${o}" aria-label="Zurück">‹</button><h3>Angebot</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>
    <p class="small muted">An <b>${esc(oi.name)}</b>. Was du gibst, ist sofort reserviert. Das Angebot gilt 24 Stunden, danach oder bei Absage kommt alles zurück.</p>
    <div class="ofgrid"><span></span><small>${WARE.f.ico} Fusel</small><small>${WARE.t.ico} Teile</small><small>💵 Bargeld</small>
      <b>Du gibst</b>${inp('of_gf','0')}${inp('of_gt','0')}${inp('of_gb','0')}
      <b>Du willst</b>${inp('of_wf','0')}${inp('of_wt','0')}${inp('of_wb','0')}</div>
    <p class="small muted">Dein Lager: ${WARE.f.ico} ${hasW(me,'f')} · ${WARE.t.ico} ${hasW(me,'t')} · 💵 ${fmt(me.bar)}. Bargeld höchstens das Doppelte des Hehlerwerts der Ware (Fusel ${fmt(WARE.f.price)}, Teile ${fmt(WARE.t.price)}).</p>
    ${err?`<p class="warn">${err}</p>`:''}
    <button class="btn wide" data-act="offersend" data-o="${o}">📦 Angebot schicken</button></div>`;
}
function sendOffer(o){
  const give=pk({f:offerVal('of_gf'),t:offerVal('of_gt'),b:offerVal('of_gb')}), want=pk({f:offerVal('of_wf'),t:offerVal('of_wt'),b:offerVal('of_wb')});
  const bl=offerBlock(o)||offerCheck(give,want);
  if(bl){showModal(offerNewModal(o,bl));return}
  return famRun(async()=>{
    if(srvShop()){if(!await shopAct('angebot',{o,give,want},true))return;
      showResult(true,'ANGEBOT RAUS!',`${esc(ownerInfo(o).name)} hat 24 Stunden Zeit.`,`Du gibst ${pkTxt(give)} · du willst ${pkTxt(want)}`,'c-clean',true);return}
    pkBook(give,-1); await savePlayer();
    try{await q(sb.from('offers').insert({world:WORLD,ts:now(),from_p:me.id,to_p:o,give,want,expires_at:now()+OFFER_MS}))}
    catch(e){pkBook(give,1);await savePlayer();throw e}
    await addEvent({kind:'offer',actor:me.id,target:o,txt:`📦 ${me.name} bietet dir ${pkTxt(give)} für ${pkTxt(want)}.`});
    showResult(true,'ANGEBOT RAUS!',`${esc(ownerInfo(o).name)} hat 24 Stunden Zeit.`,`Du gibst ${pkTxt(give)} · du willst ${pkTxt(want)}`,'c-clean',true);
  });
}
function offerRow(o,inc){
  const who=esc(ownerInfo(inc?o.from_p:o.to_p).name), left=dur(Math.ceil((+o.expires_at-now())/1000)), can=inc&&pkHave(o.want);
  return `<div class="offer"><p>${inc?`<b>${who}</b> gibt dir <b>${pkTxt(o.give)}</b> und will <b>${pkTxt(o.want)}</b>.`:`An <b>${who}</b>: du gibst ${pkTxt(o.give)}, du willst ${pkTxt(o.want)}.`}</p><small class="muted">noch ${left}</small>
    <div class="acts">${inc?`<button class="btn sm" data-act="offerok" data-id="${o.id}" ${can?'':'disabled'}>${can?'✅ Annehmen':'Dir fehlt etwas'}</button><button class="btn ghost sm" data-act="offerno" data-id="${o.id}">Ablehnen</button>`:`<button class="btn ghost sm" data-act="offercxl" data-id="${o.id}">Zurückziehen</button>`}</div></div>`;
}
function offersModal(){
  const inc=myOffersIn(), out=myOffersOut();
  return `<div class="mbox" role="dialog" aria-label="Angebote"><div class="mtop"><span></span><h3>Angebote</h3><button class="back" data-act="close" aria-label="Schließen">×</button></div>
    <h4>An dich</h4>${inc.length?inc.map(o=>offerRow(o,true)).join(''):'<p class="small muted">Gerade nichts.</p>'}
    <h4>Von dir</h4>${out.length?out.map(o=>offerRow(o,false)).join(''):'<p class="small muted">Keine offenen Angebote.</p>'}
    <p class="small muted">Ein neues Angebot machst du in der Übersicht einer Bande (Rangliste → Bande antippen).</p>
    <button class="btn wide" data-act="close">Fertig</button></div>`;
}
function acceptOffer(id){return famRun(async()=>{
  const o=offers.find(x=>x.id===id); if(!o||!offerOpen(o)||o.to_p!==me.id)return;
  if(!pkHave(o.want)){toast('Dir fehlt etwas für dieses Angebot.','bad');return}
  if(srvShop()){if(!await shopAct('annehmen',{id},true))return;
    showResult(true,'HANDEL!',`Mit ${esc(ownerInfo(o.from_p).name)} ist alles abgemacht.`,`+${pkTxt(o.give)} · −${pkTxt(o.want)}`,'c-clean',true);return}
  let r=null;
  try{const {data,error}=await sb.rpc('offer_accept',{p_id:id,p_player:me.id});if(error)throw error;r=data}catch(e){toast('Dieses Angebot geht so nicht.','bad');return}
  if(!r){toast('Zu spät: Das Angebot gilt nicht mehr.','bad');return}
  pkBook(o.want,-1); pkBook(o.give,1); await savePlayer();
  const fn=ownerInfo(o.from_p).name;

let applyingOffers=false;
async function applyOffers(){
  if(!me||applyingOffers)return; applyingOffers=true; let ch=false;
  if(srvShop()){ // ab 5.1.2 bucht der Server; abgelaufene Angebote gibt er auf Anfrage zurück
    try{if(offers.some(o=>!o.gift&&o.status==='open'&&now()>+o.expires_at&&(o.from_p===me.id||o.to_p===me.id))){const x=await shopAct('angebote');if(x){toast('📦 Abgelaufene Angebote: alles ist wieder bei euch.','ev');await loadFam()}}}
    catch(e){console.warn(e)}
    applyingOffers=false; return;
  }
  try{
    for(const o of offers){
      try{
        if(o.from_p===me.id&&o.status==='open'&&now()>+o.expires_at){const r=await q(sb.from('offers').update({status:'exp'}).eq('id',o.id).eq('status','open').select());if(r&&r[0])Object.assign(o,normOffer(r[0]))}
        if(o.to_p===me.id&&o.gift&&o.status==='acc'&&!o.to_paid){
          const r=await q(sb.from('offers').update({to_paid:true}).eq('id',o.id).eq('to_paid',false).select()); o.to_paid=true;
          if(r&&r[0]){pkBook(o.give,1);ch=true;toast(`💸 ${ownerInfo(o.from_p).name} hat dir ${fmt(o.give.b||0)} Bargeld geschickt.`,'good')}
        }
        if(o.from_p===me.id&&!o.from_paid&&['acc','dec','exp','cxl'].includes(o.status)){
          const r=await q(sb.from('offers').update({from_paid:true}).eq('id',o.id).eq('from_paid',false).select()); o.from_paid=true;
          if(r&&r[0]){ch=true;const nm=ownerInfo(o.to_p).name;
            if(o.status==='acc'){pkBook(o.want,1);toast(`✅ ${nm} hat angenommen: +${pkTxt(o.want)}`,'good')}
            else{pkBook(o.give,1);if(o.status!=='cxl')toast(`📦 Angebot an ${nm} ${o.status==='dec'?'abgelehnt':'abgelaufen'}: ${pkTxt(o.give)} ist zurück.`,'ev')}}

function giftUsed(){const d=berlinDay();return offers.filter(o=>o.gift&&o.from_p===me.id&&dayOf(+o.ts)===d).reduce((a,o)=>a+(+o.give.b||0)+(+o.fee||0),0)}
function giftLeft(){return Math.max(0,GIFT_MAX-giftUsed())}
function giftBlock(o){
  if(!isAlly(o))return 'Geld schicken geht nur im Bündnis';

}

/* --- Großcoups --- */
const HEISTS=[
  {id:'bbank',d:'altstadt',place:'Altstadt',name:'Bundesbank-Filiale',line:'Der Tresor war offen. Also, nachdem ihr da wart.'},
  {id:'lebfab',d:'maxfeld',place:'Maxfeld',name:'Lebkuchen-Fabrik ausräumen',line:'Drei Tonnen Elisenlebkuchen. Der Christkindlesmarkt kann kommen.'},
  {id:'gnm',d:'altstadt',place:'Kartäusergasse',name:'Germanisches Nationalmuseum',line:'Der Dürer hängt jetzt in eurem Hinterzimmer. Steht ihm gut.'}];
const HEIST_E=3, HEIST_JOIN=2*HOUR, HEIST_PLAY=24*HOUR, HEIST_MAX=3, HEIST_RUF=40, HEIST_HEAT=8;
function heistOf(h){return HEISTS.find(x=>x.id===h.kind)||HEISTS[0]}
function heistMine(h){return h.members.find(m=>m.p===me.id)||null}
function heistNames(h){return h.members.map(m=>esc(ownerInfo(m.p).name)).join(', ')}
function heistOpen(){return heists.find(h=>now()<+h.join_until)||null}
function heistToday(){const d=berlinDay();return heists.some(h=>heistMine(h)&&dayOf(+h.ts)===d)}
function heistReady(){return heists.find(h=>{const m=heistMine(h);return m&&!m.r&&now()>=+h.join_until&&now()<+h.join_until+HEIST_PLAY&&h.members.length>=2})||null}
function heistShare(n){return Math.round((n>=3?25000:20000)*coupScale()/10)*10}
function heistStartBlock(){
  if(!unlocked('heist'))return lockTxt('heist');
  if(knastBlock())return '🚔 Aus dem Knast heraus geht das nicht';
  if(heistOpen())return 'Gerade plant schon jemand einen Großcoup';
  if(heistToday())return 'Heute warst du schon bei einem Großcoup dabei';
  const h=berlinHour(); if(h<8||h>=21)return 'Großcoups starten zwischen 8 und 21 Uhr';
  if(energyNow()<HEIST_E)return 'Zu wenig Energie';
  return null;
}
function heistJoinBlock(h){
  if(!unlocked('heist'))return lockTxt('heist');
  if(heistMine(h))return null;
  if(knastBlock())return '🚔 Aus dem Knast heraus geht das nicht';
  if(h.members.length>=HEIST_MAX)return 'Schon 3 Banden dabei';
  if(heistToday())return 'Heute warst du schon bei einem Großcoup dabei';
  if(energyNow()<HEIST_E)return 'Zu wenig Energie';
  return null;
}
function startHeist(id){return famRun(async()=>{

  for(const p of who)await addEvent({kind:'heist',actor:me.id,target:p.id,district:H.d,txt:`💰 ${me.name} plant einen Großcoup: ${H.name}. Steig in den nächsten 2 Stunden ein!`});

function joinHeist(id){return famRun(async()=>{

/* Ab Beta 5.0.2: vier Arten (bar, dial, pkt, lights), alle liefern done(mult,hits) wie bisher: hits 0–3, mult = .55 + hits*.25 + perfekt*.1 */
const GAMES={
  ueberfall:{title:'ÜBERFALL!',btn:'ZUSCHLAGEN'},
  uebernahme:{title:'TRESOR KNACKEN',btn:'KNACK!'},
  hack:{title:'FIREWALL HACKEN',btn:'ENTER'},
  coup:{title:'COUP!',btn:'LOS'}
};
const MG_HOW={
  bar:'Tippe, wenn der Zeiger im grünen Feld ist.',
  dial:'Das Rad dreht sich. Tippe, wenn die rote Kerbe im grünen Bogen ist.',
  pkt:'Tippe nur, wenn ein grünes Paket im Fenster ist. Rote auslassen!',
  lights:'Merk dir, wie die Lichter blinken, und tippe sie nach.'
};
const QUICK_HITS=2;
function mgMode(kind,g){return g.mode||(kind==='uebernahme'?'dial':kind==='hack'?'pkt':kind==='coup'?'lights':'bar')}
function mgMult(hits,perfect){return .55+hits*.25+perfect*.1}
let gameRAF=0, gameTok=0, mgEnd=null;
function playGame(kind,done,opt){
  const g={...(GAMES[kind]||GAMES.ueberfall),...(opt||{})};
  if(g.quick){showModal(quickHTML(g));
    document.getElementById('gquick').addEventListener('click',()=>{mgQuick=true;const tk=++gameTok;document.getElementById('gquick').disabled=true;setTimeout(()=>{if(tk===gameTok)done(mgMult(QUICK_HITS,0),QUICK_HITS)},250)});
    document.getElementById('gplay').addEventListener('click',()=>playGame(kind,done,{...g,quick:false}));
    return}
  const mode=mgMode(kind,g), tok=++gameTok; cancelAnimationFrame(gameRAF);
  mgQuick=false; if(g.fk&&srvFight())kampfStart(g.fk,g.fref);
  const body=mode==='dial'?dialSVG():mode==='pkt'?'<div class="lane" id="glane"><div class="win" id="gwin"></div></div>':mode==='lights'?lightsHTML():'<div class="track"><div class="zone" id="gz"></div><div class="needle" id="gn"></div></div>';
  showModal(`<div class="mbox mg-${mode}" role="dialog" aria-label="${g.title}">
    <h3 class="gt">${g.title}</h3>${g.sub?`<p class="subt">${g.sub}</p>`:''}<p class="subt how">${MG_HOW[mode]}</p>
    <div class="gdots"><i id="gd0"></i><i id="gd1"></i><i id="gd2"></i></div>
    ${body}
    <div class="fb" id="gfb">&nbsp;</div>
    ${mode==='lights'?'':`<button class="btn big wide" id="gbtn">${g.btn}</button>`}</div>`);
  const fb=document.getElementById('gfb'), widths=g.widths||[26,19,13];
  let round=0,hits=0,perfect=0,lock=false;
  const alive=()=>tok===gameTok&&document.getElementById('gfb')===fb;
  function mark(hit,perf,txt){
    document.getElementById('gd'+round).className=hit?'hit':'miss';
    if(hit)hits++; if(perf)perfect++;
    fb.textContent=txt||(perf?'PERFEKT!':hit?'TREFFER!':'DANEBEN!'); fb.style.color=hit?'var(--clean)':'var(--heat)';
    round++;
    if(round>=3){lock=true;cancelAnimationFrame(gameRAF);setTimeout(()=>{if(!alive())return;fb.textContent='…';setTimeout(()=>{if(tok===gameTok)done(mgMult(hits,perfect),hits)},400)},mode==='lights'?500:0);return true}
    return false;
  }
  mgEnd=()=>{while(!lock)mark(false,false)};
  const tap=fn=>{const b=document.getElementById('gbtn');b.addEventListener('pointerdown',e=>{e.preventDefault();if(!lock)fn()})};
  if(mode==='bar'){
    const zEl=document.getElementById('gz'), nEl=document.getElementById('gn');
    let speed=.85,phase=Math.random()*2,t0=performance.now(),zx=0,pos=0;
    const setZone=()=>{zx=5+Math.random()*(90-widths[round]);zEl.style.left=zx+'%';zEl.style.width=widths[round]+'%'};
    setZone();
    const loop=t=>{const x=((t-t0)/1000)*speed+phase;pos=(1-Math.abs((x%2)-1))*100;nEl.style.left=pos+'%';gameRAF=requestAnimationFrame(loop)};
    gameRAF=requestAnimationFrame(loop);
    tap(()=>{const w=widths[round], hit=pos>=zx&&pos<=zx+w, perf=hit&&Math.abs(pos-(zx+w/2))<2.5;
      if(!mark(hit,perf)){speed+=.35;setZone()}});
  }
  if(mode==='dial'){
    /* Eine Umdrehung dauert so lange wie ein Balken-Durchlauf, der Bogen ist so breit wie das grüne Feld: gleiche Chance wie beim Balken */
    const arc=document.getElementById('garc'), wheel=document.getElementById('gwheel');
    let speed=.85,dir=1,ang=90+Math.random()*180,last=performance.now();
    const setArc=()=>{const a=widths[round]*3.6/2, r=112, p=d=>[130+r*Math.sin(d*Math.PI/180),130-r*Math.cos(d*Math.PI/180)];
      const [x1,y1]=p(-a),[x2,y2]=p(a);arc.setAttribute('d',`M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`)};
    setArc();
    const loop=t=>{ang=(ang+dir*speed*360*(t-last)/1000+360)%360;last=t;wheel.setAttribute('transform',`rotate(${ang.toFixed(1)} 130 130)`);gameRAF=requestAnimationFrame(loop)};
    gameRAF=requestAnimationFrame(loop);
    tap(()=>{const d=Math.abs(((ang+180)%360)-180), hit=d<=widths[round]*1.8, perf=hit&&d<9;
      if(!mark(hit,perf)){speed+=.35;dir=-dir;setArc()}});
  }
  if(mode==='pkt'){
    /* Pakete fliegen von rechts nach links, pro Runde 0–2 rote und dann ein grünes */
    const lane=document.getElementById('glane'), win=document.getElementById('gwin'), PW=11;
    let speed=.85, x0=100, pk=[], t0=performance.now();
    const wx=()=>44-widths[round]/2;
    const setWin=()=>{win.style.left=wx()+'%';win.style.width=widths[round]+'%'};
    for(let r=0,x=104;r<3;r++){const nr=Math.floor(Math.random()*3);for(let k=0;k<=nr;k++){pk.push({r,g:k===nr,x,el:null});x+=30+Math.random()*10}x+=8}
    pk.forEach(p=>{p.el=document.createElement('div');p.el.className='pk '+(p.g?'g':'r');p.el.textContent=p.g?'📦':'🔥';lane.appendChild(p.el)});
    setWin();
    let off=0;
    const inWin=p=>{const c=p.x-off+PW/2;return c>=wx()&&c<=wx()+widths[round]};
    const close=()=>{pk.forEach(p=>{if(p.r===round-1)p.el.classList.add('done')});if(round<3){speed+=.35;setWin()}};
    const loop=t=>{const dt=(t-t0)/1000;t0=t;off+=dt*speed*100*.6;
      pk.forEach(p=>{p.el.style.left=(p.x-off)+'%'});
      const gp=pk.find(p=>p.r===round&&p.g);
      if(!lock&&gp&&gp.x-off+PW/2<wx()){mark(false,false,'ZU SPÄT!');close()}
      if(!lock)gameRAF=requestAnimationFrame(loop)};
    gameRAF=requestAnimationFrame(loop);
    tap(()=>{const p=pk.find(q=>q.r===round&&inWin(q));
      if(p&&p.g){const c=p.x-off+PW/2, perf=Math.abs(c-(wx()+widths[round]/2))<2.5;p.el.classList.add('hit');mark(true,perf);close()}
      else{if(p)p.el.classList.add('bad');mark(false,false,p?'FINGER WEG!':'DANEBEN!');close()}});
  }
  if(mode==='lights'){
    /* Wie Senso: jede Runde blinkt die Folge ein Licht länger, Länge der letzten Runde = g.lv (leicht 3, mittel 4, schwer 5) */
    const lv=g.lv||4, L=[0,1,2,3].map(i=>document.getElementById('gl'+i)), seq=[];
    while(seq.length<lv)seq.push(Math.floor(Math.random()*4));
    let want=[],pos=0,t1=0,busy=true;
    const flash=(i,ms)=>{L[i].classList.add('on');setTimeout(()=>{if(alive())L[i].classList.remove('on')},ms)};
    const play=()=>{busy=true;want=seq.slice(0,lv-2+round);pos=0;fb.textContent='GUT AUFPASSEN!';fb.style.color='var(--yellow)';
      const step=Math.max(340,620-(lv-3)*50-round*70);
      want.forEach((i,k)=>setTimeout(()=>{if(alive())flash(i,step*.6)},700+k*step));
      setTimeout(()=>{if(!alive())return;busy=false;t1=performance.now();fb.textContent='DU BIST DRAN!';fb.style.color='var(--paper)'},700+want.length*step)};
    L.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(busy||lock)return;flash(i,180);
      if(i!==want[pos]){busy=true;mark(false,false,'FALSCH!');if(round<3)setTimeout(()=>{if(alive())play()},900);return}
      pos++;
      if(pos>=want.length){busy=true;const perf=performance.now()-t1<want.length*380;mark(true,perf,perf?'PERFEKT!':'RICHTIG!');if(round<3)setTimeout(()=>{if(alive())play()},900)}}));
    play();
  }
}

function fmt(n){n=Math.round(n);const a=Math.abs(n);
  if(a>=1e6)return (n/1e6).toFixed(1).replace('.',',')+' Mio';
  if(a>=1e4)return Math.round(n/1e3)+'k';
  if(a>=1e3)return (n/1e3).toFixed(1).replace('.',',')+'k';
  return String(n)}
function de(n,d){return n.toFixed(d).replace('.',',')}
function pct(x){return Math.round(x*100)+' %'}
function dur(sec){if(sec<60)return sec+' s';const m=Math.round(sec/60);if(m<60)return m+' Min';const h=Math.floor(m/60);return h+' Std'+(m%60?' '+(m%60)+' Min':'')}
function ago(ts){const s=Math.round((now()-ts)/1000);if(s<60)return 'gerade eben';return 'vor '+dur(s)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function bindMap(svg){
  const ptrs=new Map(); let g=null;
  const pt=e=>({x:e.clientX,y:e.clientY});
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  svg.addEventListener('pointerdown',e=>{
    try{svg.setPointerCapture(e.pointerId)}catch(_){}
    ptrs.set(e.pointerId,pt(e));
    const r=svg.getBoundingClientRect();
    if(ptrs.size===1){const t=e.target.closest&&e.target.closest('[data-d]'),cp=e.target.closest&&e.target.closest('[data-coup]');g={mode:'tap',s:pt(e),v:{...view},r,target:t?t.dataset.d:null,coup:cp?cp.dataset.coup:null}}
    else if(ptrs.size===2){const [a,b]=[...ptrs.values()];g={mode:'pinch',d0:dist(a,b)||1,m0:mid(a,b),v:{...view},r}}
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)||!g)return;
    ptrs.set(e.pointerId,pt(e));
    if(g.mode==='pinch'&&ptrs.size>=2){
      const [a,b]=[...ptrs.values()], m1=mid(a,b), ratio=g.d0/(dist(a,b)||1);
      const k0=g.v.w/g.r.width, nw=clamp(g.v.w*ratio,120,ZMAX), k1=nw/g.r.width;
      const ux=g.v.x+(g.m0.x-g.r.left)*k0, uy=g.v.y+(g.m0.y-g.r.top)*k0;
      view={x:ux-(m1.x-g.r.left)*k1,y:uy-(m1.y-g.r.top)*k1,w:nw,h:0};
      applyView(); hintDone=true; return;
    }
    const p=pt(e), dx=p.x-g.s.x, dy=p.y-g.s.y;
    if(g.mode==='tap'&&Math.hypot(dx,dy)>7){g.mode='pan';svg.classList.add('drag')}
    if(g.mode==='pan'){const k0=g.v.w/g.r.width;view={x:g.v.x-dx*k0,y:g.v.y-dy*k0,w:g.v.w,h:g.v.h};applyView();hintDone=true}
  });
  const end=e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.delete(e.pointerId);
    if(g&&g.mode==='tap'&&ptrs.size===0&&e.type==='pointerup'){if(g.coup==='truck')showModal(truckModal());else if(g.coup&&g.coup.indexOf('smug:')===0)showModal(smugModal(+g.coup.slice(5)));else if(g.coup&&g.coup.indexOf('lm:')===0){ui.atkN=null;showModal(lmModal(g.coup.slice(3)))}else if(g.coup)showModal(coupModal());else if(g.target)tapDistrict(g.target)}
    if(ptrs.size===1){const [p]=[...ptrs.values()];g={mode:'pan',s:p,v:{...view},r:svg.getBoundingClientRect()}}
    else if(ptrs.size===0){g=null;svg.classList.remove('drag')}
    lastTouch=now();
  };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{
    e.preventDefault(); const r=svg.getBoundingClientRect(), k0=view.w/r.width;
    const ux=view.x+(e.clientX-r.left)*k0, uy=view.y+(e.clientY-r.top)*k0;

  },{passive:false});
  svg.addEventListener('gesturestart',e=>e.preventDefault());
}

/* Finanzübersicht als Geldfluss: Bargeld kommt rein → Wäsche → Löhne → unterm Strich */
function finance(){
  const cash=[], fronts=[], rents=[]; let rk=0, full=0, wcap=0, fr=0, rent=0;
  mySlots().forEach(([s,d,i])=>{const T=TYPES[s.type];
    if(T.kind==='racket'){const isFull=curStock(s,d)>=cap(s,d)-1, v=prod(s,d);if(isFull)full++;else rk+=v;cash.push({s,d,i,v,full:isFull})}
    else if(T.kind==='front'){const w=washOf(s,d), u=T.clean*s.lvl;wcap+=w;fr+=u;fronts.push({s,d,i,w,u})}
    else if(T.kind==='immo'){const v=rentOf(s,d);rent+=v;rents.push({s,d,i,v})}});
  cash.sort((a,b)=>b.v-a.v); fronts.sort((a,b)=>b.w-a.w); rents.sort((a,b)=>b.v-a.v);
  const prot=protection(me.id)*1000*bossProtMul(me.id), wages=upkeepOf(me.crew), barIn=rk+prot;
  const above=washable(), poolBound=me.wash_pool!=null&&me.wash_pool<me.bar-me.reserve;
  // Steht genug Bargeld über der Reserve, wäscht jede Fassade mit voller Leistung.
  // Steht das Bargeld an der Reserve, wird nur gewaschen, was nach den Löhnen reinkommt.
  let wash, status;
  if(wcap<=0){wash=0;status='none'}
  else if(above>Math.max(50,wcap/12)){wash=wcap;status='full'}
  else{wash=clamp(barIn-wages,0,wcap);status=wash>=wcap-1?'full':wash>0?'inflow':'paused'}
  const barNet=barIn-wash-wages, clean=wash*.9+fr+rent;
  const quote=barIn>0?Math.min(1,wash/barIn):(wash>0?1:0);
  const toReserve=status==='full'&&barNet<0?above/(-barNet):Infinity;
  return {cash,fronts,rents,rk,full,prot,wages,barIn,wcap,wash,status,fr,rent,barNet,clean,quote,toReserve,poolBound};
}
function sgn(v){return (Math.round(v)>=0?'+':'−')+fmt(Math.abs(v))}
function washStatus(f){
  return {full:'volle Leistung',inflow:'wäscht nur, was reinkommt',paused:f.poolBound?'wartet auf neues Bargeld':'pausiert: Bargeld liegt an der Reserve',none:'keine Fassade'}[f.status];
}
function finTip(f){
  if(f.full)return `<p class="warn">💰 ${f.full} ${f.full===1?'Kasse voll – verdient':'Kassen voll – verdienen'} gerade nichts. <button class="minib" data-act="collectall">Kassieren</button></p>`;
  if(f.wages>f.barIn&&f.barIn+f.clean<f.wages)return `<p class="warn">⚠️ Deine Löhne sind höher als alles, was reinkommt. Fehlt Bargeld, zahlst du mit sauberem Geld, und ohne Lohn kündigen Leute.</p>`;
  if(f.status==='none')return `<p class="tip">💡 Noch keine Fassade: Bau einen Späti oder eine Shisha-Bar, sonst bleibt dein ganzes Geld Bargeld.</p>`;
  if(f.toReserve<48)return f.poolBound?`<p class="tip">💡 Du wäschst mehr, als reinkommt. In ca. ${dur(Math.max(60,Math.round(f.toReserve*3600)))} ist dein verdientes Bargeld gewaschen, danach wäschst du nur noch, was reinkommt. Dein Startgeld wird nie gewaschen.</p>`:`<p class="tip">💡 Du wäschst mehr, als reinkommt. Dein Bargeld sinkt in ca. ${dur(Math.max(60,Math.round(f.toReserve*3600)))} auf deine Reserve (${fmt(me.reserve)}), danach wäschst du nur noch, was reinkommt.</p>`;
  if(f.barIn-f.wages>f.wcap*1.05)return `<p class="tip">💡 Du verdienst mehr Bargeld, als du waschen kannst. Bau eine Fassade, sonst stapelt sich Bargeld, das bei einer Razzia zu 40 % weg ist.</p>`;
  if(f.status==='paused'&&f.poolBound)return `<p class="tip">💡 Deine Fassade wartet auf Bargeld. Gewaschen wird nur, was du verdienst, dein Startgeld bleibt dir zum Bauen. Bau ein Wettbüro, Hehlerlager oder einen Club.</p>`;
  if(f.status==='paused')return `<p class="tip">💡 Die Wäsche steht, weil dein Bargeld an der Reserve liegt. Mehr Einnahmen oder eine kleinere Reserve (unten bei Geldwäsche) bringen sie wieder in Gang.</p>`;
  return '';
}

  const lx=X(p.length-1), ly=Y(p[p.length-1]);

const VAPID_PUBLIC='BInOOcKFLbTCLb_sJ-8QsxOUvkhNxi4Y5BcYQpoNuzGVgDatA-I7uctO6ip7rBb3kwQtitfZVYC8kCf35oLk62w';
const PUSH_FLAG='imperium-push', PUSH_HIDE='imperium-push-hide';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function isStandalone(){try{return !!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))}catch(e){return false}}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent||'')}
function pushState(){
  const sup=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  if(!sup)return isIOS()&&!isStandalone()?'needs-home':'unsupported';
  if(Notification.permission==='denied')return 'denied';
  if(Notification.permission==='granted'&&lsGet(PUSH_FLAG)===me.id)return 'on';
  return 'off';
}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function saveSub(sub){
  const j=sub.toJSON();
  await q(sb.from('push_subs').upsert({endpoint:j.endpoint,player_id:me.id,world:WORLD,sub:j}));
  if(me.push_ok!==true){me.push_ok=true;try{await q(sb.from('players').update({push_ok:true}).eq('id',me.id))}catch(e){}}
}
async function enablePush(){
  const st=pushState();
  if(st==='needs-home'){toast('Öffne das Spiel über das Icon auf deinem Home-Bildschirm, dann klappt es.','ev');return}
  if(st==='unsupported'){toast('Dieses Gerät oder dieser Browser kann keine Mitteilungen empfangen.','bad');return}
  if(st==='denied'){toast('Mitteilungen sind blockiert. Erlaube sie in den Einstellungen für diese App.','bad');return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Ohne Erlaubnis keine Mitteilungen. Du kannst es später nochmal versuchen.','ev');render();return}
    const reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    await saveSub(sub);
    lsSet(PUSH_FLAG,me.id);
    toast('🔔 Mitteilungen sind an. Du erfährst sofort, wenn dich jemand angreift.','good');
    await claimRadio();
  }catch(e){console.warn(e);toast('Mitteilungen konnten nicht eingeschaltet werden.','bad')}
  closeModal(); render();
}
async function refreshPush(){
  try{
    if(!('serviceWorker' in navigator)||!('Notification' in window)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.register('sw.js');
    const sub=await reg.pushManager.getSubscription();
    if(sub){await saveSub(sub);lsSet(PUSH_FLAG,me.id);claimRadio()}
  }catch(e){console.warn(e)}
}

/* Neue Version erkennen: version.json liegt neben index.html bei GitHub */
let newVersion=null, lastVCheck=0;
async function checkVersion(focus){
  if(focus&&newVersion&&autoReload())return;
  if(now()-lastVCheck<15000)return; lastVCheck=now();
  try{
    if(typeof fetch!=='function')return;
    const r=await fetch('version.json?t='+now(),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if(j&&j.version&&j.version!==CURRENT_VERSION&&j.version!==newVersion){
      newVersion=j.version; dirty=true; updBar(); updateMenuBtn();
      if(focus&&autoReload())return; // Ab 4.5.1: beim Zurückkommen in die App gleich neu laden
      toast(`🔄 Neue Version ${j.version} ist da. Tipp oben auf „Jetzt laden“.`,'ev');
      if(ui.tab==='stadt'&&document.getElementById('chips'))document.getElementById('chips').innerHTML=overlayHTML();
    }
  }catch(e){}
}
function doReload(){
  const base=location.href.split('#')[0].split('?')[0];
  location.replace(base+'?v='+encodeURIComponent(newVersion||now()));
}

/* ---------- Ab Beta 5.0: Tag und Nacht nach echter Uhrzeit (Sonnenauf- und -untergang in Nürnberg), nur Optik ---------- */
const SUN_LAT=49.45, SUN_LON=11.08;
function sunTimes(ms){
  const rad=Math.PI/180, J=ms/86400000+2440587.5, n=Math.round(J-2451545+0.0008), Js=n-SUN_LON/360;
  const M=(357.5291+0.98560028*Js)%360, C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const lam=(M+C+180+102.9372)%360, Jt=2451545+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*lam*rad);
  const dec=Math.asin(Math.sin(lam*rad)*Math.sin(23.4397*rad));
  const cw=(Math.sin(-0.833*rad)-Math.sin(SUN_LAT*rad)*Math.sin(dec))/(Math.cos(SUN_LAT*rad)*Math.cos(dec)), w=Math.acos(clamp(cw,-1,1))/rad;
  const toMs=j=>(j-2440587.5)*86400000;
  return {rise:toMs(Jt-w/360),set:toMs(Jt+w/360)};
}
// 'day', 'dusk' (40 Min. um Auf- und Untergang) oder 'night'
function dayPhase(t){t=t||now();const s=sunTimes(t),D=40*60000;if(t>s.rise+D&&t<s.set-D)return 'day';if(Math.abs(t-s.rise)<=D||Math.abs(t-s.set)<=D)return 'dusk';return 'night'}
function applyPhase(){const svg=document.getElementById('mapsvg'),box=document.getElementById('mapbox');if(!svg)return;const p=dayPhase();['day','dusk','night'].forEach(k=>{svg.classList.toggle(k,k===p);if(box)box.classList.toggle(k,k===p)})}
